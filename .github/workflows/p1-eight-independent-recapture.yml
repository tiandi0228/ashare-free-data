name: P1 eight issuer independent SHA recapture (RESEARCH ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p1-eight-independent-recapture
  cancel-in-progress: false

jobs:
  independent_recap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline validation first
        run: |
          python -m unittest discover -s tests -v
      - name: Download exact original dated roster artifact
        run: |
          gh run download 39613467121 --repo "$GITHUB_REPOSITORY" --name ashare-BAOSTOCK-two-dated-rosters-PIT-UNVERIFIED --dir originals
      - name: Pack bounded original roster inputs without publication
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          root=Path("originals")
          expected={"quality.json"}|{f"{prefix}{d}.csv" for prefix in ("all_securities_","mainboard_prefix_") for d in ("2025-05-26","2026-10-20")}
          files=list(root.iterdir())
          assert {p.name for p in files} == expected
          assert all(p.is_file() and 0 < p.stat().st_size <= 2_000_000 for p in files)
          with ZipFile("rosters_local_only.zip","w",compression=ZIP_STORED) as z:
              for p in sorted(files):z.write(p,arcname=p.name)
          PY
      - name: Install free vendor client
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Acquire independently (eight capped source queries, no orders)
        run: |
          timeout 165s python -m collector.p1_early_only_recovery --artifact rosters_local_only.zip --out audit/second_quality.json
      - name: Compare original capture metadata and independently reacquired source SHA
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          previous=json.loads(Path("reports/p1_early_only_8_historical_research_20261022.json").read_text())
          first=previous["source_quality"]
          first["capture_run_id"]=previous["capture_run_id"]
          current=json.loads(Path("audit/second_quality.json").read_text())
          current["capture_run_id"]=int(os.environ["GITHUB_RUN_ID"])
          Path("audit/first_quality_metadata.json").write_text(json.dumps(first,indent=2)+"\n")
          Path("audit/second_quality.json").write_text(json.dumps(current,indent=2)+"\n")
          PY
          python -m collector.p1_eight_reacquire_compare --first audit/first_quality_metadata.json --second audit/second_quality.json --out audit/independent_comparison.json
      - name: Prohibit promotion of research captures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in (Path("audit/second_quality.json"),Path("audit/independent_comparison.json")):
              if p.exists():
                  q=json.loads(p.read_text())
                  assert q["trade_gate"]=="BLOCKED" and q["orders"]==[]
                  assert q["official_historical_PIT_universe_verified"] is False
          print("Research only; no trading authorization")
          PY
      - name: Publish metadata only (never vendor raw prices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-eight-independent-recapture-metadata-only-BLOCKED
          path: audit/
          if-no-files-found: warn
          retention-days: 14
