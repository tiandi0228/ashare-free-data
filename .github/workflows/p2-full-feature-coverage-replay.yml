permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code and aligned frozen checkpoint from main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout the original CSV archive research branch
        uses: actions/checkout@v4
        with:
          ref: research-csv-archive
          path: archived-research
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout the durable P2 feature receipts and summary branch
        uses: actions/checkout@v4
        with:
          ref: p2-feature-coverage
          path: durable-p2
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact epoch binding, immutable receipt membership and original CSV coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from collector.p1_checkpoint import validate
          sha='5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022'
          epoch=sha[:16]
          ck=Path('evidence/checkpoints')/(sha+'.json')
          original=Path('archived-research')/epoch
          summary=Path('durable-p2/summaries')/(epoch+'.json')
          receipts=Path('durable-p2/reports')/epoch
          if not all(p.exists() for p in (ck,original,summary,receipts)):
              raise SystemExit('aligned original/checkpoint/summary/receipts missing')
          ledger=json.loads(ck.read_text())
          validate(ledger)
          marker=json.loads((original/'archive_status.json').read_text())
          previous=json.loads(summary.read_text())
          assert ledger['source_sha256']==sha and ledger['completed_shards']==241
          assert marker['source_sha256']==sha and marker['trade_gate']=='BLOCKED'
          assert len(marker['archived_shards'])==241
          assert previous['phase']=='P2_PERSISTENT_ARCHIVE_FEATURE_COVERAGE'
          assert previous['source_epoch_sha256']==sha
          assert previous['observed_archived_shards']==241
          assert previous['feature_complete_shards']==226
          assert previous['trade_gate']=='BLOCKED' and previous['historical_PIT_verified'] is False
          assert previous['orders']==[] and previous['executable_candidates']==[]
          runs=sorted(receipts.glob('*.json'))
          assert 0<len(runs)<=1000, 'historical receipts missing/unbounded'
          for p in runs:
              json.loads(p.read_text())
          print('P2_PINNED_BRANCH_INPUTS',json.dumps({
              'epoch':sha,'checkpoint_completed_shards':241,'original_archived_shards':241,
              'previous_summary_feature_complete':226,
              'historical_receipts':len(runs),
              'original_archive_git_commit':subprocess.check_output(
                  ['git','-C','archived-research','rev-parse','HEAD'],text=True).strip(),
              'durable_receipts_git_commit':subprocess.check_output(
                  ['git','-C','durable-p2','rev-parse','HEAD'],text=True).strip(),
              'trade_gate':'BLOCKED'},sort_keys=True))
          PY
      - name: Replay SHA-verified archived originals and each stored feature receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/p2_current_full_replay
          python -m collector.p2_feature_coverage_ledger \
            --archive-epoch archived-research/5ba00fbd720fad90 \
            --checkpoint evidence/checkpoints/5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022.json \
            --receipts durable-p2/reports/5ba00fbd720fad90 \
            --out reports/p2_current_full_replay/recomputed.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('durable-p2/summaries/5ba00fbd720fad90.json').read_text())
          actual=json.loads(Path('reports/p2_current_full_replay/recomputed.json').read_text())
          keys=['phase','status','source_epoch_sha256','checkpoint_completed_shards',
                'checkpoint_total_shards','archived_original_shards','observed_archived_shards',
                'feature_complete_shards','observed_with_feature_gaps_shards',
                'unobserved_archived_shards','feature_issuer_count','issuer_evidence_gap_count',
                'observed_feature_or_gap_issuers','unobserved_issuer_count',
                'full_archive_evidence_accounted','full_archive_feature_coverage']
          diff={k:[expected.get(k),actual.get(k)] for k in keys
                if expected.get(k)!=actual.get(k)}
          if diff:raise SystemExit('REPLAY_MISMATCH '+json.dumps(diff,ensure_ascii=False))
          assert actual['feature_complete_shards']==226
          assert actual['observed_archived_shards']==241
          assert actual['observed_with_feature_gaps_shards']==15
          assert actual['unobserved_archived_shards']==0
          assert actual['trade_gate']=='BLOCKED'
          assert actual['orders']==[] and actual['executable_candidates']==[]
          assert actual['historical_PIT_verified'] is False
          report={
              'phase':'P2_CURRENT_SAME_EPOCH_ORIGINAL_CSV_FULL_REPLAY',
              'source_epoch_sha256':actual['source_epoch_sha256'],
              'feature_complete_shards':226,
              'observed_archived_shards':241,
              'feature_coverage_pct':round(100*226/241,2),
              'feature_gap_shards':15,'issuer_feature_gaps':actual['issuer_evidence_gap_count'],
              'previous_summary_and_full_original_replay_match':True,
              'original_CSVs_independently_replayed_in_this_run':True,
              'historical_PIT_verified':False,
              'official_market_state_certified':False,
              'overall_P2_project_completion_pct':None,
              'trade_gate':'BLOCKED','orders':[],'executable_candidates':[]}
          Path('reports/p2_current_full_replay/verified.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('P2_FULL_ORIGINAL_REPLAY_SUCCESS',json.dumps(report,ensure_ascii=False))
          PY
      - name: Reclassify all 16 source-verified gaps without modifying original data
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p2_original_gap_action_triage
          python -m collector.p2_original_gap_action_triage \
            --replayed-summary reports/p2_current_full_replay/recomputed.json \
            --out reports/p2_current_full_replay/gap_action_queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/gap_action_queue.json").read_text())
          assert r["reason_counts"]=={
              "VENDOR_SUSPENDED_IN_LAST_21_ROWS":15,
              "FEWER_THAN_21_VENDOR_ROWS_ASOF":1}
          assert r["unresolved_shards"]==15 and r["unresolved_issuers"]==16
          assert r["complete_feature_shards_promoted_by_triage"]==0
          assert r["history_backfill_authorized"] is False
          assert r["trade_gate"]=="BLOCKED" and r["orders"]==[]
          print("P2_GAP_ORIGINAL_TRIAGE_REPLAY_PASSED_NO_REPAIR")
          PY
      - name: Cross-check short IPO observation window against SSE official listing notice
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p2_601091_sse_ipo_crosswalk
          python -m collector.p2_601091_sse_ipo_crosswalk \
            --gap-triage reports/p2_current_full_replay/gap_action_queue.json \
            --out reports/p2_current_full_replay/601091_official_listing_crosswalk.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/601091_official_listing_crosswalk.json").read_text())
          assert r["issuer"]=="sh.601091"
          assert r["source_reference"]["listed_first_day"]=="2026-09-17"
          assert r["vendor_observed_rows"]==18
          assert r["observed_vendor_row_shortfall"]==3
          assert r["gap_resolved"] is False
          assert r["feature_complete_shards_promoted"]==0
          assert r["trade_gate"]=="BLOCKED" and r["orders"]==[]
          print("P2_IPO_SOURCE_DATE_MATCHED_NO_PHANTOM_BARS")
          PY
      - name: Crosswalk three issuer-authored halt/resume dates against source SHA original P2 gaps
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p3_three_issuer_halt_source_crosswalk
          python -m collector.p3_three_issuer_halt_source_crosswalk \
            --triage reports/p2_current_full_replay/gap_action_queue.json \
            --sources evidence/p3_issuer_halt_resume_three_research_refs.json \
            --out reports/p2_current_full_replay/three_issuer_halt_sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/p2_current_full_replay/three_issuer_halt_sources.json').read_text())
          assert r['reviewed_issuer_count']==3 and r['remaining_all_gap_issuer_count']==16
          assert r['feature_shards_promoted']==0 and r['research_feature_complete_shards']==226
          assert r['source_pdf_originals_byte_sha_verified'] is False
          assert r['trade_gate']=='BLOCKED' and r['orders']==[]
          print('P3_THREE_ISSUER_ANNOUNCEMENT_DATE_CROSSWALK_PASSED_RESEARCH_ONLY')
          PY
      - name: Validate four more issuer notices and ST effective-date exclusion
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p3_four_issuer_st_crosswalk
          python -m collector.p3_four_issuer_st_crosswalk \
            --triage reports/p2_current_full_replay/gap_action_queue.json \
            --sources evidence/p3_four_issuer_halt_st_research_refs.json \
            --out reports/p2_current_full_replay/four_issuer_st_research_refs.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/four_issuer_st_research_refs.json").read_text())
          assert r["new_issuer_sources_linked"]==4
          assert r["total_vendor_suspension_issuer_sources_linked"]==7
          assert r["remaining_vendor_suspension_issuers_without_source_links"]==8
          assert r["st_risk_exclusion"]["effective_from"]=="2026-09-30"
          assert r["st_risk_exclusion"]["non_st_mainboard_screen_allowed_from_effective_day"] is False
          assert r["feature_shards_promoted"]==0
          assert r["issuer_source_pdf_bytes_sha_verified"] is False
          assert r["trade_gate"]=="BLOCKED" and r["orders"]==[]
          print("P3_FOUR_ISSUER_ST_RESEARCH_REFERENCES_PASS_WITHOUT_TRADING_PIT_PROMOTION")
          PY
      - name: Verify 600363 historical halt and ST exclusion in P4 research date replay
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p4_historical_st_research_veto
          python -m collector.p4_historical_st_research_veto \
            --crosswalk reports/p2_current_full_replay/four_issuer_st_research_refs.json \
            --sample evidence/p4_st_historical_research_dates_600363.json \
            --out reports/p2_current_full_replay/p4_historical_st_research_veto.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/p4_historical_st_research_veto.json").read_text())
          assert r["approved_entries"]==0
          assert r["trade_gate"]=="BLOCKED" and r["orders"]==[]
          assert r["historical_PIT_verified"] is False
          assert r["production_trade_gate_implementation_verified"] is False
          found={x["signal_known_after_close_date"]:x["candidate_policy_research_state"]
                 for x in r["research_decisions"] if x["issuer"]=="sh.600363"}
          assert found["2026-09-29"]=="VETO_ISSUER_NOTICE_SUSPENDED_DAY"
          assert found["2026-09-30"]=="VETO_ISSUER_NOTICE_ST_EFFECTIVE"
          assert found["2026-10-20"]=="VETO_ISSUER_NOTICE_ST_EFFECTIVE"
          print("P4_HISTORICAL_ST_RESEARCH_VETO_TEST_PASSED_NOT_PRODUCTION")
          PY
      - name: Integrate dual-horizon candidate research with dated ST risk veto (synthetic adversarial)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p4_historical_st_dual_horizon_integration
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/p4_synthetic_dual_horizon_st_adversarial.json")
          a=json.loads(p.read_text())
          assert a["fixture_kind"]=="SYNTHETIC_ADVERSARIAL_UPSTREAM_OPTIMISM_NOT_REAL_PIT"
          samples=[
            {"issuer":row["issuer"],"signal_known_after_close_date":a["asof"],
             "research_only":True,"buy_signal":False}
            for row in a["symbols"]]
          assert len(samples)==2
          root=Path("reports/p2_current_full_replay")
          (root/"p4_dual_horizon_st_joined_inputs.json").write_text(json.dumps(samples,ensure_ascii=False,indent=2)+"\n")
          PY
          python -m collector.p4_historical_st_dual_horizon_integration \
            --crosswalk reports/p2_current_full_replay/four_issuer_st_research_refs.json \
            --research evidence/p4_synthetic_dual_horizon_st_adversarial.json \
            --risk-samples reports/p2_current_full_replay/p4_dual_horizon_st_joined_inputs.json \
            --out reports/p2_current_full_replay/p4_dual_horizon_st_integration.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/p4_dual_horizon_st_integration.json").read_text())
          assert r["assessed_issuers"]==2
          assert r["dated_issuer_notice_veto_count"]==1
          assert r["research_labels_safety_blocked"]==2
          assert r["orders"]==[] and r["executable_candidates"]==[]
          assert r["production_candidate_pipeline_integrated"] is False
          assert r["historical_PIT_verified"] is False and r["trade_gate"]=="BLOCKED"
          print("P4_HISTORICAL_ST_DUAL_HORIZON_END_TO_END_RESEARCH_BLOCKED")
          PY
      - name: Replay real archived P2 candidate ranking page and join official-notice ST research veto
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p4_real_archived_ranking_st_join
          python - <<'PY'
          import json
          from pathlib import Path
          from collector.p2_paged_real_archive import run, PAGE_SHARDS
          epoch=Path("archived-research/5ba00fbd720fad90")
          quality=sorted(epoch.glob("shard_*/quality.json"))
          indices=[int(p.parent.name[6:]) for p in quality]
          assert len(indices)==241 and 33 in indices
          selected_page=indices.index(33)//PAGE_SHARDS
          output=Path("reports/p2_current_full_replay/p2_real_paged_shard_0033.json")
          r=run("archived-research","evidence/checkpoints",output,
                page=selected_page,run_number=1)
          assert r["status"]=="PAGED_REAL_ARCHIVE_RESEARCH_ONLY"
          assert "shard_0033" in r["selected_shards"]
          assert r["source_epoch_sha256"]=="5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022"
          assert r["trade_gate"]=="BLOCKED" and r["orders"]==[]
          print("P2_REAL_ORIGINAL_RANKING_PAGE",selected_page,
                r["scoped_verified_issuers"],r["computed_feature_issuers"],
                r["missing_feature_evidence_issuers"])
          PY
          python -m collector.p4_real_archived_ranking_st_join \
            --page reports/p2_current_full_replay/p2_real_paged_shard_0033.json \
            --crosswalk reports/p2_current_full_replay/four_issuer_st_research_refs.json \
            --triage reports/p2_current_full_replay/gap_action_queue.json \
            --out reports/p2_current_full_replay/p4_real_original_ranked_st_join.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/p4_real_original_ranked_st_join.json").read_text())
          assert r["st_600363_source_gap_held_out_of_ranking"] is True
          assert r["st_600363_dated_veto_verified_in_research"] is True
          assert r["candidate_approvals"]==0 and r["trade_gate"]=="BLOCKED"
          assert r["orders"]==[] and r["executable_candidates"]==[]
          assert r["production_candidate_pipeline_integrated"] is False
          assert r["descriptive_ranked_original_issuers"]==len(r["real_original_candidate_rows"])
          print("P4_REAL_SOURCE_RANKING_NONEXECUTABLE_ST_JOIN_PASSED")
          PY
      - name: Verify P0 historical development versus production and P1 live pinned 241/400 epoch
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p0_tencent_quote_probe tests.test_p0_p4_progress_snapshot
          python -m unittest -v tests.test_p0_p1_active_epoch_progress_reconciliation
          python -m collector.p0_p1_active_epoch_progress_reconciliation \
            --lock evidence/p1_active_roster.json \
            --active evidence/checkpoints/5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022.json \
            --legacy evidence/p1_checkpoint.json \
            --archive-status archived-research/5ba00fbd720fad90/archive_status.json \
            --p2-replay reports/p2_current_full_replay/verified.json \
            --p0-offline-ok \
            --out reports/p2_current_full_replay/p0_p1_source_epoch_corrected_progress.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/p2_current_full_replay/p0_p1_source_epoch_corrected_progress.json").read_text())
          assert r["P0"]["historical_development_pct_reported"]==100
          assert r["P0"]["current_full_production_acceptance_pct"] is None
          assert r["P0"]["production_approved"] is False
          assert r["P1"]["active_completed_shards"]==241
          assert r["P1"]["active_total_shards"]==400
          assert r["P1"]["active_coverage_pct"]==60.25
          assert r["P1"]["legacy_alias_completed_shards"]==44
