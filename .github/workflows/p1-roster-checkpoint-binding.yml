name: P1 pinned roster checkpoint binding offline (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p1_roster_checkpoint_binding.py'
      - 'tests/test_p1_roster_checkpoint_binding.py'
      - '.github/workflows/p1-roster-checkpoint-binding.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p1_roster_checkpoint_binding.py'
      - 'tests/test_p1_roster_checkpoint_binding.py'
      - '.github/workflows/p1-roster-checkpoint-binding.yml'
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SHA-pinned independent checkpoint binding
        run: python -m unittest -v tests.test_p1_roster_checkpoint_binding tests.test_p1_epoch_status tests.test_p1_checkpoint
      - name: Verify actual pinned vendor roster without authorizing trading
        run: |
          python -m collector.p1_roster_checkpoint_binding --out /tmp/p1_binding.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/p1_binding.json').read_text())
          assert d['status']=='MATCHED_UNVERIFIED_RESEARCH_EPOCH'
          assert d['matched_epoch']=='5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022'
          assert d['trade_gate']=='BLOCKED' and d['orders']==[] and d['executable_candidates']==[]
          assert d['historical_PIT_verified'] is False
          print('PASS: matching vendor research epoch, no certified market access')
          PY
