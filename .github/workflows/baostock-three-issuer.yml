name: A-share FREE independent three-issuer Baostock capacity (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/baostock_three.py'
      - '.github/workflows/baostock-three-issuer.yml'
permissions:
  contents: read
jobs:
  capped_three:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile collector/baostock_three.py
      - run: python -m pip install 'baostock>=0.8,<1'
      - name: Query exactly three issuer histories with no retry
        run: timeout 90s python -m collector.baostock_three --out evidence
      - name: Retain original data and SHA-256 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-BAOSTOCK-three-issuer-UNVERIFIED
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce source and no-trade invariants
        if: always()
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          q=json.loads(Path('evidence/quality.json').read_text())
          assert q['status']=='OBSERVED_3_ISSUERS_UNVERIFIED'
          assert q['login_attempts']==1 and q['query_attempts']==3
          assert q['paid_api_calls']==0 and q['trade_gate']=='BLOCKED'
          assert q['orders']==[] and q['executable_candidates']==[]
          assert q['historical_point_in_time_universe_verified'] is False
          for item in q['issuer_results']:
              assert item['status']=='OBSERVED_UNVERIFIED'
              path=Path('evidence',item['code'].replace('.','_')+'.csv')
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
          print('Three issuer alternative source research evidence verified. Formal P3/P4 BLOCKED')
          PY
