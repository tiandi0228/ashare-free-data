name: P2 gap prospective recovery plan (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p2_gap_recovery_plan.py'
      - 'collector/p2_full_refresh_manifest.py'
      - 'collector/p2_refresh_checkpoint.py'
      - 'collector/p2_refresh_batch_replay.py'
      - 'collector/p2_refresh_aggregate.py'
      - 'tests/test_p2_refresh_aggregate.py'
      - 'collector/p2_refresh_batch_observe.py'
      - 'tests/test_p2_refresh_provider_retry.py'
      - 'tests/test_p2_refresh_batch_replay.py'
      - 'tests/test_p2_refresh_checkpoint.py'
      - 'tests/test_p2_full_refresh_manifest.py'
      - 'collector/p2_residual_risk.py'
      - 'tests/test_p2_residual_risk.py'
      - 'collector/p2_gap_extension_replay.py'
      - 'tests/test_p2_gap_extension_replay.py'
      - 'tests/test_p2_gap_recovery_plan.py'
      - '.github/workflows/p2-gap-recovery-plan.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p2_gap_recovery_plan.py'
      - 'collector/p2_full_refresh_manifest.py'
      - 'collector/p2_refresh_checkpoint.py'
      - 'collector/p2_refresh_batch_replay.py'
      - 'collector/p2_refresh_aggregate.py'
      - 'tests/test_p2_refresh_aggregate.py'
      - 'collector/p2_refresh_batch_observe.py'
      - 'tests/test_p2_refresh_provider_retry.py'
      - 'tests/test_p2_refresh_batch_replay.py'
      - 'tests/test_p2_refresh_checkpoint.py'
      - 'tests/test_p2_full_refresh_manifest.py'
      - 'collector/p2_residual_risk.py'
      - 'tests/test_p2_residual_risk.py'
      - 'collector/p2_gap_extension_replay.py'
      - 'tests/test_p2_gap_extension_replay.py'
      - 'tests/test_p2_gap_recovery_plan.py'
      - '.github/workflows/p2-gap-recovery-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p2_gap_recovery_plan tests.test_p2_original_gap_window_triage tests.test_p2_gap_extension_replay tests.test_p2_residual_risk tests.test_p2_full_refresh_manifest tests.test_p2_refresh_checkpoint tests.test_p2_refresh_batch_replay tests.test_p2_refresh_aggregate.AggregateTests tests.test_p2_refresh_provider_retry -v
      - name: Replay pinned originals and coverage
        run: |
          set -euo pipefail
          git fetch --depth=1 origin cea3a55aa14805d7b6b776b44d3782a70be582e2
          git worktree add --detach "$RUNNER_TEMP/archive" FETCH_HEAD
          git fetch --depth=1 origin 6772f36217d39cfedad0cb5b70789bc7d2c16c99
          git worktree add --detach "$RUNNER_TEMP/coverage" FETCH_HEAD
          python -m collector.p2_gap_recovery_plan --coverage "$RUNNER_TEMP/coverage/summaries/5ba00fbd720fad90.json" --archive-epoch "$RUNNER_TEMP/archive/5ba00fbd720fad90" --out p2-gap-recovery.json
      - name: Install bounded historical query provider
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Prepare read-only full-universe refresh manifest (no additional collection)
        run: python -m collector.p2_full_refresh_manifest --coverage "$RUNNER_TEMP/coverage/summaries/5ba00fbd720fad90.json" --archive-epoch "$RUNNER_TEMP/archive/5ba00fbd720fad90" --out p2-full-refresh-manifest.json
      - name: Initialize full refresh checkpoint without provider calls
        run: python -m collector.p2_refresh_checkpoint --manifest p2-full-refresh-manifest.json --out p2-refresh-checkpoint.json
      - name: Recover fixed 112-batch checkpoint
        uses: actions/download-artifact@v4
        with:
          name: p2-gap-recovery
          run-id: 45924075237
          github-token: ${{ github.token }}
          path: previous-pilot
      - name: Reuse and verify pinned gap evidence (no redundant provider calls)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path("previous-pilot")
          plan=json.loads(Path("p2-gap-recovery.json").read_bytes())
          ext=json.loads((p/"p2-gap-extension/report.json").read_bytes())
          residual=json.loads((p/"p2-residual-risk/report.json").read_bytes())
          assert ext["trade_gate"]==residual["trade_gate"]=="BLOCKED"
          assert ext["orders"]==ext["executable_candidates"]==residual["orders"]==residual["executable_candidates"]==[]
          assert ext["issuer_count"]==24 and ext["new_cutoff_vendor_window_recovered"]==22
          assert residual["notice_explained"]==2
          by_code={r["issuer"]:r for r in plan["rows"]}
          for r in ext["results"]:
              code=r["issuer"]
              assert code in by_code and r["original_csv_sha256"]==by_code[code]["original_csv_sha256"]
              f=p/"p2-gap-extension"/r["filename"]
              assert f.is_file() and not f.is_symlink()
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r["extension_sha256"]
          for r in residual["results"]:
              assert r["notice_text_verified"] is True
              f=p/"p2-residual-risk"/(r["issuer"]+".pdf")
              assert f.is_file() and not f.is_symlink()
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r["pdf_sha256"]
          PY
          cp -a previous-pilot/p2-gap-extension previous-pilot/p2-residual-risk .
      - name: Revalidate prior originals and execute at most sixty-four additional batches
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/archive/5ba00fbd720fad90"
          python -m collector.p2_refresh_aggregate --manifest p2-full-refresh-manifest.json --archive-epoch "$ROOT" --packages previous-pilot/p2-batch-* --out previous-accepted.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("previous-accepted.json").read_text())
          assert r["accepted_batch_indices"]==list(range(112)) and r["accepted_issuers"]==896
          assert r["next_pending_batch"]==112 and r["trade_gate"]=="BLOCKED"
          assert r["manifest_sha256"]=="4a1383eed37e8befa49a0769ae583f093d5f355cc46366eb62dc56680b67ae0b"
          assert r["orders"]==r["executable_candidates"]==[]
          PY
          cp -a previous-pilot/p2-batch-* .
          # Retain serial bounded queries. Stop on the first failed batch.
          # Successful earlier packages remain available in the artifact.
          for i in $(seq 112 175); do
            package=$(printf 'p2-batch-%04d' "$i")
            timeout 180s python -m collector.p2_refresh_batch_observe --manifest p2-full-refresh-manifest.json --archive-epoch "$ROOT" --batch-index "$i" --out "$package"
            sleep 2
          done
          python -m collector.p2_refresh_aggregate --manifest p2-full-refresh-manifest.json --archive-epoch "$ROOT" --packages p2-batch-* --out p2-refresh-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("p2-refresh-aggregate.json").read_text())
          assert r["accepted_batch_indices"]==list(range(176)) and r["accepted_issuers"]==1408
          assert r["next_pending_batch"]==176 and r["trade_gate"]=="BLOCKED"
          assert r["orders"]==r["executable_candidates"]==[]
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: p2-gap-recovery
          path: |
            p2-gap-recovery.json
            p2-full-refresh-manifest.json
            p2-refresh-checkpoint.json
            p2-batch-*/
            previous-accepted.json
            p2-refresh-aggregate.json
            p2-gap-extension/
            p2-residual-risk/
          if-no-files-found: error
