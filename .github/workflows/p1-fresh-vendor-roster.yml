name: P1 fresh Baostock mainboard roster observation (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-fresh-vendor-roster.yml'
      - 'collector/p1_fresh_vendor_roster.py'
      - 'tests/test_p1_fresh_vendor_roster.py'
      - 'collector/p1_fresh_shard_plan.py'
      - 'tests/test_p1_fresh_shard_plan.py'
      - 'collector/p1_shard_ledger.py'
      - 'tests/test_p1_shard_ledger.py'
  schedule:
    - cron: '10 9 * * 1-5' # 17:10 Beijing weekdays
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline source tests
        run: python -m unittest tests.test_p1_fresh_vendor_roster tests.test_p1_fresh_shard_plan tests.test_p1_shard_ledger -v
      - name: Install free Baostock
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Observe current Beijing-date mainboard roster from free provider
        run: timeout 90s python -m collector.p1_fresh_vendor_roster --out evidence
      - name: Verify bounded original roster receipt
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          q=json.loads(Path('evidence/quality.json').read_text())
          assert q['status']=='OBSERVED_UNVERIFIED'
          assert q['mainboard_prefix_rows']>=1000
          assert hashlib.sha256(Path('evidence/mainboard.csv').read_bytes()).hexdigest()==q['mainboard_sha256']
          assert q['logical_queries']==1 and q['paid_api_calls']==0
          assert q['publisher_authenticated'] is False and q['historical_PIT_verified'] is False
          assert q['trade_gate']=='BLOCKED' and q['orders']==[] and q['executable_candidates']==[]
          print('PASS: fresh vendor snapshot observed; no historical PIT or tradability certification')
          PY
      - name: Build deterministic eight-issuer research batches from real roster
        run: |
          python -m collector.p1_fresh_shard_plan --source evidence/mainboard.csv --out evidence/shards --requested-day "$(TZ=Asia/Shanghai date +%F)"
          python - <<'PY'
          import json,hashlib,math
          from pathlib import Path
          q=json.loads(Path('evidence/quality.json').read_text())
          p=json.loads(Path('evidence/shards/plan.json').read_text())
          assert p['source_sha256']==q['mainboard_sha256']
          assert p['issuer_count']==q['mainboard_prefix_rows']
          assert p['shard_count']==math.ceil(q['mainboard_prefix_rows']/8)
          assert sum(s['count'] for s in p['shards'])==q['mainboard_prefix_rows']
          for s in p['shards']:
              assert hashlib.sha256(Path('evidence/shards',s['name']).read_bytes()).hexdigest()==s['sha256']
          assert p['historical_PIT_verified'] is False and p['trade_gate']=='BLOCKED'
          print('PASS: fresh vendor roster mapped to deterministic research shards; no historical PIT certification')
          PY
      - name: Recover prior successful ledger only for identical roster SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('evidence/shards/plan.json').read_text())
          runs=json.loads(subprocess.check_output(['gh','run','list','--workflow','p1-fresh-vendor-roster.yml','--json','databaseId,conclusion','--limit','12']))
          for entry in runs:
              if entry['conclusion']!='success': continue
              rid=entry['databaseId']
              dest=Path('previous')
              download=subprocess.run(['gh','run','download',str(rid),'-n',f'p1-fresh-roster-{rid}','-D',str(dest)],capture_output=True,text=True)
              if download.returncode!=0: continue
              candidates=list(dest.rglob('ledger.json'))
              if not candidates:continue
              try:
                  ledger=json.loads(candidates[0].read_text())
                  if ledger['source_sha256']==p['source_sha256'] and ledger['shard_count']==p['shard_count']:
                      Path('evidence/prior_ledger.json').write_text(json.dumps(ledger))
                      print('Recovered same-roster ledger from run',rid)
                      break
              except (ValueError,KeyError,TypeError):pass
          PY
      - name: Choose next incomplete pair from same-roster ledger, or bounded date rotation
        id: pick
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,json,os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          q=json.loads(Path('evidence/shards/plan.json').read_text())
          pair_count=(q['shard_count']+1)//2
          idx=datetime.datetime.now(ZoneInfo('Asia/Shanghai')).date().toordinal()%pair_count
          prior=Path('evidence/prior_ledger.json')
          if prior.exists():
              ledger=json.loads(prior.read_text())
              done={e['index'] for e in ledger['completed']}
              idx=next((i for i in range(pair_count) if (2*i not in done or (2*i+1<q['shard_count'] and 2*i+1 not in done))),idx)
          first=idx*2
          print(f'first={first:04d}')
          print(f'second={first+1:04d}')
          print(f'has_second={str(first+1<q["shard_count"]).lower()}')
          PY
      - name: Fetch first real roster shard historical bars (bounded 8 only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/shards/plan.json').read_text())
          assert p['shard_count']>=1 and p['shards'][int('${{ steps.pick.outputs.first }}')]['count']<=8
          print('Real roster shard 0 SHA:',p['shards'][int('${{ steps.pick.outputs.first }}')]['sha256'])
          PY
          timeout 150s python -m collector.baostock_batch --manifest evidence/shards/shard_${{ steps.pick.outputs.first }}.txt --batch-index 0 --out evidence/first_shard
      - name: Fetch next real roster shard historical bars (bounded 8 only)
        if: steps.pick.outputs.has_second == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/shards/plan.json').read_text())
          assert p['shard_count']>=2 and p['shards'][int('${{ steps.pick.outputs.second }}')]['count']<=8
          print('Real roster shard 1 SHA:',p['shards'][int('${{ steps.pick.outputs.second }}')]['sha256'])
          PY
          timeout 150s python -m collector.baostock_batch --manifest evidence/shards/shard_${{ steps.pick.outputs.second }}.txt --batch-index 0 --out evidence/second_shard
      - name: Verify real roster-to-bars linkage and SHA receipts
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=json.loads(Path('evidence/shards/plan.json').read_text())
          s=json.loads(Path('evidence/first_shard/quality.json').read_text())
          assert s['manifest_sha256']==p['shards'][int('${{ steps.pick.outputs.first }}')]['sha256']
          assert 1<=s['issuer_count']<=8 and s['query_attempts']==s['issuer_count']
          assert s['status']=='OBSERVED_SUBSET_UNVERIFIED'
          assert s['trade_gate']=='BLOCKED' and not s['orders']
          for item in s['results']:
              assert item['status']=='OBSERVED_UNVERIFIED'
              raw=Path('evidence/first_shard',item['code'].replace('.','_')+'.csv').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==item['sha256']
          if '${{ steps.pick.outputs.has_second }}' != 'true':
              print('Only one final shard remains; no duplicate second acquisition')
              raise SystemExit(0)
          t=json.loads(Path('evidence/second_shard/quality.json').read_text())
          assert t['manifest_sha256']==p['shards'][int('${{ steps.pick.outputs.second }}')]['sha256']
          assert 1<=t['issuer_count']<=8 and t['query_attempts']==t['issuer_count']
          assert t['status']=='OBSERVED_SUBSET_UNVERIFIED'
          assert t['trade_gate']=='BLOCKED' and not t['orders']
          for item in t['results']:
              assert item['status']=='OBSERVED_UNVERIFIED'
              raw=Path('evidence/second_shard',item['code'].replace('.','_')+'.csv').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==item['sha256']
          assert set(x['code'] for x in s['results']).isdisjoint(x['code'] for x in t['results'])
          print('PASS: sixteen unique real roster-derived histories verified; NOT PIT-certified')
          PY
      - name: Reconcile observed shards into versioned source ledger
        run: |
          test -f evidence/shards/plan.json
          PRIOR_ARGS=()
          if test -f evidence/prior_ledger.json; then PRIOR_ARGS=(--prior evidence/prior_ledger.json); fi
          python -m collector.p1_shard_ledger --plan evidence/shards/plan.json "${PRIOR_ARGS[@]}" --receipt "${{ steps.pick.outputs.first == '' && '0' || steps.pick.outputs.first }}:evidence/first_shard/quality.json" ${{ steps.pick.outputs.has_second == 'true' && format('--receipt {0}:evidence/second_shard/quality.json', steps.pick.outputs.second) || '' }} --out evidence/ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/ledger.json').read_text())
          assert x['trade_gate']=='BLOCKED' and x['historical_PIT_verified'] is False
          assert x['completed_issuers']<=json.loads(Path('evidence/shards/plan.json').read_text())['issuer_count']
          print('AUDIT: source-bound completed issuers',x['completed_issuers'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-fresh-roster-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
