name: A-share FREE issuer listing lifecycle source audit (NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-listing-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baostock-once-listing-lifecycle
  cancel-in-progress: false

jobs:
  one_lifecycle_source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline source contract and safety tests before network
        run: python -m unittest discover -s tests -v
      - name: Install one free provider client
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Bounded one login and one listing lifecycle query, no retries
        run: timeout 85s python -m collector.baostock_listing_lifecycle --out evidence
      - name: Verify original source bytes against reported SHA without publishing raw CSV
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence/quality.json')
          assert p.exists(), 'No source failure receipt'
          q=json.loads(p.read_text(encoding='utf-8'))
          assert q['phase']=='P1_BAOSTOCK_LISTING_LIFECYCLE_CANDIDATE_AUDIT'
          assert q['login_attempts']==1 and q['logical_query_attempts']<=1
          assert q['paid_api_calls']==0 and q['trade_gate']=='BLOCKED'
          assert q['orders']==[] and q['executable_candidates']==[]
          assert q['source_exchange_authenticated'] is False
          assert q['historical_point_in_time_universe_verified'] is False
          if q['status']!='VENDOR_LIFECYCLE_CANDIDATE_OBSERVED_NOT_OFFICIAL_PIT':
              raise SystemExit('BLOCKED: source unavailable or incomplete; no official PIT claim')
          assert q['logical_query_attempts']==1 and q['mainboard_prefix_lifecycles']>=1000
          raw=Path('evidence',q['source_csv_name']).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==q['source_csv_sha256']
          assert len(raw)==q['source_csv_bytes']
          print('PASS: one free vendor lifecycle snapshot, not authenticated PIT membership')
          PY
      - name: Retain non-reconstructible source digest receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-one-Baostock-lifecycle-quality-only-NO-TRADES
          path: evidence/quality.json
          if-no-files-found: warn
          retention-days: 14
