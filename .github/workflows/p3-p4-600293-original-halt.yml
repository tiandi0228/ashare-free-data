name: P3 real 600293 original halt PDF evidence (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'manifests/p3_p4_600293_official_halt.json'
      - '.github/workflows/p3-p4-600293-original-halt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Fetch official original PDF and compare issuer and halt effective cue
        run: |
          python -m collector.p3_free_official_multi_issuer_probe --manifest manifests/p3_p4_600293_official_halt.json --out evidence/p3_600293
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path('evidence/p3_600293/quality.json').read_text())
          q=r['sources'][0]
          assert r['trade_gate']=='BLOCKED' and r['historical_PIT_eligible']==0
          assert q['original_bytes_verified'] and q['event_contents_certified']
          assert q['issuer']=='sh.600293' and q['event_kind']=='TRADING_HALT'
          assert not q['PIT_publication_verified']
          assert hashlib.sha256(Path('evidence/p3_600293/cninfo_600293_halt_20260929.pdf').read_bytes()).hexdigest()==q['sha256']
          print('REAL OFFICIAL 600293 PDF SHA',q['sha256'],'TEXTUAL CONTENT MATCHED, PIT NOT CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-600293-original-halt-${{ github.run_id }}
          path: evidence/p3_600293/
          retention-days: 90
