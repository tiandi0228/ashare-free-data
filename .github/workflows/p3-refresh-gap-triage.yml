name: P3 refresh gap frozen evidence triage (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p3_refresh_gap_triage.py'
      - 'collector/p3_residual_notice_bridge.py'
      - 'collector/p3_public_notice_leads.py'
      - 'collector/p3_exchange_originals.py'
      - 'collector/p3_initial_halt_original.py'
      - 'collector/p3_pinned_originals.py'
      - 'collector/p3_additional_originals.py'
      - 'collector/p3_next_originals.py'
      - 'collector/p3_resume_originals.py'
      - 'collector/p3_final_gap_leads.py'
      - 'collector/p3_unified_ledger.py'
      - 'collector/p3_last_originals.py'
      - 'collector/p3_final_cninfo_index.py'
      - 'tests/test_p3_final_cninfo_index.py'
      - 'tests/test_p3_last_originals.py'
      - 'tests/test_p3_unified_ledger.py'
      - 'tests/test_p3_final_gap_leads.py'
      - 'tests/test_p3_resume_originals.py'
      - 'tests/test_p3_next_originals.py'
      - 'tests/test_p3_additional_originals.py'
      - 'tests/test_p3_pinned_originals.py'
      - 'tests/test_p3_initial_halt_original.py'
      - 'tests/test_p3_exchange_originals.py'
      - 'tests/test_p3_residual_notice_bridge.py'
      - '.github/workflows/p3-refresh-gap-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable prior refresh evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15169345741/zip > frozen.zip
          echo '29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d  frozen.zip' | sha256sum -c -
      - name: Verify original vendor status and emit tasks
        run: python -m collector.p3_refresh_gap_triage --artifact frozen.zip --sha256 29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d --count 3194 --out p3-refresh-gap-triage.json
      - name: Independently bridge pinned official originals
        run: |
          python -m unittest tests.test_p3_residual_notice_bridge -v
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python -m collector.p3_residual_notice_bridge --artifact frozen.zip --queue p3-refresh-gap-triage.json --root p3-residual-originals --out p3-residual-bridge.json
      - name: Reconcile additional public notice leads
        run: python -m collector.p3_public_notice_leads --queue p3-refresh-gap-triage.json --bridge p3-residual-bridge.json --out p3-public-notice-leads.json
      - name: Revalidate all fifteen originals and build unified ledger offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest tests.test_p3_exchange_originals tests.test_p3_initial_halt_original tests.test_p3_pinned_originals tests.test_p3_additional_originals tests.test_p3_next_originals tests.test_p3_resume_originals tests.test_p3_final_gap_leads tests.test_p3_unified_ledger -v
          gh api repos/${{ github.repository }}/actions/artifacts/15206412835/zip > unified-source.zip
          python -m collector.p3_unified_ledger --archive unified-source.zip --queue p3-refresh-gap-triage.json --root p3-unified-originals --out p3-unified-ledger.json
      - name: Verify three remaining official PDF targets
        run: |
          python -m unittest tests.test_p3_last_originals -v
          python -m collector.p3_last_originals --ledger p3-unified-ledger.json --root p3-last-originals --out p3-last-originals.json
      - name: Resolve final issuer original via official announcement index
        run: |
          python -m unittest tests.test_p3_final_cninfo_index -v
          python -m collector.p3_final_cninfo_index --ledger p3-unified-ledger.json --prior p3-last-originals.json --root p3-final-cninfo-index --out p3-final-cninfo-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: p3-refresh-gap-triage
          path: |
            p3-refresh-gap-triage.json
            p3-residual-bridge.json
            p3-public-notice-leads.json
            p3-unified-ledger.json
            p3-last-originals.json
            p3-final-cninfo-index.json
            p3-final-cninfo-index/
            p3-last-originals/
            p3-unified-originals/
            p3-residual-originals/
          if-no-files-found: error
