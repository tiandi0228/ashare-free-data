name: P3 refresh gap frozen evidence triage (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p3_refresh_gap_triage.py'
      - 'collector/p3_residual_notice_bridge.py'
      - 'collector/p3_public_notice_leads.py'
      - 'collector/p3_exchange_originals.py'
      - 'collector/p3_initial_halt_original.py'
      - 'collector/p3_pinned_originals.py'
      - 'collector/p3_additional_originals.py'
      - 'tests/test_p3_additional_originals.py'
      - 'tests/test_p3_pinned_originals.py'
      - 'tests/test_p3_initial_halt_original.py'
      - 'tests/test_p3_exchange_originals.py'
      - 'tests/test_p3_residual_notice_bridge.py'
      - '.github/workflows/p3-refresh-gap-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable prior refresh evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15169345741/zip > frozen.zip
          echo '29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d  frozen.zip' | sha256sum -c -
      - name: Verify original vendor status and emit tasks
        run: python -m collector.p3_refresh_gap_triage --artifact frozen.zip --sha256 29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d --count 3194 --out p3-refresh-gap-triage.json
      - name: Independently bridge pinned official originals
        run: |
          python -m unittest tests.test_p3_residual_notice_bridge -v
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python -m collector.p3_residual_notice_bridge --artifact frozen.zip --queue p3-refresh-gap-triage.json --root p3-residual-originals --out p3-residual-bridge.json
      - name: Reconcile additional public notice leads
        run: python -m collector.p3_public_notice_leads --queue p3-refresh-gap-triage.json --bridge p3-residual-bridge.json --out p3-public-notice-leads.json
      - name: Replay four pinned originals without issuer network retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest tests.test_p3_exchange_originals tests.test_p3_initial_halt_original tests.test_p3_pinned_originals -v
          gh api repos/${{ github.repository }}/actions/artifacts/15202840379/zip > pinned-originals.zip
          python -m collector.p3_pinned_originals --archive pinned-originals.zip --queue p3-refresh-gap-triage.json --root p3-pinned-originals --out p3-pinned-originals.json
      - name: Verify two additional exchange notice originals
        run: |
          python -m unittest tests.test_p3_additional_originals -v
          python -m collector.p3_additional_originals --leads p3-public-notice-leads.json --pinned p3-pinned-originals.json --root p3-additional-originals --out p3-additional-originals.json
      - uses: actions/upload-artifact@v4
        with:
          name: p3-refresh-gap-triage
          path: |
            p3-refresh-gap-triage.json
            p3-residual-bridge.json
            p3-public-notice-leads.json
            p3-pinned-originals.json
            p3-additional-originals.json
            p3-additional-originals/
            p3-pinned-originals/
            p3-residual-originals/
          if-no-files-found: error
