name: P3 refresh gap frozen evidence triage (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p3_refresh_gap_triage.py'
      - 'collector/p3_residual_notice_bridge.py'
      - 'collector/p3_public_notice_leads.py'
      - 'collector/p3_exchange_originals.py'
      - 'collector/p3_initial_halt_original.py'
      - 'collector/p3_pinned_originals.py'
      - 'collector/p3_additional_originals.py'
      - 'collector/p3_next_originals.py'
      - 'collector/p3_resume_originals.py'
      - 'collector/p3_final_gap_leads.py'
      - 'collector/p3_unified_ledger.py'
      - 'collector/p3_last_originals.py'
      - 'collector/p3_final_cninfo_index.py'
      - 'collector/p3_complete_original_ledger.py'
      - 'collector/p3_risk_timeline.py'
      - 'collector/p3_interval_extension.py'
      - 'collector/p3_resume_index_extension.py'
      - 'collector/p3_delist_timeline.py'
      - 'tests/test_p3_delist_timeline.py'
      - 'tests/test_p3_resume_index_extension.py'
      - 'tests/test_p3_interval_extension.py'
      - 'tests/test_p3_risk_timeline.py'
      - 'tests/test_p3_complete_original_ledger.py'
      - 'tests/test_p3_final_cninfo_index.py'
      - 'tests/test_p3_last_originals.py'
      - 'tests/test_p3_unified_ledger.py'
      - 'tests/test_p3_final_gap_leads.py'
      - 'tests/test_p3_resume_originals.py'
      - 'tests/test_p3_next_originals.py'
      - 'tests/test_p3_additional_originals.py'
      - 'tests/test_p3_pinned_originals.py'
      - 'tests/test_p3_initial_halt_original.py'
      - 'tests/test_p3_exchange_originals.py'
      - 'tests/test_p3_residual_notice_bridge.py'
      - '.github/workflows/p3-refresh-gap-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable prior refresh evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15169345741/zip > frozen.zip
          echo '29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d  frozen.zip' | sha256sum -c -
      - name: Verify original vendor status and emit tasks
        run: python -m collector.p3_refresh_gap_triage --artifact frozen.zip --sha256 29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d --count 3194 --out p3-refresh-gap-triage.json
      - name: Independently bridge pinned official originals
        run: |
          python -m unittest tests.test_p3_residual_notice_bridge -v
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python -m collector.p3_residual_notice_bridge --artifact frozen.zip --queue p3-refresh-gap-triage.json --root p3-residual-originals --out p3-residual-bridge.json
      - name: Reconcile additional public notice leads
        run: python -m collector.p3_public_notice_leads --queue p3-refresh-gap-triage.json --bridge p3-residual-bridge.json --out p3-public-notice-leads.json
      - name: Replay all nineteen official originals offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest tests.test_p3_exchange_originals tests.test_p3_initial_halt_original tests.test_p3_pinned_originals tests.test_p3_additional_originals tests.test_p3_next_originals tests.test_p3_resume_originals tests.test_p3_final_gap_leads tests.test_p3_unified_ledger tests.test_p3_last_originals tests.test_p3_final_cninfo_index tests.test_p3_complete_original_ledger -v
          gh api repos/${{ github.repository }}/actions/artifacts/15208525769/zip > complete-source.zip
          python -m collector.p3_complete_original_ledger --archive complete-source.zip --queue p3-refresh-gap-triage.json --root p3-complete-originals --out p3-complete-original-ledger.json
      - name: Replay retrospective risk intervals and ST transitions
        run: |
          python -m unittest tests.test_p3_risk_timeline -v
          python -m collector.p3_risk_timeline --queue p3-refresh-gap-triage.json --ledger p3-complete-original-ledger.json --root p3-complete-originals --archive frozen.zip --out p3-risk-timeline.json
      - name: Verify additional resumption original against frozen interval
        run: |
          python -m unittest tests.test_p3_interval_extension -v
          python -m collector.p3_interval_extension --queue p3-refresh-gap-triage.json --timeline p3-risk-timeline.json --archive frozen.zip --root p3-interval-originals --out p3-interval-extension.json
      - name: Resolve two additional resumption notices from official index
        run: |
          python -m unittest tests.test_p3_resume_index_extension -v
          python -m collector.p3_resume_index_extension --queue p3-refresh-gap-triage.json --timeline p3-risk-timeline.json --prior p3-interval-extension.json --archive frozen.zip --root p3-resume-index-originals --out p3-resume-index-extension.json
      - name: Separate delisting and pending-decision tails from ordinary halts
        run: |
          python -m unittest tests.test_p3_delist_timeline -v
          python -m collector.p3_delist_timeline --queue p3-refresh-gap-triage.json --ledger p3-complete-original-ledger.json --bridge p3-residual-bridge.json --prior p3-resume-index-extension.json --archive frozen.zip --root p3-complete-originals --out p3-delist-timeline.json
      - uses: actions/upload-artifact@v4
        with:
          name: p3-refresh-gap-triage
          path: |
            p3-refresh-gap-triage.json
            p3-residual-bridge.json
            p3-public-notice-leads.json
            p3-complete-original-ledger.json
            p3-risk-timeline.json
            p3-interval-extension.json
            p3-resume-index-extension.json
            p3-delist-timeline.json
            p3-resume-index-originals/
            p3-interval-originals/
            p3-complete-originals/
            p3-residual-originals/
          if-no-files-found: error
