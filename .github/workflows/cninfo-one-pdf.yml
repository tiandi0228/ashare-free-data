name: P3 FREE CNINFO one issuer PDF disclosure probe (NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cninfo-one-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one_issuer_pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify all offline source tamper/no-trade tests
        run: |
          python -m py_compile collector/cninfo_issuer_pdf_probe.py
          python -m unittest discover -s tests -v
      - name: Install PDF text extractor
        run: python -m pip install 'pypdf>=5,<7'
      - name: Fetch exactly one bounded issuer disclosure PDF; no retries
        run: timeout 50s python -m collector.cninfo_issuer_pdf_probe --out evidence
      - name: Enforce source integrity and trading prohibitions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/quality.json')
          assert p.exists(), 'Source report unavailable'
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['phase']=='P3_CNINFO_ISSUER_PDF_ONE_SOURCE_PROBE'
          assert r['attempted_gets']==1 and r['paid_api_calls']==0
          assert r['trade_gate']=='BLOCKED' and r['orders']==[]
          assert r['executable_candidates']==[]
          assert r['historical_point_in_time_universe_verified'] is False
          assert r['historical_ST_halt_delist_complete'] is False
          assert r['status']=='ISSUER_DISCLOSURE_SOURCE_OBSERVED_NOT_EXCHANGE_PIT'
          assert len(r['source_sha256'])==64
          assert r['risk_notice_expected_last_trading_date']=='2026-06-22'
          assert r['actual_exchange_delist_effective_date_verified_from_this_pdf'] is False
          print('PASS: CNINFO issuer PDF verified only as risk notice, official PIT BLOCKED')
          PY
      - name: Preserve only source SHA and metadata; do not redistribute PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-cninfo-one-issuer-PDF-quality-BLOCKED
          path: evidence/quality.json
          if-no-files-found: warn
          retention-days: 14
