name: P4 bounded current tail MA20 research pilot (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p4_current_tail_ma20_research.py'
      - 'tests/test_p4_current_tail_ma20_research.py'
      - 'collector/p4_current_tail_permanent_archive.py'
      - 'tests/test_p4_current_tail_permanent_archive.py'
      - 'collector/p4_daily_signal_query.py'
      - 'tests/test_p4_daily_signal_query.py'
      - 'collector/p4_real_archive_preflight.py'
      - 'tests/test_p4_real_archive_preflight.py'
      - '.github/workflows/p4-current-tail-ma20-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p4_current_tail_ma20_research.py'
      - 'tests/test_p4_current_tail_ma20_research.py'
      - 'collector/p4_current_tail_permanent_archive.py'
      - 'tests/test_p4_current_tail_permanent_archive.py'
      - 'collector/p4_daily_signal_query.py'
      - 'tests/test_p4_daily_signal_query.py'
      - 'collector/p4_real_archive_preflight.py'
      - 'tests/test_p4_real_archive_preflight.py'
      - '.github/workflows/p4-current-tail-ma20-pilot.yml'
  schedule:
    - cron: '30 11 * * 1-5' # 19:30 Beijing, after completed mainland session
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-current-tail-bounded-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify date, frozen overlap, full crossing inventory and no-trade boundaries
        run: python -m unittest tests.test_p4_current_tail_ma20_research tests.test_p4_current_tail_permanent_archive tests.test_p4_daily_signal_query tests.test_p4_real_archive_preflight -v

      - name: Read-only integration proof against REAL pinned P1 archival originals
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-source-smoke FETCH_HEAD
          python -m collector.p4_real_archive_preflight \
            --root archived-source-smoke/5ba00fbd720fad90 \
            --archive-commit "$(git -C archived-source-smoke rev-parse HEAD)" \
            --out evidence/p4-real-source-preflight.json

  capture_observation:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: offline_contracts
    permissions:
      contents: write # only the real bounded capture job archives permanent verified originals
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin immutable audited historical originals (NO P1 MUTATION)
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
          git -C archived-research rev-parse HEAD > evidence-pilot-archive-sha.txt
      - name: Independent frozen-source preflight before provider access
        run: |
          python -m collector.p4_real_archive_preflight \
            --root archived-research/5ba00fbd720fad90 \
            --archive-commit "$(cat evidence-pilot-archive-sha.txt)" \
            --out evidence/p4-real-source-preflight.json
      - name: Install only the free market-data SDK
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Collect at most eight archived issuers after frozen end date
        run: |
          mkdir -p evidence/p4-current-tail
          timeout 320s python -m collector.p4_current_tail_ma20_research \
            --mode capture \
            --root archived-research/5ba00fbd720fad90 \
            --out evidence/p4-current-tail \
            --archive-commit "$(cat evidence-pilot-archive-sha.txt)"
      - name: Independently recompute complete after-close research events
        run: |
          python -m collector.p4_current_tail_ma20_research \
            --mode verify \
            --root archived-research/5ba00fbd720fad90 \
            --out evidence/p4-current-tail
      - name: Persist only independently verified observations to immutable free Git archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p4_current_tail_permanent_archive \
            --mode archive \
            --epoch archived-research/5ba00fbd720fad90 \
            --source evidence/p4-current-tail \
            --source-run "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --archive-sha "$(cat evidence-pilot-archive-sha.txt)"
      - name: Re-fetch permanent Git branch and replay every archived source byte
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-readback FETCH_HEAD
          python -m collector.p4_current_tail_permanent_archive \
            --mode readback \
            --epoch archived-research/5ba00fbd720fad90 \
            --archive-root archived-readback \
            --source-run "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --archive-sha "$(cat evidence-pilot-archive-sha.txt)"
      - name: Query last seven calendar days from verified permanent Git originals
        run: |
          python - <<'PY'
          import json,subprocess
          from datetime import date,timedelta
          from pathlib import Path
          report=json.loads(Path("evidence/p4-current-tail/current_tail_report.json").read_text())
          end=date.fromisoformat(report["as_of_day"])
          start=max(end-timedelta(days=6),date(2026,10,21))
          args=["python","-m","collector.p4_daily_signal_query",
                "--archive-root","archived-readback",
                "--epoch","archived-research/5ba00fbd720fad90",
                "--start",start.isoformat(),"--end",end.isoformat(),
                "--out","evidence/p4-current-tail/last_7_day_research_query.json"]
          subprocess.run(args,check=True)
          result=json.loads(Path(args[-1]).read_text())
          assert result["trade_gate"]=="BLOCKED" and result["orders"]==[]
          assert not result["full_market_scan_performed"]
          assert result["strategy_buy_signals_authorized"]==0
          assert result["missing_days_are_not_zero_signals"] is True
          PY
      - name: Preserve source originals and audit for 14 days (NO TRADES)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-current-tail-RESEARCH-ONLY-${{ github.run_id }}
          path: |
            evidence-pilot-archive-sha.txt
            evidence/p4-real-source-preflight.json
            evidence/p4-current-tail/
          retention-days: 14
          if-no-files-found: warn
