name: P2 original CSV 21-bar gap root-cause audit (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p2_original_gap_window_triage.py'
      - 'collector/p2_gap_disposition.py'
      - 'manifests/p2_gap_explanations_20261020.json'
      - 'manifests/p2_gap_replay_fixture_20261020.json'
      - 'tests/test_p2_gap_disposition.py'
      - 'tests/test_p2_gap_disposition_archive_integration.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p2_gap_workflow_epoch_binding.py'
      - 'collector/p2_p3_current_source_guard.py'
      - 'tests/test_p2_p3_current_source_guard.py'
      - 'tests/test_p2_original_gap_window_triage.py'
      - '.github/workflows/p2-original-gap-window-triage.yml'
  workflow_run:
    workflows: ["P2 real archived research features observation (NO TRADES)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'collector/p2_original_gap_window_triage.py'
      - 'collector/p2_gap_disposition.py'
      - 'manifests/p2_gap_explanations_20261020.json'
      - 'manifests/p2_gap_replay_fixture_20261020.json'
      - 'tests/test_p2_gap_disposition.py'
      - 'tests/test_p2_gap_disposition_archive_integration.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p2_gap_workflow_epoch_binding.py'
      - 'collector/p2_p3_current_source_guard.py'
      - 'tests/test_p2_p3_current_source_guard.py'
      - 'tests/test_p2_original_gap_window_triage.py'
      - '.github/workflows/p2-original-gap-window-triage.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_p2_gap_disposition tests.test_p2_gap_disposition_archive_integration tests.test_p2_original_gap_window_triage tests.test_p2_real_archive_features tests.test_p2_p3_current_source_guard tests.test_p2_gap_workflow_epoch_binding tests.test_p1_active_migration_checkpoint
  pinned_archive_regression:
    if: github.event_name == 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ARCHIVE_COMMIT: 968b47863467ebfd00154e38cdf50851f3c3285b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay all 20 gaps against pinned original CSVs
        run: |
          git fetch --depth=1 origin "$ARCHIVE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/p2-pinned" "$ARCHIVE_COMMIT"
          P2_ARCHIVE_EPOCH="$RUNNER_TEMP/p2-pinned/5ba00fbd720fad90" python -m unittest -v tests.test_p2_gap_disposition_archive_integration
          python -m collector.p2_original_gap_window_triage --coverage manifests/p2_gap_replay_fixture_20261020.json --archive-epoch "$RUNNER_TEMP/p2-pinned/5ba00fbd720fad90" --out evidence/p2-pinned-replay.json
          python -m collector.p2_gap_disposition --replay evidence/p2-pinned-replay.json --pinned manifests/p2_gap_explanations_20261020.json --out evidence/p2-pinned-disposition.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          r = json.loads(Path("evidence/p2-pinned-disposition.json").read_text())
          assert (r["explained_feature_unavailable"], r["review_required"], r["feature_gaps_resolved"]) == (20, 0, 0)
          assert Counter(x["reason"] for x in r["rows"]) == {
              "HALT_INTERRUPTS_FEATURE_WINDOW": 17, "HALTED_AT_CUTOFF": 2, "IPO_WINDOW_TOO_SHORT": 1,
          }
          assert r["trade_gate"] == "BLOCKED" and r["historical_PIT_verified"] is False
          import hashlib, os
          out = Path("evidence")
          names = ("p2-pinned-replay.json", "p2-pinned-disposition.json")
          receipt = {
              "kind": "PINNED_ARCHIVE_REGRESSION_NOT_LIVE_COVERAGE",
              "archive_commit": os.environ["ARCHIVE_COMMIT"],
              "tested_commit": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "asof": r["asof"],
              "source_epoch_sha256": r["source_epoch_sha256"],
              "explained_feature_unavailable": r["explained_feature_unavailable"],
              "review_required": r["review_required"],
              "feature_gaps_resolved": r["feature_gaps_resolved"],
              "historical_PIT_verified": False,
              "trade_gate": "BLOCKED",
              "report_sha256": {name: hashlib.sha256((out / name).read_bytes()).hexdigest() for name in names},
          }
          (out / "p2-pinned-run-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("Pinned archive: 20 explained, 0 pending, 0 feature promotions")
          PY
      - name: Preserve verified regression reports and provenance
        uses: actions/upload-artifact@v4
        with:
          name: p2-pinned-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/p2-pinned-replay.json
            evidence/p2-pinned-disposition.json
            evidence/p2-pinned-run-receipt.json
          if-no-files-found: error
          retention-days: 30
  replay_once:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch current same-epoch durable P2 coverage, original archive and checkpoint
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
          git fetch --depth=1 origin p2-feature-coverage
          git worktree add --detach durable-p2-coverage FETCH_HEAD
      # The pin is resolved from the active vendor roster in this exact checkout.
      # A missing/stale P2 page summary must fail instead of silently falling back.
      - name: Reject stale P2 coverage, then re-diagnose every current SHA-original gap
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from collector.p2_original_gap_window_triage import check_current_checkpoint
          from collector.p1_active_migration_checkpoint import resolve
          selected=resolve(Path('.'))
          epoch=selected['source_sha256']
          checkpoint_path=Path(selected['checkpoint_path'])
          coverage_path=Path('durable-p2-coverage/summaries')/(epoch[:16]+'.json')
          source=Path('archived-research')/epoch[:16]
          if not checkpoint_path.is_file() or not coverage_path.is_file():
              raise ValueError('active checkpoint or P2 durable summary not yet available')
          checkpoint=json.loads(checkpoint_path.read_text())
          coverage=json.loads(coverage_path.read_text())
          status=json.loads((source/'archive_status.json').read_text())
          witness=check_current_checkpoint(coverage,checkpoint,status)
          assert witness['trade_gate']=='BLOCKED'
          subprocess.run(['python','-m','collector.p2_original_gap_window_triage',
                          '--coverage',str(coverage_path),'--archive-epoch',str(source),
                          '--out','evidence/p2-original-gap-triage.json'],check=True)
          result=json.loads(Path('evidence/p2-original-gap-triage.json').read_text())
          assert result['source_epoch_sha256']==epoch
          assert result['research_gap_issuers']==witness['gap_issuer_count']
          assert result['coverage_gaps_resolved']==0
          assert result['historical_halt_intervals_certified']==0
          assert result['historical_PIT_verified'] is False
          assert result['trade_gate']=='BLOCKED' and result['orders']==[]
          print('CURRENT P2 RESEARCH GAP TRIAGE:',json.dumps({
              'checkpoint_completed_shards':witness['checkpoint_completed_shards'],
              'checkpoint_completed_issuers':witness['checkpoint_completed_issuers'],
              'diagnosis_counts':result['diagnosis_counts']},ensure_ascii=False))
          PY
      - name: Separate frozen explained gaps from gaps requiring review
        run: |
          python -m collector.p2_gap_disposition --replay evidence/p2-original-gap-triage.json \
            --pinned manifests/p2_gap_explanations_20261020.json --out evidence/p2-gap-disposition.json
      - name: Archive read-only gap triage, not signals or official status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-original-gap-triage-${{ github.run_id }}
          path: |
            evidence/p2-original-gap-triage.json
            evidence/p2-gap-disposition.json
          retention-days: 14
          if-no-files-found: warn
