name: P2 original CSV 21-bar gap root-cause audit (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p2_original_gap_window_triage.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p2_gap_workflow_epoch_binding.py'
      - 'collector/p2_p3_current_source_guard.py'
      - 'tests/test_p2_p3_current_source_guard.py'
      - 'tests/test_p2_original_gap_window_triage.py'
      - '.github/workflows/p2-original-gap-window-triage.yml'
  workflow_run:
    workflows: ["P2 real archived research features observation (NO TRADES)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'collector/p2_original_gap_window_triage.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p2_gap_workflow_epoch_binding.py'
      - 'collector/p2_p3_current_source_guard.py'
      - 'tests/test_p2_p3_current_source_guard.py'
      - 'tests/test_p2_original_gap_window_triage.py'
      - '.github/workflows/p2-original-gap-window-triage.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_p2_original_gap_window_triage tests.test_p2_real_archive_features tests.test_p2_p3_current_source_guard
  replay_once:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch current same-epoch durable P2 coverage, original archive and checkpoint
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
          git fetch --depth=1 origin p2-feature-coverage
          git worktree add --detach durable-p2-coverage FETCH_HEAD
      # The pin is resolved from the active vendor roster in this exact checkout.
      # A missing/stale P2 page summary must fail instead of silently falling back.
      - name: Reject stale P2 coverage, then re-diagnose every current SHA-original gap
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from collector.p2_original_gap_window_triage import check_current_checkpoint
          from collector.p1_active_migration_checkpoint import resolve
          selected=resolve(Path('.'))
          epoch=selected['source_sha256']
          checkpoint_path=Path(selected['checkpoint_path'])
          coverage_path=Path('durable-p2-coverage/summaries')/(epoch[:16]+'.json')
          source=Path('archived-research')/epoch[:16]
          if not checkpoint_path.is_file() or not coverage_path.is_file():
              raise ValueError('active checkpoint or P2 durable summary not yet available')
          checkpoint=json.loads(checkpoint_path.read_text())
          coverage=json.loads(coverage_path.read_text())
          status=json.loads((source/'archive_status.json').read_text())
          witness=check_current_checkpoint(coverage,checkpoint,status)
          assert witness['trade_gate']=='BLOCKED'
          subprocess.run(['python','-m','collector.p2_original_gap_window_triage',
                          '--coverage',str(coverage_path),'--archive-epoch',str(source),
                          '--out','evidence/p2-original-gap-triage.json'],check=True)
          result=json.loads(Path('evidence/p2-original-gap-triage.json').read_text())
          assert result['source_epoch_sha256']==epoch
          assert result['research_gap_issuers']==witness['gap_issuer_count']
          assert result['coverage_gaps_resolved']==0
          assert result['historical_halt_intervals_certified']==0
          assert result['historical_PIT_verified'] is False
          assert result['trade_gate']=='BLOCKED' and result['orders']==[]
          print('CURRENT P2 RESEARCH GAP TRIAGE:',json.dumps({
              'checkpoint_completed_shards':witness['checkpoint_completed_shards'],
              'checkpoint_completed_issuers':witness['checkpoint_completed_issuers'],
              'diagnosis_counts':result['diagnosis_counts']},ensure_ascii=False))
          PY
      - name: Archive read-only gap triage, not signals or official status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-original-gap-triage-${{ github.run_id }}
          path: evidence/p2-original-gap-triage.json
          retention-days: 14
          if-no-files-found: warn
