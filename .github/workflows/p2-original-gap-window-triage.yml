name: P2 original CSV 21-bar gap root-cause audit (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p2_original_gap_window_triage.py'
      - 'tests/test_p2_original_gap_window_triage.py'
      - '.github/workflows/p2-original-gap-window-triage.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p2_original_gap_window_triage.py'
      - 'tests/test_p2_original_gap_window_triage.py'
      - '.github/workflows/p2-original-gap-window-triage.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_p2_original_gap_window_triage tests.test_p2_real_archive_features
  replay_once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse fixed successful P2 research coverage and archived original vendor CSV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/p2-prior
          gh run download 42183918663 -R "${{ github.repository }}" -n p2-real-archive-feature-observation-42183918663 -D evidence/p2-prior
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
      - name: SHA-reverify only original gap issuers, never bridge suspended rows
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          reports=list(Path('evidence/p2-prior').rglob('p2_real_archive_feature_coverage.json'))
          if len(reports)!=1:raise ValueError('missing or ambiguous original P2 coverage')
          coverage=json.loads(reports[0].read_text())
          epoch=coverage['source_epoch_sha256']
          source=Path('archived-research')/epoch[:16]
          if not source.is_dir():raise ValueError('missing pinned original vendor archive epoch')
          subprocess.run(['python','-m','collector.p2_original_gap_window_triage',
              '--coverage',str(reports[0]),'--archive-epoch',str(source),
              '--out','evidence/p2-original-gap-triage.json'],check=True)
          result=json.loads(Path('evidence/p2-original-gap-triage.json').read_text())
          assert result['coverage_gaps_resolved']==0
          assert not result['historical_PIT_verified']
          assert result['trade_gate']=='BLOCKED' and result['orders']==[]
          print('RESEARCH TRIAGE:',result['diagnosis_counts'])
          PY
      - name: Archive read-only gap triage, not signals or official status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-original-gap-triage-${{ github.run_id }}
          path: evidence/p2-original-gap-triage.json
          retention-days: 14
          if-no-files-found: warn
