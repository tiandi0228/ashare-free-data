name: P1 scheduled final gap selection tests (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p1_quad_pick.py'
      - 'tests/test_p1_quad_pick.py'
      - '.github/workflows/p1-fresh-vendor-roster.yml'
      - '.github/workflows/p1-tail-gap-tests.yml'
permissions:
  contents: read
jobs:
  offline-tail-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen roster, rotation, manual override, and tail selection
        run: |
          python -m unittest tests.test_p1_quad_pick tests.test_p1_checkpoint tests.test_p1_shard_ledger -v

      - name: Replay real 384-shard checkpoint, archived CSV index, and P2 coverage
        run: |
          set -euo pipefail
          main=02af965e62fa2c435ddf42dac64cf688aaaf6c9b
          archive=ab97ac1500836b7c64f796b638d4405801186648
          p2=e4a634c07dc0cd3efae6edc3da9160aaae2d39df
          git fetch --depth=1 --no-tags origin "$main" "$archive" "$p2"
          python - <<'PY384'
          import json
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from collector.p1_roster_lock import unpack
          from collector.p1_fresh_shard_plan import plan as frozen_plan
          from collector.p1_quad_pick import choose_scheduled_tail, verify_prior_for_selection

          main = "02af965e62fa2c435ddf42dac64cf688aaaf6c9b"
          archive = "ab97ac1500836b7c64f796b638d4405801186648"
          p2 = "e4a634c07dc0cd3efae6edc3da9160aaae2d39df"
          epoch = "5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022"
          prefix = epoch[:16]

          def read(commit, path):
              return json.loads(subprocess.check_output(["git", "show", f"{commit}:{path}"]))

          lock = read(main, "evidence/p1_active_roster.json")
          assert lock["source_sha256"] == epoch
          raw, receipt = unpack(lock)
          ledger = read(main, f"evidence/checkpoints/{epoch}.json")
          status = read(archive, f"{prefix}/archive_status.json")
          coverage = read(p2, f"summaries/{prefix}.json")
          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              csv = root / "roster.csv"
              csv.write_bytes(raw)
              plan = frozen_plan(csv, root / "manifests", receipt["requested_day"])
              verify_prior_for_selection(plan, ledger)
              pending = list(range(271, 287))
              archived = sorted({r["index"] for r in ledger["completed"]})
              assert ledger["completed_shards"] == len(archived) == 384
              assert ledger["pending_shards"] == pending
              assert sorted(status["archived_shards"]) == archived
              assert status["trade_gate"] == ledger["trade_gate"] == "BLOCKED"
              assert ledger["orders"] == [] and ledger["executable_candidates"] == []
              assert choose_scheduled_tail(plan, ledger, 360, 2) == [271, 272]
              assert choose_scheduled_tail(plan, ledger, 360, 1) == [271]
              assert coverage["observed_archived_shards"] == 384
              assert coverage["unobserved_archived_shards"] == 0
              assert coverage["feature_complete_shards"] == 361
              assert coverage["trade_gate"] == "BLOCKED" and coverage["orders"] == []
          print("PASS: pinned P1 384/400, P2 361/384, safe next 271:272; no writes")
          PY384

      - name: Replay real 392-shard checkpoint and verify final eight gaps
        run: |
          set -euo pipefail
          main=6d877a8777c6b2174655e0ac0d6442012fb74eb3
          archive=b23597cd361e9811d5ea9a32e830a6f4a3adc4f4
          p2=56c2cbb0533009835acf05c737826ab7eea370fb
          git fetch --depth=1 --no-tags origin "$main" "$archive" "$p2"
          python - <<'PY392'
          import json
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from collector.p1_fresh_shard_plan import plan as frozen_plan
          from collector.p1_quad_pick import choose_scheduled_tail, verify_prior_for_selection
          from collector.p1_roster_lock import unpack

          main = "6d877a8777c6b2174655e0ac0d6442012fb74eb3"
          archive = "b23597cd361e9811d5ea9a32e830a6f4a3adc4f4"
          p2 = "56c2cbb0533009835acf05c737826ab7eea370fb"
          epoch = "5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022"
          prefix = epoch[:16]

          def read(ref, path):
              return json.loads(subprocess.check_output(["git", "show", f"{ref}:{path}"]))

          lock = read(main, "evidence/p1_active_roster.json")
          assert lock["source_sha256"] == epoch
          raw, receipt = unpack(lock)
          ledger = read(main, f"evidence/checkpoints/{epoch}.json")
          archive_status = read(archive, f"{prefix}/archive_status.json")
          coverage = read(p2, f"summaries/{prefix}.json")
          missing = list(range(271, 279))
          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              roster = root / "roster.csv"
              roster.write_bytes(raw)
              frozen = frozen_plan(roster, root / "manifests", receipt["requested_day"])
              verify_prior_for_selection(frozen, ledger)
              archived_ids = sorted(row["index"] for row in ledger["completed"])
              assert (ledger["completed_shards"], ledger["shard_count"]) == (392, 400)
              assert ledger["pending_shards"] == missing
              assert sorted(archive_status["archived_shards"]) == archived_ids
              assert len(archived_ids) == 392
              assert archive_status["trade_gate"] == ledger["trade_gate"] == "BLOCKED"
              assert ledger["orders"] == [] and ledger["executable_candidates"] == []
              assert choose_scheduled_tail(frozen, ledger, 360, 2) == [271, 272]
              assert choose_scheduled_tail(frozen, ledger, 360, 1) == [271]
              assert coverage["observed_archived_shards"] == 392
              assert coverage["feature_complete_shards"] == 369
              assert coverage["unobserved_archived_shards"] == 0
              assert coverage["feature_issuer_count"] == 3106
              assert coverage["issuer_evidence_gap_count"] == 24
              assert coverage["trade_gate"] == "BLOCKED" and coverage["orders"] == []
          print("PASS: P1 392/400, missing 271-278; P2 369/392; next 271-272, trade BLOCKED")
          PY392

      - name: Replay current moving P1 archive safely and report next scheduled shards (NO WRITES)
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          archive_sha="$(git ls-remote origin refs/heads/research-csv-archive | cut -f1)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$archive_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$main_sha" "$archive_sha"
          MAIN_SHA="$main_sha" ARCHIVE_SHA="$archive_sha" python - <<'PYLIVE'
          import json
          import os
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from collector.p1_quad_pick import choose_scheduled_tail, verify_prior_for_selection
          from collector.p1_roster_lock import unpack
          from collector.p1_fresh_shard_plan import plan

          main = os.environ["MAIN_SHA"]
          archive = os.environ["ARCHIVE_SHA"]
          epoch = "5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022"
          prefix = epoch[:16]
          def read(ref, path):
              return json.loads(subprocess.check_output(["git", "show", f"{ref}:{path}"]))

          lock = read(main, "evidence/p1_active_roster.json")
          assert lock["source_sha256"] == epoch
          raw, receipt = unpack(lock)
          checkpoint = read(main, f"evidence/checkpoints/{epoch}.json")
          archived = read(archive, f"{prefix}/archive_status.json")
          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              roster = root / "roster.csv"
              roster.write_bytes(raw)
              frozen = plan(roster, root / "manifests", receipt["requested_day"])
              verify_prior_for_selection(frozen, checkpoint)
              ids = sorted(r["index"] for r in checkpoint["completed"])
              pending = checkpoint["pending_shards"]
              assert checkpoint["shard_count"] == 400
              assert checkpoint["completed_shards"] >= 392, "unexpected P1 regression"
              assert checkpoint["completed_shards"] + len(pending) == 400
              assert sorted(archived["archived_shards"]) == ids
              assert archived["source_sha256"] == epoch
              assert checkpoint["trade_gate"] == archived["trade_gate"] == "BLOCKED"
              assert checkpoint["orders"] == [] and checkpoint["executable_candidates"] == []
              assert pending == sorted(set(pending))
              failed = set(checkpoint["failed_in_this_reconciliation"]) & set(pending)
              ready = [i for i in pending if i not in failed]
              expected = ready if ready else pending
              first = choose_scheduled_tail(frozen, checkpoint, 399, 1) if pending else []
              double = choose_scheduled_tail(frozen, checkpoint, 399, 2) if pending else []
              assert first == expected[:1]
              assert double == expected[:2]
              assert set(first + double) <= set(pending)
              # The data and the test never mutate archived status or turn on trading.
              summary = [
                  "### P1 current same-epoch read-only replay",
                  f"- Immutable main commit: \`{main}\`",
                  f"- Immutable original-archive commit: \`{archive}\`",
                  f"- Archived: {len(ids)}/400; missing: {pending}",
                  f"- Previous reconciliation failure indices: {sorted(failed)}",
                  f"- Scheduled next single: {first}; next dual: {double}",
                  "- All checkpoint and archive IDs agree; trade gate BLOCKED",
                  "- This is a read-only dispatch preview, NOT a collection or acceptance.",
              ]
              Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a").write("\n".join(summary) + "\n")
              print("LIVE REPLAY PASS:", {"archived":len(ids), "missing":pending,
                     "next_single":first, "next_dual":double, "trade_gate":"BLOCKED"})
          PYLIVE
