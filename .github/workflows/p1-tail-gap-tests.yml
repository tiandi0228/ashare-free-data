name: P1 scheduled final gap selection tests (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p1_quad_pick.py'
      - 'tests/test_p1_quad_pick.py'
      - '.github/workflows/p1-fresh-vendor-roster.yml'
      - '.github/workflows/p1-tail-gap-tests.yml'
permissions:
  contents: read
jobs:
  offline-tail-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen roster, rotation, manual override, and 383-shard tail selection
        run: |
          python -m unittest tests.test_p1_quad_pick tests.test_p1_checkpoint tests.test_p1_shard_ledger -v
