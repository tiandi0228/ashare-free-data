name: P1 stratified 128 original SSE IPO evidence replay (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-stratified-128-auto-replay.yml'
  workflow_run:
    workflows: ["P1 stratified SH SZ research shards 1-15 (NO TRADES)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locate latest successful stratified 15-shard run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [[ -n "$SOURCE_RUN" ]]; then
            echo "id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          else
            run_id="$(gh run list --workflow p1-live-roster-eight-on-push.yml --json databaseId,conclusion --limit 15 --jq '[.[] | select(.conclusion=="success")][0].databaseId')"
            test -n "$run_id" && test "$run_id" != "null"
            echo "id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - name: Download actual source CSVs from new stratified panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p replay/first replay/rest
          gh run download 39733363864 --dir replay/first
          gh run download "${{ steps.source.outputs.id }}" --dir replay/rest
      - name: Replay and audit all sixteen shards against new independent SHA
        run: |
          python -m collector.p1_128_source_replay_audit --input replay --out audit/p1_128_stratified_verified.json --manifest-sha f70bbb790e33dfda2354efad6433a92f6d64f768a5af80e66d8a7db62008bfdf
      - name: Reconcile 139 gap dates against official SSE 603014 IPO notice
        run: |
          python -m collector.p1_603014_official_ipo_gap_reconcile --infile audit/p1_128_stratified_verified.json --out audit/p1_official_ipo_gap_reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("audit/p1_official_ipo_gap_reconciliation.json").read_text())
          assert r["total_peer_missing"]==139
          assert r["prelisting_consistent_gaps"]==139
          assert r["unresolved_gaps"]==0
          assert r["trade_gate"]=="BLOCKED" and not r["orders"]
          PY
      - name: Independently capture and SHA hash real SSE original IPO HTML
        run: |
          python -m collector.p1_603014_sse_original_capture --out audit/p1_603014_sse_source_receipt.json --raw evidence/sse_603014_original.html
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path("audit/p1_603014_sse_source_receipt.json").read_text())
          assert r["trade_gate"]=="BLOCKED" and r["historical_publication_instant_verified"] is False
          if r["original_html_observed"]:
              assert r["first_trading_day"]=="2025-05-19" and r["issuer"]=="sh.603014"
              assert hashlib.sha256(Path("evidence/sse_603014_original.html").read_bytes()).hexdigest()==r["sha256"]
          else:
              assert r["source_status"]=="UNAVAILABLE_OR_CONTENT_UNVERIFIED"
              assert r["failure_type"] in ("HTTPError","URLError","TimeoutError","ValueError","UnicodeError")
              assert not Path("evidence/sse_603014_original.html").exists()
              print("GAP: official original not captured; no source-byte certification")
          PY
      - name: Persist audit receipt without redistributing vendor CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-stratified-128-quality-audit-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
