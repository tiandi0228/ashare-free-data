name: P4 isolated execution arithmetic (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p4_execution_arithmetic.py'
      - 'tests/test_p4_execution_arithmetic.py'
      - 'collector/p4_exit_decision.py'
      - 'tests/test_p4_exit_decision.py'
      - 'collector/p4_calendar_limit_gate.py'
      - 'tests/test_p4_calendar_limit_gate.py'
      - 'collector/p4_signal_fill_audit.py'
      - 'collector/p4_research_signal_lifecycle.py'
      - 'collector/p4_limit_order_replay.py'
      - 'collector/p4_partial_fill_fee_inventory.py'
      - 'collector/p4_cancel_replace_audit.py'
      - 'collector/p4_issuer_session_gate.py'
      - 'collector/p4_unified_execution_preflight.py'
      - 'collector/p4_time_exit_unresolved.py'
      - 'tests/test_p4_time_exit_unresolved.py'
      - 'tests/test_p4_unified_execution_preflight.py'
      - 'tests/test_p4_issuer_session_gate.py'
      - 'tests/test_p4_cancel_replace_audit.py'
      - 'tests/test_p4_partial_fill_fee_inventory.py'
      - 'tests/test_p4_limit_order_replay.py'
      - 'tests/test_p4_research_signal_lifecycle.py'
      - 'tests/test_p4_signal_fill_audit.py'
      - 'collector/p4_integrated_research_gate.py'
      - 'tests/test_p4_integrated_research_gate.py'
      - '.github/workflows/p4-execution-arithmetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p4-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test T+1 fees slippage and research-only gate
        run: python -m unittest tests.test_p4_execution_arithmetic tests.test_p4_exit_decision tests.test_p4_calendar_limit_gate tests.test_p4_signal_fill_audit tests.test_p4_integrated_research_gate tests.test_p4_research_signal_lifecycle tests.test_p4_limit_order_replay tests.test_p4_partial_fill_fee_inventory tests.test_p4_cancel_replace_audit tests.test_p4_issuer_session_gate tests.test_p4_unified_execution_preflight tests.test_p4_time_exit_unresolved -v
