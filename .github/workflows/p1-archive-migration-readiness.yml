name: P1 source archive migration readiness SHA audit (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p1_archive_migration_readiness.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p1_active_migration_checkpoint.py'
      - 'collector/p1_legacy_original_receipt_gap_audit.py'
      - 'collector/p1_partial_sha_copy_plan.py'
      - 'collector/p1_source_sha_handoff.py'
      - 'collector/p1_source_handoff_independent_replay.py'
      - 'collector/p1_target_sha_readback.py'
      - 'collector/p1_source_commit_envelope.py'
      - 'tests/test_p1_source_commit_envelope.py'
      - 'tests/test_p1_source_handoff_independent_replay.py'
      - 'tests/test_p1_target_sha_readback.py'
      - 'tests/test_p1_source_sha_handoff.py'
      - 'tests/test_p1_partial_sha_copy_plan.py'
      - 'tests/test_p1_legacy_original_receipt_gap_audit.py'
      - 'tests/test_p1_archive_migration_readiness.py'
      - '.github/workflows/p1-archive-migration-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p1_archive_migration_readiness.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p1_active_migration_checkpoint.py'
      - 'collector/p1_legacy_original_receipt_gap_audit.py'
      - 'collector/p1_partial_sha_copy_plan.py'
      - 'collector/p1_source_sha_handoff.py'
      - 'collector/p1_source_handoff_independent_replay.py'
      - 'collector/p1_target_sha_readback.py'
      - 'collector/p1_source_commit_envelope.py'
      - 'tests/test_p1_source_commit_envelope.py'
      - 'tests/test_p1_source_handoff_independent_replay.py'
      - 'tests/test_p1_target_sha_readback.py'
      - 'tests/test_p1_source_sha_handoff.py'
      - 'tests/test_p1_partial_sha_copy_plan.py'
      - 'tests/test_p1_legacy_original_receipt_gap_audit.py'
      - 'tests/test_p1_archive_migration_readiness.py'
      - '.github/workflows/p1-archive-migration-readiness.yml'
  # Read-only nightly reconciliation of the *latest* same-epoch checkpoint.
  schedule:
    - cron: '35 16 * * *' # 00:35 Beijing daily
  # Also audit new source bytes immediately after the P1 origin attestation.
  # workflow_run executes from default-branch code with read-only archive access.
  workflow_run:
    workflows: ["P1 final scheduled origin and archive attestation (NO TRADES)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_p1_active_migration_checkpoint tests.test_p1_archive_migration_readiness tests.test_p1_legacy_original_receipt_gap_audit tests.test_p1_partial_sha_copy_plan tests.test_p1_source_sha_handoff tests.test_p1_source_handoff_independent_replay tests.test_p1_target_sha_readback tests.test_p1_source_commit_envelope
  source-readback:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research-csv-archive
          path: source-archive
          persist-credentials: false
          fetch-depth: 1
      - name: Bind latest same-commit active P1 roster and checkpoint (fail closed)
        id: pin
        env:
          PYTHONPATH: code
        run: |
          python -m collector.p1_active_migration_checkpoint \
            --root code \
            --out evidence/p1_selected_active_checkpoint.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Replay frozen active checkpoint against archive originals
        env:
          PYTHONPATH: code
        run: |
          python -m collector.p1_archive_migration_readiness \
            --checkpoint "code/${{ steps.pin.outputs.checkpoint_path }}" \
            --archive source-archive \
            --out evidence/p1_archive_migration_readiness.json
      - name: List immutable legacy original quality gaps (read-only, no fabricated receipts)
        env:
          PYTHONPATH: code
        run: |
          python -m collector.p1_legacy_original_receipt_gap_audit \
            --archive source-archive \
            --active-epoch "${{ steps.pin.outputs.source_epoch }}" \
            --out evidence/p1_legacy_quality_receipt_gaps.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/p1_legacy_quality_receipt_gaps.json').read_text())
          assert x['trade_gate']=='BLOCKED' and x['orders']==[]
          assert x['writer_cutover_authorized'] is False
          assert x['destination_mirror_verified'] is False
          assert x['missing_receipts_synthesized'] is False
          print('P1 LEGACY ORIGINAL RECEIPT GAPS:',x['missing_original_receipts'])
          PY
      - name: SHA-replay each eligible source CSV and quarantine unverifiable shards (read only)
        env:
          PYTHONPATH: code
        run: |
          python -m collector.p1_partial_sha_copy_plan \
            --archive source-archive \
            --active-epoch "${{ steps.pin.outputs.source_epoch }}" \
            --out evidence/p1_partial_sha_copy_plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('evidence/p1_partial_sha_copy_plan.json').read_text())
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          assert q['automatic_copy_authorized'] is False
          assert q['writer_cutover_authorized'] is False
          assert q['destination_files_verified'] is False
          assert sum(len(x['source_file_sha256']) for x in q['eligible_source_shards']) == q['eligible_original_files']
          print('P1 ELIGIBLE SHA VERIFIED SHARDS:',q['eligible_shards'])
          print('P1 QUARANTINED UNVERIFIABLE SHARDS:',q['quarantine'])
          PY
      - name: Reconcile current checkpoint, legacy gaps and source-only SHA handoff
        env:
          PYTHONPATH: code
        run: |
          python -m collector.p1_source_sha_handoff \
            --partial-plan evidence/p1_partial_sha_copy_plan.json \
            --readiness evidence/p1_archive_migration_readiness.json \
            --legacy-gaps evidence/p1_legacy_quality_receipt_gaps.json \
            --out evidence/p1_source_sha_handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/p1_source_sha_handoff.json').read_text())
          assert x['trade_gate']=='BLOCKED' and x['orders']==[]
          assert x['destination_files_verified'] is False
          assert x['migration_performed'] is False
          assert x['automatic_copy_authorized'] is False
          assert x['writer_cutover_authorized'] is False
          assert x['active_verified_shards']>0
          assert len(x['original_paths_and_sha256'])==x['eligible_original_files']
          print('P1 SOURCE HANDOFF DIGEST:',x['source_file_inventory_sha256'])
          PY
      - name: Independently rehash source handoff bytes and archived status originals
        env:
          PYTHONPATH: code
        run: |
          python -m collector.p1_source_handoff_independent_replay \
            --source source-archive \
            --handoff evidence/p1_source_sha_handoff.json \
            --out evidence/p1_source_handoff_independent_replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/p1_source_sha_handoff.json').read_text())
          b=json.loads(Path('evidence/p1_source_handoff_independent_replay.json').read_text())
          assert a['source_file_inventory_sha256']==b['source_file_inventory_sha256']
          assert a['eligible_original_files']==b['source_files_replayed']
          assert a['eligible_shards']==b['source_shards_replayed']
          assert b['destination_files_verified'] is False
          assert b['writer_cutover_authorized'] is False
          assert b['trade_gate']=='BLOCKED' and b['orders']==[]
          print('P1 INDEPENDENT SOURCE HANDOFF SHA REPLAY PASSED')
          PY
      - name: Seal SHA-replayed originals with exact immutable Git source and code commits
        env:
          PYTHONPATH: code
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git -C source-archive rev-parse --verify HEAD)
          EXECUTION_COMMIT=$(git -C code rev-parse --verify HEAD)
          test "${#SOURCE_COMMIT}" -eq 40
          test "${#EXECUTION_COMMIT}" -eq 40
          python -m collector.p1_source_commit_envelope \
            --handoff evidence/p1_source_sha_handoff.json \
            --replay evidence/p1_source_handoff_independent_replay.json \
            --source-commit "$SOURCE_COMMIT" \
            --execution-commit "$EXECUTION_COMMIT" \
            --out evidence/p1_source_commit_envelope.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/p1_source_commit_envelope.json').read_text())
          assert p['trade_gate']=='BLOCKED' and p['orders']==[]
          assert p['destination_files_verified'] is False
          assert p['writer_cutover_authorized'] is False
          assert p['migration_performed'] is False
          assert p['destination_commit_sha'] is None
          assert len(p['archive_status_original_sha256'])==4
          print('P1 SOURCE IMMUTABLE GIT SNAPSHOT SEALED:',p['source_handoff_envelope_sha256'])
          PY
      - name: Report source readiness without claiming writer cutover
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('evidence/p1_archive_migration_readiness.json').read_text())
          assert d['trade_gate']=='BLOCKED' and not d['orders']
          assert d['writer_cutover_authorized'] is False
          legacy=json.loads(Path('evidence/p1_legacy_quality_receipt_gaps.json').read_text())
          partial=json.loads(Path('evidence/p1_partial_sha_copy_plan.json').read_text())
          handoff=json.loads(Path('evidence/p1_source_sha_handoff.json').read_text())
          replay=json.loads(Path('evidence/p1_source_handoff_independent_replay.json').read_text())
          envelope=json.loads(Path('evidence/p1_source_commit_envelope.json').read_text())
          assert legacy['trade_gate']=='BLOCKED'
          assert legacy['writer_cutover_authorized'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### P1 archived source readiness (NO TRADES)\n')
              out.write(f"- archive_commit: {envelope['source_archive_commit_sha']}\\n")
              out.write(f"- snapshot_envelope_sha256: {envelope['source_handoff_envelope_sha256']}\\n")

              out.write(f"- source_handoff_manifest_sha256: {handoff['source_file_inventory_sha256']}\\n")
              out.write(f"- independent_source_files_replayed: {replay['source_files_replayed']}\\n")
              out.write(f"- separate_original_status_sha_count: {len(replay['archive_status_original_sha256'])}\\n")
              out.write('### SHA-replayed eligible original shards (NOT MIGRATED)\\n')
              out.write(f"- eligible_shards: {partial['eligible_shards']}\\n")
              out.write(f"- eligible_original_files: {partial['eligible_original_files']}\\n")
              out.write(f"- quarantined_shards: {partial['quarantined_shards']}\\n")
              out.write('### All-epoch original quality receipt gaps (NOT SHA certification)\\n')
              out.write(f"- missing_receipts_total: {legacy['missing_receipts_total']}\\n")
              for row in legacy['missing_original_receipts']:
                  out.write(f"- {row['source_epoch_prefix']}/{row['shard_id']}: {row['reason']}\\n")
              for name in ('status','checkpoint_completed_shards',
                           'verified_original_shards','verified_original_csv_files',
                           'missing_or_invalid_shard_count','all_checkpoint_originals_durably_located'):
                  out.write(f"- {name}: {d[name]}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-source-archive-readiness-${{ github.run_id }}
          path: |
            evidence/p1_selected_active_checkpoint.json
            evidence/p1_archive_migration_readiness.json
            evidence/p1_legacy_quality_receipt_gaps.json
            evidence/p1_partial_sha_copy_plan.json
            evidence/p1_source_sha_handoff.json
            evidence/p1_source_handoff_independent_replay.json
            evidence/p1_source_commit_envelope.json
          if-no-files-found: warn
          retention-days: 30
