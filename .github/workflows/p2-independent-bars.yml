name: P2 independent vendor CSV integrity (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p2_independent_bars.py'
      - 'tests/test_p2_independent_bars.py'
      - '.github/workflows/p2-independent-bars.yml'
  schedule:
    - cron: '30 4 * * 1-5' # 12:30 Beijing, independent P1 archive replay
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p2-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline independent CSV replay and fail-closed checks
        run: python -m unittest tests.test_p2_independent_bars -v
      - name: Confirm independent P2 source cannot authorize trades
        run: |
          python - <<'PY'
          from collector.p2_independent_bars import audit_csv
          raw=b'date,code,open,high,low,close,volume,amount,adjustflag,tradestatus\n2026-01-05,sh.600000,10,11,9,10.5,100,1000,3,1\n'
          assert audit_csv(raw,'sh.600000')['active_rows']==1
          print('PASS: vendor-only prices; not official historical PIT or trading permission')
          PY
      - name: Verify archived real vendor CSV against independent P2 parser
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          from collector.p2_independent_bars import assess
          root=Path('archived-research')
          receipts=sorted(root.glob('*/shard_*/quality.json'))
          if not receipts:
              raise SystemExit('No permanent receipts available: cannot claim P2 real-source validation')
          verified=0
          for receipt in receipts:
              r=assess(receipt.parent)
              assert r['trade_gate']=='BLOCKED' and not r['historical_PIT_verified']
              verified+=r['issuer_count']
          Path('p2_real_archive_audit.json').write_text(json.dumps({
              'phase':'P2_REAL_ARCHIVE_REPLAY','verified_issuers':verified,
              'verified_shards':len(receipts),'historical_PIT_verified':False,
              'trade_gate':'BLOCKED','orders':[]},indent=2)+'\n')
          print('P2 REAL ARCHIVE REPLAY PASS:',verified,'issuers across',len(receipts),'shards')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-real-archive-audit-${{ github.run_id }}
          path: p2_real_archive_audit.json
          retention-days: 14
