name: P3 original announcement action-to-date evidence research (NO TRADES)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p3-original-action-date-proximity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Download original source date context evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39754510346 --dir originals
      - name: Evaluate exact event phrases near actual date mentions
        run: |
          INPUT="$(find originals -name date_contexts.json -print -quit)"
          test -n "$INPUT"
          python -m collector.p3_original_action_date_proximity --input "$INPUT" --out audit/action_date_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("audit/action_date_candidates.json").read_text())
          assert q["source_documents"]==6 and q["date_candidates"]==7
          assert q["certified_effective_state_transitions"]==0
          assert q["historical_PIT_eligible"]==0
          assert q["trade_gate"]=="BLOCKED" and q["orders"]==[]
          print("PASS: event action proximity independently reviewed, no fabricated historical eligible events")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-original-action-date-proximity-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
