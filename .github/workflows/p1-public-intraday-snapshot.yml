name: P1 five-stock public intraday snapshot (RESEARCH ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-public-intraday-snapshot.yml'
      - 'collector/intraday_public_snapshot.py'
      - 'collector/intraday_minute_coverage.py'
      - 'collector/intraday_snapshot_archive.py'
      - 'collector/intraday_daily_index.py'
      - 'collector/intraday_source_health.py'
      - 'collector/p1_schedule_watchdog.py'
      - 'collector/p1_safe_recovery.py'
      - 'collector/p1_recovery_claim.py'
      - 'collector/p1_recovery_dispatch_preflight.py'
      - 'collector/p1_recovery_dispatch_once.py'
      - 'collector/p1_recovery_origin_token.py'
      - 'collector/ashare_trade_risk_preflight.py'
      - 'collector/p1_pit_time_consistency.py'
      - 'collector/p1_recovery_run_reconciliation.py'
      - 'tests/test_intraday_public_snapshot.py'
      - 'tests/test_intraday_minute_coverage.py'
      - 'tests/test_intraday_snapshot_archive.py'
      - 'tests/test_intraday_daily_index.py'
      - 'tests/test_intraday_source_health.py'
      - 'tests/test_p1_schedule_watchdog.py'
      - 'tests/test_p1_safe_recovery.py'
      - 'tests/test_p1_recovery_claim.py'
      - 'tests/test_p1_recovery_dispatch_preflight.py'
      - 'tests/test_p1_recovery_dispatch_once.py'
      - 'tests/test_p1_recovery_origin_token.py'
      - 'tests/test_ashare_trade_risk_preflight.py'
      - 'tests/test_p1_pit_time_consistency.py'
      - 'tests/test_p1_recovery_run_reconciliation.py'
  workflow_dispatch:
  pull_request:
    paths:
      - 'collector/intraday_public_snapshot.py'
      - 'collector/intraday_minute_coverage.py'
      - 'collector/intraday_snapshot_archive.py'
      - 'collector/intraday_daily_index.py'
      - 'collector/intraday_source_health.py'
      - 'collector/p1_schedule_watchdog.py'
      - 'collector/p1_safe_recovery.py'
      - 'collector/p1_recovery_claim.py'
      - 'collector/p1_recovery_dispatch_preflight.py'
      - 'collector/p1_recovery_dispatch_once.py'
      - 'collector/p1_recovery_origin_token.py'
      - 'collector/ashare_trade_risk_preflight.py'
      - 'collector/p1_pit_time_consistency.py'
      - 'collector/p1_recovery_run_reconciliation.py'
      - 'tests/test_intraday_public_snapshot.py'
      - 'tests/test_intraday_minute_coverage.py'
      - 'tests/test_intraday_snapshot_archive.py'
      - 'tests/test_intraday_daily_index.py'
      - 'tests/test_intraday_source_health.py'
      - 'tests/test_p1_schedule_watchdog.py'
      - 'tests/test_p1_safe_recovery.py'
      - 'tests/test_p1_recovery_claim.py'
      - 'tests/test_p1_recovery_dispatch_preflight.py'
      - 'tests/test_p1_recovery_dispatch_once.py'
      - 'tests/test_p1_recovery_origin_token.py'
      - 'tests/test_ashare_trade_risk_preflight.py'
      - 'tests/test_p1_pit_time_consistency.py'
      - 'tests/test_p1_recovery_run_reconciliation.py'
      - '.github/workflows/p1-public-intraday-snapshot.yml'
  schedule:
    # UTC: Beijing 10:05, 10:35, 11:05, 13:35, 14:05 and 14:35 weekdays.
    # GitHub Actions cron is best effort: never a 15-second execution feed.
    - cron: '5,35 2 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '35 5 * * 1-5'
    - cron: '5,35 6 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: p1-public-intraday-research-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test unofficial source parsing and immutable BLOCKED gate
        run: python -m unittest tests.test_intraday_public_snapshot tests.test_intraday_minute_coverage tests.test_intraday_snapshot_archive tests.test_intraday_daily_index tests.test_intraday_source_health tests.test_p1_schedule_watchdog tests.test_p1_safe_recovery tests.test_p1_recovery_claim tests.test_p1_recovery_dispatch_preflight tests.test_p1_recovery_dispatch_once tests.test_p1_recovery_origin_token tests.test_p1_recovery_run_reconciliation tests.test_ashare_trade_risk_preflight tests.test_p1_pit_time_consistency -v
      - name: Audit P1 historical scheduler (no dispatch or orders)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p1_schedule_watchdog \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/p1_schedule_watchdog.json
      - name: Evaluate safe historical P1 recovery eligibility (dry run only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p1_safe_recovery \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/p1_recovery_eligibility.json
      - name: Record durable dry-run historical slot claim (NO dispatch)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p1_recovery_claim \
            --eligibility evidence/intraday/p1_recovery_eligibility.json \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/p1_recovery_claim.json
      - name: Independently preflight historical P1 recovery without dispatch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p1_recovery_dispatch_preflight \
            --claim evidence/intraday/p1_recovery_claim.json \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/p1_dispatch_preflight.json
      - name: Safely dispatch at most one historical P1 research shard
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          P1_RECOVERY_EXECUTION_ENABLED: 'true'
        run: |
          python -m collector.p1_recovery_dispatch_once \
            --preflight evidence/intraday/p1_dispatch_preflight.json \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/p1_dispatch_attempt.json
      - name: Reconcile bounded P1 recovery attempts with possible historical runs
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p1_recovery_run_reconciliation \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/p1_recovery_reconciliation.json
      - name: Observe five research-only intraday snapshots (no orders)
        if: github.event_name != 'pull_request'
        run: python -m collector.intraday_public_snapshot --out evidence/intraday/latest.json
      - name: Archive immutable research snapshots in separate branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.intraday_snapshot_archive \
            --snapshot evidence/intraday/latest.json \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/archive_ack.json
      - name: Rebuild read-only date index from immutable remote snapshots
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.intraday_daily_index \
            --snapshot evidence/intraday/latest.json \
            --repo "${{ github.repository }}" \
            --out evidence/intraday/index_ack.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: p1-public-intraday-${{ github.run_id }}
          path: |
            evidence/intraday/latest.json
            evidence/intraday/archive_ack.json
            evidence/intraday/index_ack.json
            evidence/intraday/p1_schedule_watchdog.json
            evidence/intraday/p1_recovery_eligibility.json
            evidence/intraday/p1_recovery_claim.json
            evidence/intraday/p1_dispatch_preflight.json
            evidence/intraday/p1_dispatch_attempt.json
            evidence/intraday/p1_recovery_reconciliation.json
          retention-days: 14
          if-no-files-found: warn
