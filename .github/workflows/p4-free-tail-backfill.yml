name: P4 free real tail recovery pilot (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p4_free_tail_backfill.py'
      - '.github/workflows/p4-free-tail-backfill.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'baostock>=0.8,<1'
      - name: Fetch independently archived issuer histories
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
      - name: Request first eight missing exit-tail ranges using free provider
        run: |
          timeout 280s python -m collector.p4_free_tail_backfill --root archived-research --out evidence/tail_pilot --limit 8
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("evidence/tail_pilot")
          r=json.loads((root/"backfill_attempt.json").read_text())
          assert r["requested_issuers"]==8 and r["total_pending_issuers"]>=8
          assert r["trade_gate"]=="BLOCKED" and r["source_archive_unchanged"]
          for item in r["results"]:
              if item["status"]=="OBSERVED_RESEARCH_ONLY":
                  assert hashlib.sha256((root/item["filename"]).read_bytes()).hexdigest()==item["sha256"]
          print("FREE TAIL PILOT",r["successful_issuers"],"/",r["requested_issuers"],"issuers",r["recovered_target_rows"],"source rows")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-free-tail-pilot-${{ github.run_id }}
          path: evidence/tail_pilot/
          retention-days: 30
