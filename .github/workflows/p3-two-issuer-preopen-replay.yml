name: P3 two issuer pre-open gate replay (NO TRADES)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/p3_two_issuer_preopen_replay.py'
      - 'collector/p3_publication_asof_gate.py'
      - '.github/workflows/p3-two-issuer-preopen-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'collector/p3_two_issuer_preopen_replay.py'
      - 'collector/p3_publication_asof_gate.py'
      - '.github/workflows/p3-two-issuer-preopen-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ARCHIVE: 7028eb4c9cc7f23add64958bc6f2611565476538
      CASE_600825: c1b454e19117c59ed956d609e6a26a7ed5f95120
      CASE_002860: 69b856e2939c05cf849748b28ce912c8dd5b3a65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p3_publication_asof_gate -v
      - run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Regenerate pinned source replays and pre-open check
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$ARCHIVE" "$CASE_600825" "$CASE_002860"
          git worktree add --detach "$RUNNER_TEMP/p3-archive" "$ARCHIVE"
          git worktree add --detach "$RUNNER_TEMP/p3-600825" "$CASE_600825"
          git worktree add --detach "$RUNNER_TEMP/p3-002860" "$CASE_002860"
          (
            cd "$RUNNER_TEMP/p3-600825"
            python -m collector.p3_600825_original_replay --archive "$RUNNER_TEMP/p3-archive" > "$RUNNER_TEMP/original.json"
            python -m collector.p3_600825_evidence_join "$RUNNER_TEMP/original.json" --markdown "$RUNNER_TEMP/clock.md" > "$RUNNER_TEMP/600825.json"
          )
          (
            cd "$RUNNER_TEMP/p3-002860"
            python -m collector.p3_002860_original_replay "$RUNNER_TEMP/p3-archive" > "$RUNNER_TEMP/002860.json"
          )
          python -m collector.p3_two_issuer_preopen_replay "$RUNNER_TEMP/600825.json" "$RUNNER_TEMP/002860.json" > preopen-replay.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          r = json.loads(Path("preopen-replay.json").read_bytes())
          assert r["notice_checks"] == 7 and r["known_at_cutoff"] == 0
          assert all(x["publication_proof_status"] == "FIRST_PUBLICATION_NOT_AUTHENTICATED" for x in r["events"])
          assert r["trade_gate"] == "BLOCKED" and r["orders"] == r["executable_candidates"] == []
          print("PREOPEN_REPLAY:", json.dumps({"notice_checks":r["notice_checks"],"known_at_cutoff":r["known_at_cutoff"],"trade_gate":r["trade_gate"]}))
          PYCODE
      - name: Independently retrieve both official copies of 002860 notice
        run: |
          set -euo pipefail
          curl -fsS --max-time 35 --max-filesize 4194304 'https://static.cninfo.com.cn/finalpage/2026-10-14/1225604019.PDF' -o "$RUNNER_TEMP/cninfo-002860.pdf"
          curl -fsS --max-time 35 --max-filesize 4194304 'https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-10-14/2f0457c8-7fda-4e8e-b3ea-25799041a231.PDF' -o "$RUNNER_TEMP/szse-002860.pdf"
          python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          a=(root/"cninfo-002860.pdf").read_bytes()
          b=(root/"szse-002860.pdf").read_bytes()
          expected="4c9fe6862db1119fbe4090f590ff7c00c76d791ece3be58543559a5c82238eee"
          if not a.startswith(b"%PDF-") or a!=b or hashlib.sha256(a).hexdigest()!=expected:
              raise ValueError("official copy bytes mismatch")
          r={"issuer":"sz.002860","notice_number":"2026-047","independent_retrieval_in_this_run":True,"identical_pdf_sha256":expected,"official_first_release_verified":False,"historical_PIT_verified":False,"trade_gate":"BLOCKED","orders":[],"executable_candidates":[]}
          Path("cross-publisher-replay.json").write_text(json.dumps(r,sort_keys=True)+"\n")
          print("CROSS_PUBLISHER_REPLAY:",json.dumps(r,sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: p3-two-issuer-preopen-replay
          path: |
            preopen-replay.json
            cross-publisher-replay.json
          if-no-files-found: error
