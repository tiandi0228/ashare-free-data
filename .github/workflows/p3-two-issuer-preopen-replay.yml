name: P3 two issuer pre-open gate replay (NO TRADES)
on:
  pull_request:
    branches: [main]
    paths:
      - 'collector/p3_two_issuer_preopen_replay.py'
      - 'collector/p3_publication_asof_gate.py'
      - '.github/workflows/p3-two-issuer-preopen-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ARCHIVE: 7028eb4c9cc7f23add64958bc6f2611565476538
      CASE_600825: c1b454e19117c59ed956d609e6a26a7ed5f95120
      CASE_002860: 69b856e2939c05cf849748b28ce912c8dd5b3a65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p3_publication_asof_gate -v
      - run: command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Regenerate pinned source replays and pre-open check
        run: |
          git fetch --depth=1 origin "$ARCHIVE" "$CASE_600825" "$CASE_002860"
          git worktree add --detach "$RUNNER_TEMP/p3-archive" "$ARCHIVE"
          git worktree add --detach "$RUNNER_TEMP/p3-600825" "$CASE_600825"
          git worktree add --detach "$RUNNER_TEMP/p3-002860" "$CASE_002860"
          (
            cd "$RUNNER_TEMP/p3-600825"
            python -m collector.p3_600825_original_replay --archive "$RUNNER_TEMP/p3-archive" > "$RUNNER_TEMP/original.json"
            python -m collector.p3_600825_evidence_join "$RUNNER_TEMP/original.json" --markdown "$RUNNER_TEMP/clock.md" > "$RUNNER_TEMP/600825.json"
          )
          (
            cd "$RUNNER_TEMP/p3-002860"
            python -m collector.p3_002860_original_replay "$RUNNER_TEMP/p3-archive" > "$RUNNER_TEMP/002860.json"
          )
          python -m collector.p3_two_issuer_preopen_replay "$RUNNER_TEMP/600825.json" "$RUNNER_TEMP/002860.json" > preopen-replay.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          r = json.loads(Path("preopen-replay.json").read_bytes())
          assert r["notice_checks"] == 7 and r["known_at_cutoff"] == 0
          assert all(x["publication_proof_status"] == "FIRST_PUBLICATION_NOT_AUTHENTICATED" for x in r["events"])
          assert r["trade_gate"] == "BLOCKED" and r["orders"] == []
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: p3-two-issuer-preopen-replay
          path: preopen-replay.json
          if-no-files-found: error
