name: P3 FREE one-shot CNINFO original PDF SHA reacquisition (NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-cninfo-sha-reacquire-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-cninfo-original-once
  cancel-in-progress: false

jobs:
  verify_pdf_origins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reacquire exactly two known public issuer PDFs, bounded, no redistribution
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.error
          from pathlib import Path
          targets=[
            ("2026-05-23","https://static.cninfo.com.cn/finalpage/2026-05-23/1225327963.PDF","ef9b9113b2a51ca718e786de0613860351f0c8056916e7decb5a010da7acaff8"),
            ("2026-06-19","https://static.cninfo.com.cn/finalpage/2026-06-19/1225377517.PDF","6e43f458ee70b11dc5ab7331c2d67dee62dc26fa2121e138a2c93ef71c65409f")
          ]
          results=[]
          for date,url,expected in targets:
              item={"document_date":date,"source_url":url,"expected_sha256":expected,"actual_sha256":None,"status":"SOURCE_UNAVAILABLE","attempts":1}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"ashare-free-data-research-audit/1.0"})
                  with urllib.request.urlopen(req,timeout=22) as res:
                      data=res.read(1_000_001)
                  if len(data)>1_000_000 or not data.startswith(b"%PDF-"):
                      item["status"]="INVALID_OR_OVERSIZE"
                  else:
                      item["source_bytes"]=len(data)
                      item["actual_sha256"]=hashlib.sha256(data).hexdigest()
                      item["status"]="SHA_MATCH" if item["actual_sha256"]==expected else "SHA_DRIFT"
              except Exception as e:
                  item["failure_class"]=type(e).__name__
              results.append(item)
          out={"phase":"P3_TWO_KNOWN_CNINFO_PDF_ORIGINAL_REACQUIRE","results":results,
               "source_original_bytes_stored":False,"historical_publication_instant_authenticated":False,
               "official_exchange_delist_effective_document_verified":False,
               "full_market_ST_halt_delist_verified":False,"paid_api_calls":0,
               "trade_gate":"BLOCKED","orders":[],"executable_candidates":[]}
          Path("audit").mkdir(exist_ok=True)
          Path("audit/p3_cninfo_source_reacquisition.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False))
          assert all(r["status"]=="SHA_MATCH" for r in results), "Source failure/drift: do not promote any evidence"
          PY
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-two-cninfo-original-sha-reacquire-BLOCKED
          path: audit/p3_cninfo_source_reacquisition.json
          retention-days: 14
          if-no-files-found: warn
