name: P1 FREE exactly-two-source SHA reacquisition (RESEARCH, NO TRADES)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-two-source-single-reacquisition
  cancel-in-progress: false

jobs:
  exact_digest_research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run every offline safety regression before networking
        run: |
          python -m py_compile collector/reacquire_source_digest.py
          python -m unittest discover -s tests -v
      - name: Install free Baostock client
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Requery EXACT two frozen issuers ONCE without raw redistribution
        run: |
          timeout 135s python -m collector.reacquire_source_digest \
            --out evidence/reacquire_two_originals_by_SHA_only.json
      - name: Independently validate source comparison and blocked gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/reacquire_two_originals_by_SHA_only.json")
          assert p.exists(), "Source query report unavailable"
          q=json.loads(p.read_text())
          assert q["phase"]=="P1_ZERO_COST_BOUNDED_HISTORICAL_SOURCE_REACQUISITION"
          assert q["max_issuer_queries"]==2 and q["issuer_queries"]<=2
          assert q["paid_api_calls"]==0 and q["trade_gate"]=="BLOCKED"
          assert q["orders"]==[] and q["executable_candidates"]==[]
          assert q["candidate_universe"]==[]
          assert q["source_raw_csv_republished"] is False
          assert q["source_raw_bytes_durably_archived"] is False
          assert q["provider_historical_version_can_change"] is True
          assert q["status"]=="TWO_SOURCES_REACQUIRED_IDENTICAL_NOW_NO_DURABLE_STORAGE", (
             "Source failed/revised; fail closed, preserve status "+str(q["status"])
          )
          assert [x["code"] for x in q["source_reports"]]==["sh.600421","sh.600000"]
          assert all(x["same_SHA256_and_row_count"] for x in q["source_reports"])
          print("PASS: re-acquired two original-source bytes identically now;")
          print("still NO permanent raw archive, official PIT or trading unlock.")
          PY
      - name: Retain SHA-only vendor revision observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-two-source-on-demand-byte-reacquisition-no-original-redistribution
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
