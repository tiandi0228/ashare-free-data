name: P3 free prospective official-source observation (NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-prospective-official-observation.yml'
  schedule:
    - cron: '45 7 * * 1-5'  # 15:45 China Standard Time, weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-prospective-official-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture exchange indexes and free CNINFO fallback, bounded metadata only
        run: |
          python - <<'PY'
          import datetime,hashlib,json,pathlib,re,urllib.request
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(datetime.timezone.utc)
          china=now.astimezone(ZoneInfo("Asia/Shanghai"))
          targets=[
            ("SSE","https://www.sse.com.cn/disclosure/listedinfo/announcement/index.shtml"),
            ("SZSE","https://www.szse.cn/disclosure/notice/company/index.html"),
            ("CNINFO_FALLBACK","https://www.cninfo.com.cn/new/index"),
          ]
          rows=[]
          for publisher,url in targets:
            row={"publisher":publisher,"url":url,"observed_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 "status":"UNAVAILABLE","source_sha256":None,"bytes":None,"network_requests":1}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ashare-free-data-research/1.0","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=12) as resp:
                if resp.geturl()!=url:raise ValueError("unapproved redirect")
                raw=resp.read(500001)
              if not raw or len(raw)>500000:raise ValueError("invalid size")
              row.update(status="OBSERVED_HTML_ONLY",source_sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw))
            except Exception as exc:
              row["failure_type"]=type(exc).__name__
            rows.append(row)
          # Extract only real links explicitly present in the fetched document.
          # A landing page with no links is not an announcement feed.
          import urllib.parse
          announcement_links=[]
          for row in rows:
            if row["status"]!="OBSERVED_HTML_ONLY":continue
            url=row["url"]
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ashare-free-data-research/1.0","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=12) as resp:
                body=resp.read(500001).decode("utf-8","replace")
              for match in re.finditer(r'href=["\\\']([^"\\\']+)["\\\']',body,re.I):
                href=urllib.parse.urljoin(url,match.group(1))
                host=urllib.parse.urlparse(href).hostname or ""
                if (host in ("www.sse.com.cn","www.szse.cn","www.cninfo.com.cn","static.cninfo.com.cn")
                    and ("/finalpage/" in href or "/disclosure/announcement/" in href)
                    and urllib.parse.urlparse(href).path.lower().endswith((".pdf",".shtml",".html"))
                    and href not in announcement_links):
                  announcement_links.append(href)
                if len(announcement_links)>=20:break
            except Exception:pass
          observed=[r for r in rows if r["status"]=="OBSERVED_HTML_ONLY"]
          report={
            "phase":"P3_PROSPECTIVE_OFFICIAL_SOURCE_INDEX_OBSERVATION",
            "captured_at_utc":now.isoformat(),
            "china_calendar_date":china.date().isoformat(),
            "observations":rows,
            "index_pages_observed":len(observed),
            "announcement_links_observed":len(announcement_links),
            "announcement_link_examples":announcement_links[:10],
            "individual_announcements_authenticated":False,
            "source_reachability_status":"INDEX_REACHABLE_RESEARCH_ONLY" if observed else "NO_SOURCE_REACHABLE",
            "szse_exchange_host_access_verified":any(r["publisher"]=="SZSE" for r in observed),
            "cninfo_is_not_szse_exchange_authentication":True,
            "prospective_index_page_is_historical_issuer_state":False,
            "full_historical_ST_halt_delist_verified":False,
            "official_intraday_publication_certified":False,
            "replayable_original_bytes_saved":False,
            "paid_api_calls":0,"trade_gate":"BLOCKED","orders":[],"executable_candidates":[]
          }
          p=pathlib.Path("audit");p.mkdir(exist_ok=True)
          (p/"official_index_capture.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report))
          assert len(rows)==3 and report["trade_gate"]=="BLOCKED"
          if not observed:
            raise SystemExit("NO_SOURCE_REACHABLE: all free official/public disclosure indexes failed")
          PY
      - name: Query bounded CNINFO announcements with verified page boundaries
        run: |
          python - <<'PY'
          import datetime,hashlib,json,pathlib,urllib.parse,urllib.request
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(datetime.timezone.utc)
          day=now.astimezone(ZoneInfo("Asia/Shanghai")).date().isoformat()
          url="https://www.cninfo.com.cn/new/hisAnnouncement/query"
          output=[]
          for column in ("sse","szse"):
            seen=set()
            result={"column":column,"request_day":day,"status":"UNAVAILABLE",
                    "record_count":0,"records":[],"pages":[],"pagination_complete":False,"exchange_scope_filter_applied":True}
            total=None
            try:
              for page in range(1,4):
                form={"pageNum":str(page),"pageSize":"30","tabName":"fulltext",
                      "column":column,"plate":"","stock":"","searchkey":"",
                      "secid":"","category":"","trade":"","seDate":day+"~"+day,
                      "sortName":"","sortType":"","isHLtitle":"false"}
                req=urllib.request.Request(url,data=urllib.parse.urlencode(form).encode(),
                    headers={"User-Agent":"Mozilla/5.0","Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
                             "X-Requested-With":"XMLHttpRequest","Referer":"https://www.cninfo.com.cn/new/index"},method="POST")
                with urllib.request.urlopen(req,timeout=12) as resp:
                  if resp.geturl()!=url:raise ValueError("redirect")
                  body=resp.read(500001)
                if len(body)>500000:raise ValueError("oversize")
                obj=json.loads(body)
                records=obj.get("announcements")
                if not isinstance(records,list) or len(records)>30:raise ValueError("invalid page shape")
                declared=obj.get("totalAnnouncement")
                if type(declared) is not int or declared<0:raise ValueError("missing totalAnnouncement")
                if total is None:total=declared
                if total!=declared:raise ValueError("total changed between pages")
                accepted=0
                for x in records:
                  if not isinstance(x,dict):continue
                  code,title,adjunct=x.get("secCode"),x.get("announcementTitle"),x.get("adjunctUrl")
                  if not all(isinstance(y,str) for y in (code,title,adjunct)):continue
                  if not code.isdigit() or len(code)!=6:continue
                  if column=="sse" and not code.startswith(("600","601","603","605","688","689")):continue
                  if column=="szse" and not code.startswith(("000","001","002","003","300","301")):continue
                  if not adjunct.startswith("finalpage/") or not adjunct.lower().endswith(".pdf"):continue
                  identifier=x.get("announcementId")
                  if identifier is None:continue
                  if str(identifier) in seen:raise ValueError("duplicate announcementId across pages")
                  seen.add(str(identifier))
                  result["records"].append({"code":code,"title":title[:160],
                      "announcement_id":str(identifier),"announcement_time_ms":x.get("announcementTime"),
                      "pdf_url":"https://static.cninfo.com.cn/"+adjunct})
                  accepted+=1
                result["pages"].append({"number":page,"raw_count":len(records),
                    "accepted_count":accepted,"sha256":hashlib.sha256(body).hexdigest()})
                if page*30>=total:
                  result["pagination_complete"]=True
                  break
                if len(records)!=30:raise ValueError("short nonterminal page")
              result.update(status="OBSERVED_RECORDS_RESEARCH_ONLY" if result["pagination_complete"]
                            else "PARTIAL_PAGE_CAP_REACHED",total_announcements_reported=total,
                            record_count=len(result["records"]))
            except Exception as exc:
              result.update(status="PARTIAL_OR_FAILED",pagination_complete=False,
                            record_count=len(result["records"]),failure_type=type(exc).__name__)
            output.append(result)
          receipt={"phase":"P3_CNINFO_BOUNDED_PROSPECTIVE_INDEX",
                   "observed_at_utc":now.isoformat(),"columns":output,
                   "page_cap_per_column":3,"page_size":30,
                   "all_columns_complete":all(x["pagination_complete"] for x in output),
                   "historical_publication_instant_authenticated":False,
                   "not_complete_market_disclosure":True,"paid_api_calls":0,
                   "trade_gate":"BLOCKED","orders":[],"executable_candidates":[]}
          root=pathlib.Path("audit");root.mkdir(exist_ok=True)
          (root/"cninfo_announcements.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"statuses":[x["status"] for x in output],
                            "record_counts":[x["record_count"] for x in output],
                            "totals":[x.get("total_announcements_reported") for x in output],
                            "complete":[x["pagination_complete"] for x in output],"gate":"BLOCKED"}))
          PY
      - name: Preserve timestamped metadata without republishing originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-official-index-metadata-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
