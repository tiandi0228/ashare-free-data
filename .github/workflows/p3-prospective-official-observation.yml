name: P3 free prospective official-source observation (NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-prospective-official-observation.yml'
  schedule:
    - cron: '45 7 * * 1-5'  # 15:45 China Standard Time, weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-prospective-official-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture exchange indexes and free CNINFO fallback, bounded metadata only
        run: |
          python - <<'PY'
          import datetime,hashlib,json,pathlib,re,urllib.request
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(datetime.timezone.utc)
          china=now.astimezone(ZoneInfo("Asia/Shanghai"))
          targets=[
            ("SSE","https://www.sse.com.cn/disclosure/listedinfo/announcement/index.shtml"),
            ("SZSE","https://www.szse.cn/disclosure/notice/company/index.html"),
            ("CNINFO_FALLBACK","https://www.cninfo.com.cn/new/index"),
          ]
          rows=[]
          for publisher,url in targets:
            row={"publisher":publisher,"url":url,"observed_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 "status":"UNAVAILABLE","source_sha256":None,"bytes":None,"network_requests":1}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ashare-free-data-research/1.0","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=12) as resp:
                if resp.geturl()!=url:raise ValueError("unapproved redirect")
                raw=resp.read(500001)
              if not raw or len(raw)>500000:raise ValueError("invalid size")
              row.update(status="OBSERVED_HTML_ONLY",source_sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw))
            except Exception as exc:
              row["failure_type"]=type(exc).__name__
            rows.append(row)
          # Extract only real links explicitly present in the fetched document.
          # A landing page with no links is not an announcement feed.
          import urllib.parse
          announcement_links=[]
          for row in rows:
            if row["status"]!="OBSERVED_HTML_ONLY":continue
            url=row["url"]
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ashare-free-data-research/1.0","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=12) as resp:
                body=resp.read(500001).decode("utf-8","replace")
              for match in re.finditer(r'href=["\\\']([^"\\\']+)["\\\']',body,re.I):
                href=urllib.parse.urljoin(url,match.group(1))
                host=urllib.parse.urlparse(href).hostname or ""
                if (host in ("www.sse.com.cn","www.szse.cn","www.cninfo.com.cn","static.cninfo.com.cn")
                    and ("/finalpage/" in href or "/disclosure/announcement/" in href)
                    and urllib.parse.urlparse(href).path.lower().endswith((".pdf",".shtml",".html"))
                    and href not in announcement_links):
                  announcement_links.append(href)
                if len(announcement_links)>=20:break
            except Exception:pass
          observed=[r for r in rows if r["status"]=="OBSERVED_HTML_ONLY"]
          report={
            "phase":"P3_PROSPECTIVE_OFFICIAL_SOURCE_INDEX_OBSERVATION",
            "captured_at_utc":now.isoformat(),
            "china_calendar_date":china.date().isoformat(),
            "observations":rows,
            "index_pages_observed":len(observed),
            "announcement_links_observed":len(announcement_links),
            "announcement_link_examples":announcement_links[:10],
            "individual_announcements_authenticated":False,
            "source_reachability_status":"INDEX_REACHABLE_RESEARCH_ONLY" if observed else "NO_SOURCE_REACHABLE",
            "szse_exchange_host_access_verified":any(r["publisher"]=="SZSE" for r in observed),
            "cninfo_is_not_szse_exchange_authentication":True,
            "prospective_index_page_is_historical_issuer_state":False,
            "full_historical_ST_halt_delist_verified":False,
            "official_intraday_publication_certified":False,
            "replayable_original_bytes_saved":False,
            "paid_api_calls":0,"trade_gate":"BLOCKED","orders":[],"executable_candidates":[]
          }
          p=pathlib.Path("audit");p.mkdir(exist_ok=True)
          (p/"official_index_capture.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report))
          assert len(rows)==3 and report["trade_gate"]=="BLOCKED"
          if not observed:
            raise SystemExit("NO_SOURCE_REACHABLE: all free official/public disclosure indexes failed")
          PY
      - name: Query one full-market CNINFO announcement stream with bounded pagination
        run: |
          python - <<'PY'
          import datetime,hashlib,json,pathlib,urllib.parse,urllib.request
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(datetime.timezone.utc)
          day=now.astimezone(ZoneInfo("Asia/Shanghai")).date().isoformat()
          url="https://www.cninfo.com.cn/new/hisAnnouncement/query"
          seen=set(); records=[]; pages=[]; total=None; status="UNAVAILABLE"
          try:
            for page in range(1,37):
              form={"pageNum":str(page),"pageSize":"30","tabName":"fulltext",
                    "column":"","plate":"","stock":"","searchkey":"",
                    "secid":"","category":"","trade":"","seDate":day+"~"+day,
                    "sortName":"","sortType":"","isHLtitle":"false"}
              req=urllib.request.Request(url,data=urllib.parse.urlencode(form).encode(),
                  headers={"User-Agent":"Mozilla/5.0","Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
                           "X-Requested-With":"XMLHttpRequest","Referer":"https://www.cninfo.com.cn/new/index"},method="POST")
              with urllib.request.urlopen(req,timeout=12) as resp:
                if resp.geturl()!=url:raise ValueError("redirect")
                body=resp.read(500001)
              if len(body)>500000:raise ValueError("oversize")
              obj=json.loads(body)
              batch=obj.get("announcements")
              declared=obj.get("totalAnnouncement")
              if not isinstance(batch,list) or len(batch)>30:raise ValueError("invalid page shape")
              if type(declared) is not int or declared<0:raise ValueError("invalid count")
              if total is None:total=declared
              if total!=declared:raise ValueError("count changed")
              accepted=0
              for item in batch:
                if not isinstance(item,dict):continue
                identifier=item.get("announcementId")
                if identifier is None:raise ValueError("missing announcement ID")
                if str(identifier) in seen:raise ValueError("repeated ID across pages")
                seen.add(str(identifier))
                code=item.get("secCode")
                title=item.get("announcementTitle")
                adjunct=item.get("adjunctUrl")
                if not all(isinstance(x,str) for x in (code,title,adjunct)):continue
                if len(code)!=6 or not code.isascii() or not code.isdigit():continue
                market=("SH" if code.startswith(("600","601","603","605")) else
                        "SZ" if code.startswith(("000","001","002","003")) else None)
                if market is None:continue
                if not adjunct.startswith("finalpage/") or not adjunct.lower().endswith(".pdf"):continue
                records.append({"announcement_id":str(identifier),"code":code,"market":market,
                    "title":title[:160],"announcement_time_ms":item.get("announcementTime"),
                    "pdf_url":"https://static.cninfo.com.cn/"+adjunct})
                accepted+=1
              pages.append({"page":page,"raw_rows":len(batch),"accepted_mainboard_rows":accepted,
                            "response_sha256":hashlib.sha256(body).hexdigest()})
              if page*30>=total:
                status="BOUNDED_PAGE_STREAM_COMPLETE_RESEARCH_ONLY";break
              if len(batch)!=30:raise ValueError("short intermediate page")
            else:status="PAGE_CAP_REACHED_INCOMPLETE"
          except Exception as exc:
            status="PARTIAL_OR_FAILED_"+type(exc).__name__
          complete=(status=="BOUNDED_PAGE_STREAM_COMPLETE_RESEARCH_ONLY")
          # A stable total and distinct IDs are necessary, but a live list can
          # still shift during paging. Never certify a PIT market snapshot.
          if complete and total!=len(seen):
            status="INCOMPLETE_RAW_ID_COUNT_MISMATCH"
            complete=False
          result={"phase":"P3_CNINFO_SINGLE_STREAM_PROSPECTIVE_RESEARCH",
                  "capture_utc":now.isoformat(),"query_day":day,"status":status,
                  "reported_total":total,"pages":pages,
                  "raw_rows_seen":sum(p["raw_rows"] for p in pages),
                  "unique_raw_announcement_ids":len(seen),
                  "mainboard_records":records,"mainboard_record_count":len(records),
                  "pagination_complete":complete,"max_pages_per_run":36,
                  "raw_count_matches_reported_total":total==len(seen),
                  "full_market_historical_snapshot_verified":False,
                  "market_scoping_from_code_only":True,
                  "mainboard_membership_historical_PIT_verified":False,
                  "historical_publication_instant_authenticated":False,
                  "all_historical_risk_events_complete":False,
                  "paid_api_calls":0,"trade_gate":"BLOCKED","orders":[],"executable_candidates":[]}
          root=pathlib.Path("audit");root.mkdir(exist_ok=True)
          (root/"cninfo_announcements.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:result[k] for k in ("status","reported_total","raw_rows_seen","unique_raw_announcement_ids","mainboard_record_count","pagination_complete","trade_gate")}))
          PY
      - name: Triage candidate risk notices without certifying issuer state
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          p=Path("audit/cninfo_announcements.json")
          data=json.loads(p.read_text())
          rules={
            "risk_warning":r"(?:撤销|实施|终止|申请|继续).*风险警示|风险警示|\\*ST|退市风险",
            "trading_halt":r"停牌|复牌|暂停交易",
            "delisting":r"终止上市|退市整理|摘牌|主动退市",
          }
          counts=Counter()
          matches=[]
          for item in data.get("mainboard_records",[]):
            title=item.get("title","")
            kinds=[k for k,pattern in rules.items() if re.search(pattern,title,re.I)]
            if not kinds:continue
            for k in kinds:counts[k]+=1
            matches.append({k:item[k] for k in ("announcement_id","code","market","title","pdf_url")})
            matches[-1]["candidate_categories"]=kinds
          report={"phase":"P3_TITLE_ONLY_RISK_CANDIDATE_TRIAGE",
            "source_pagination_complete":data.get("pagination_complete") is True,
            "candidate_count":len(matches),"category_hit_counts":dict(counts),
            "candidates":matches,
            "classification_only_not_legal_effect":True,
            "official_pdf_bytes_verified":False,
            "historical_effective_date_verified":False,
            "historical_asof_verified":False,
            "trade_gate":"BLOCKED","orders":[],"executable_candidates":[]}
          Path("audit/p3_title_risk_candidates.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"candidate_count":len(matches),"category_hit_counts":dict(counts),
                            "source_pagination_complete":report["source_pagination_complete"],
                            "trade_gate":"BLOCKED"},ensure_ascii=False))
          PY
      - name: Install free PDF text extractor
        run: python -m pip install "pypdf>=5,<7"
      - name: Independently fetch bounded candidate PDF originals and hash bytes
        run: |
          python - <<'PY'
          import datetime,hashlib,io,json,pathlib,re,urllib.parse,urllib.request
          from pypdf import PdfReader
          root=pathlib.Path("audit")
          audit=json.loads((root/"p3_title_risk_candidates.json").read_text())
          rows=[]
          for item in audit["candidates"][:8]:
            url=item["pdf_url"]
            out={"announcement_id":item["announcement_id"],"code":item["code"],
                 "retrieved_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 "pdf_url":url,"status":"FAILED"}
            try:
              parsed=urllib.parse.urlparse(url)
              if parsed.scheme!="https" or parsed.hostname!="static.cninfo.com.cn" or not parsed.path.startswith("/finalpage/"):
                raise ValueError("invalid PDF host/path")
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=12) as resp:
                if urllib.parse.urlparse(resp.geturl()).hostname!="static.cninfo.com.cn":raise ValueError("redirect")
                raw=resp.read(3000001)
              if len(raw)>3000000 or not raw.startswith(b"%PDF-"):
                raise ValueError("invalid bounded PDF")
              out.update(status="ORIGINAL_BYTES_CAPTURED_RESEARCH_ONLY",
                         bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              try:
                reader=PdfReader(io.BytesIO(raw),strict=True)
                if reader.is_encrypted:raise ValueError("encrypted PDF")
                if len(reader.pages)>80:raise ValueError("too many pages")
                text=" ".join((page.extract_text() or "") for page in reader.pages)
                signals={
                  "trading_halt":bool(re.search("停牌|复牌|暂停交易",text)),
                  "delisting":bool(re.search("终止上市|退市整理|摘牌",text)),
                  "risk_warning":bool(re.search("风险警示|\\\\*ST",text)),
                }
                # Date mentions may refer to unrelated events: never declare effective date.
                dates=list(dict.fromkeys(re.findall(r"20[0-9]{2}年[0-9]{1,2}月[0-9]{1,2}日",text)))[:8]
                # Distinguish candidate date contexts; no effective state is asserted.
                context_patterns={
                  "possible_effective":r"(?:自|于|从)\\s*(20[0-9]{2}年[0-9]{1,2}月[0-9]{1,2}日).{0,24}(?:起|开始|终止上市|停牌|复牌)",
                  "board_decision":r"(?:董事会|决议|审议通过).{0,100}?(20[0-9]{2}年[0-9]{1,2}月[0-9]{1,2}日)",
                }
                context_hints={k:list(dict.fromkeys(re.findall(p,text)))[:5] for k,p in context_patterns.items()}
                out.update(pdf_pages=len(reader.pages),text_chars=len(text),
                           body_keyword_signals=signals,date_mentions_unverified=dates,
                           date_context_hints_unverified=context_hints,
                           text_extraction_status="TEXT_OBSERVED_NOT_LEGALLY_CLASSIFIED" if text else "NO_EXTRACTABLE_TEXT")
              except Exception as parse_exc:
                out["text_extraction_status"]="FAILED_"+type(parse_exc).__name__
            except Exception as exc:
              out["failure_type"]=type(exc).__name__
            rows.append(out)
          result={"phase":"P3_BOUNDED_RISK_PDF_BYTES_RECAPTURE",
                  "candidates_available":len(audit["candidates"]),
                  "attempted":len(rows),
                  "successful":sum(x["status"]=="ORIGINAL_BYTES_CAPTURED_RESEARCH_ONLY" for x in rows),
                  "receipts":rows,
                  "original_bytes_archived":False,
                  "historical_publication_instant_verified":False,
                  "actual_issuer_state_verified":False,
                  "trade_gate":"BLOCKED","orders":[],"executable_candidates":[],"paid_api_calls":0}
          result["text_extracted_count"]=sum(x.get("text_extraction_status")=="TEXT_OBSERVED_NOT_LEGALLY_CLASSIFIED" for x in rows)
          result["no_text_count"]=sum(x.get("text_extraction_status")=="NO_EXTRACTABLE_TEXT" for x in rows)
          result["text_extraction_failed_count"]=sum(str(x.get("text_extraction_status","")).startswith("FAILED_") for x in rows)
          result["body_signal_counts"]={name:sum(x.get("body_keyword_signals",{}).get(name) is True for x in rows) for name in ("trading_halt","delisting","risk_warning")}
          result["date_context_hint_counts"]={name:sum(len(x.get("date_context_hints_unverified",{}).get(name,[])) for x in rows) for name in ("possible_effective","board_decision")}
          result["date_context_documents"]={name:sum(bool(x.get("date_context_hints_unverified",{}).get(name)) for x in rows) for name in ("possible_effective","board_decision")}
          result["date_hint_reconciliation_required"]=True
          result["effective_dates_legally_verified"]=0
          (root/"p3_risk_pdf_hash_receipts.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps({"attempted":result["attempted"],"successful":result["successful"],"text_extracted_count":result["text_extracted_count"],"no_text_count":result["no_text_count"],"text_extraction_failed_count":result["text_extraction_failed_count"],"body_signal_counts":result["body_signal_counts"],"date_context_hint_counts":result["date_context_hint_counts"],"date_context_documents":result["date_context_documents"],"effective_dates_legally_verified":0,"trade_gate":"BLOCKED"}))
          PY
      - name: Preserve timestamped metadata without republishing originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-official-index-metadata-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
