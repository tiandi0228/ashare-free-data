name: P3 six issuer free official ST halt IPO event probe (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-free-official-two-issuer-probe.yml'
      - 'collector/p3_free_official_multi_issuer_probe.py'
      - 'collector/p3_publication_time_provenance_gate.py'
      - 'collector/p3_official_scope_overlap.py'
      - 'collector/p3_real_official_discovery_queue.py'
      - 'collector/p3_real_target_index_probe.py'
      - 'collector/p3_real_target_pdf_capture.py'
      - 'tests/test_p3_real_target_pdf_capture.py'
      - 'tests/test_p3_real_target_index_probe.py'
      - 'tests/test_p3_real_official_discovery_queue.py'
      - 'tests/test_p3_official_scope_overlap.py'
      - 'tests/test_p3_publication_time_provenance_gate.py'
      - 'collector/p3_free_official_probe_manifest.json'
      - 'tests/test_p3_official_source_redirect.py'
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Test allowlisted official original URL redirects
        run: python -m unittest tests.test_p3_official_source_redirect -v
      - name: Test historical publication provenance fail-closed policy
        run: python -m unittest tests.test_p3_publication_time_provenance_gate -v
      - name: Test P1 versus official-source cross-coverage accounting
        run: python -m unittest tests.test_p3_official_scope_overlap -v
      - name: Test real unmatched official discovery targeting
        run: python -m unittest tests.test_p3_real_official_discovery_queue -v
      - name: Test bounded real P1 issuer index discovery
        run: python -m unittest tests.test_p3_real_target_index_probe -v
      - name: Test bounded real issuer PDF capture
        run: python -m unittest tests.test_p3_real_target_pdf_capture -v
      - name: Acquire six original official-source announcements for free
        run: python -m collector.p3_free_official_multi_issuer_probe --manifest collector/p3_free_official_probe_manifest.json --out evidence
      - name: Reject unsupported original-publication timestamp claims
        run: python -m collector.p3_publication_time_provenance_gate --receipt evidence/quality.json --out evidence/publication_provenance_gate.json
      - name: Independently verify downloaded SHA receipts
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          q=json.loads(Path("evidence/quality.json").read_text())
          assert q["source_count"]==6
          assert q["trade_gate"]=="BLOCKED" and q["orders"]==[]
          assert q["historical_PIT_eligible"]==0
          for r in q["sources"]:
              file=Path("evidence")/(r["source_id"]+".pdf")
              assert r["announcement_id"].isdigit()
              assert r["announcement_id_origin"]=="PDF_URL_PATH_NOT_AUTHENTICATED_INDEX"
              assert r["announcement_id"] in r["url"]
              if r["original_bytes_verified"]:
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==r["sha256"]
              else:
                  assert not file.exists()
              assert r["PIT_publication_verified"] is False
              if r["original_bytes_verified"]:
                  assert r["final_official_url"].startswith("https://")
                  assert r["authenticated_first_published_at"] is None
                  assert r["http_headers_prove_first_publication"] is False
          assert q["originals_observed"] == 6 and q["content_matched"] == 6
          print("PASS: all six official original PDFs observed, content-matched and SHA checked; no historical PIT certification")
          PY
      - name: Download latest successful P1 worklist and measure real original-source overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow p1-fresh-vendor-roster.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful P1 research artifact is available" >&2
            exit 1
          fi
          echo "P1_SOURCE_RUN_ID=$RUN_ID"
          gh run download "$RUN_ID" --name "p1-fresh-roster-$RUN_ID" --dir p1-artifact
          test -s p1-artifact/p3_official_evidence_worklist.json
          python -m collector.p3_official_scope_overlap --worklist p1-artifact/p3_official_evidence_worklist.json --sources evidence/quality.json --out evidence/p1_official_scope_overlap.json
          python -m collector.p3_real_official_discovery_queue --worklist p1-artifact/p3_official_evidence_worklist.json --sources evidence/quality.json --out evidence/real_official_discovery_queue.json
          python -m collector.p3_real_target_index_probe --queue evidence/real_official_discovery_queue.json --out evidence/real_p1_index_candidates.json
          python -m collector.p3_real_target_pdf_capture --index evidence/real_p1_index_candidates.json --out evidence/real_p1_original_pdfs
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/p1_official_scope_overlap.json").read_text())
          assert r["trade_gate"]=="BLOCKED" and r["official_pit_certified_cells"]==0
          assert r["issuer_kind_source_overlap_cells"]+r["unmatched_cells"]==r["worklist_cells"]
          print("REAL P1-P3 SOURCE OVERLAP:", r["issuer_kind_source_overlap_cells"], "/", r["worklist_cells"], "potential issuer-kind leads; PIT certified 0")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-six-official-originals-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
