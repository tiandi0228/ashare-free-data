name: P4 prospective protocol freeze offline CI (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p4_prospective_protocol_freeze.py'
      - 'tests/test_p4_prospective_protocol_freeze.py'
      - '.github/workflows/p4-prospective-protocol-ci.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p4_prospective_protocol_freeze.py'
      - 'tests/test_p4_prospective_protocol_freeze.py'
      - '.github/workflows/p4-prospective-protocol-ci.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test immutable research fingerprint and fail-closed gates
        run: python -m unittest tests.test_p4_prospective_protocol_freeze -v
