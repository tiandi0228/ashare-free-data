name: P2 sector provenance contract (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p2_sector_rank_contract.py'
      - 'tests/test_p2_sector_rank_contract.py'
      - '.github/workflows/p2-sector-rank-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m unittest tests.test_p2_sector_rank_contract -v
      - name: Verify frozen universe artifact and demonstrate missing sector evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15169345741/zip > frozen.zip
          echo '29c314f023379729e5308b805a0ecd35188eccbdaeed4046387b7a2e1d35981d  frozen.zip' | sha256sum -c -
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          with zipfile.ZipFile("frozen.zip") as z:
              r=json.loads(z.read("p2-refresh-aggregate.json"))
          assert r["accepted_issuers"]==3194 and r["full_universe_observed"] is True and r["trade_gate"]=="BLOCKED"
          assert r["orders"]==r["executable_candidates"]==[]
          codes=[x["code"] for x in r["results"]]
          assert len(set(codes))==3194
          Path("sector-input.json").write_text(json.dumps(dict(asof=r["target_asof"],universe=codes,membership=[],returns=[])))
          PY
          python -m collector.p2_sector_rank_contract --input sector-input.json --out p2-sector-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-sector-contract
          path: p2-sector-contract.json
          if-no-files-found: error
