name: P2-P4 conservative engineering progress baseline (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/progress_baseline.py'
      - 'collector/p1_current_progress.py'
      - 'tests/test_p1_current_progress.py'
      - 'tests/test_progress_baseline.py'
      - 'progress_manifest.json'
      - 'collector/p4_friday_asof_preentry_guard.py'
      - 'collector/p4_partial_fill_reconciliation.py'
      - 'collector/p2_purged_oos_partition.py'
      - 'tests/test_p4_friday_asof_preentry_guard.py'
      - 'tests/test_p4_partial_fill_reconciliation.py'
      - 'tests/test_p2_purged_oos_partition.py'
      - 'collector/p2_real_archive_features.py'
      - 'collector/p2_real_proxy_purged_chronology.py'
      - 'collector/p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_real_archive_features.py'
      - 'tests/test_p2_real_proxy_purged_chronology.py'
      - 'collector/p3_archived_event_episode_ledger.py'
      - 'tests/test_p3_archived_event_episode_ledger.py'
      - 'collector/p4_fee_floor_gap_audit.py'
      - 'tests/test_p4_fee_floor_gap_audit.py'
      - 'collector/p2_feature_coverage_ledger.py'
      - 'tests/test_p2_feature_coverage_ledger.py'
      - 'collector/p3_official_original_archive.py'
      - 'tests/test_p3_official_original_archive.py'
      - 'collector/p4_three_to_five_vendor_horizon.py'
      - 'tests/test_p4_three_to_five_vendor_horizon.py'
      - '.github/workflows/progress-baseline-offline.yml'
  push:
    branches: [main]
    paths:
      - 'collector/progress_baseline.py'
      - 'collector/p1_current_progress.py'
      - 'tests/test_p1_current_progress.py'
      - 'tests/test_progress_baseline.py'
      - 'progress_manifest.json'
      - 'collector/p4_friday_asof_preentry_guard.py'
      - 'collector/p4_partial_fill_reconciliation.py'
      - 'collector/p2_purged_oos_partition.py'
      - 'tests/test_p4_friday_asof_preentry_guard.py'
      - 'tests/test_p4_partial_fill_reconciliation.py'
      - 'tests/test_p2_purged_oos_partition.py'
      - 'collector/p2_real_archive_features.py'
      - 'collector/p2_real_proxy_purged_chronology.py'
      - 'collector/p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_real_archive_features.py'
      - 'tests/test_p2_real_proxy_purged_chronology.py'
      - 'collector/p3_archived_event_episode_ledger.py'
      - 'tests/test_p3_archived_event_episode_ledger.py'
      - 'collector/p4_fee_floor_gap_audit.py'
      - 'tests/test_p4_fee_floor_gap_audit.py'
      - '.github/workflows/progress-baseline-offline.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["P1 fresh Baostock mainboard roster observation (NO TRADES)"]
    types: [completed]
permissions:
  contents: read
jobs:
  baseline:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen milestones and zero unproved claims
        run: python -m unittest -v tests.test_progress_baseline tests.test_p1_current_progress
      - name: Validate purged P2 research windows and independent P4 partial-fill accounting
        run: |
          python -m unittest -v \
            tests.test_p2_purged_oos_partition \
            tests.test_p2_real_proxy_purged_chronology \
            tests.test_p2_prospective_parameter_preregistration \
            tests.test_p4_partial_fill_reconciliation
      - name: Independently run P2 P3 and P4 offline contracts
        run: |
          python -m collector.progress_baseline \
            --manifest progress_manifest.json --root . \
            --commit "${{ github.sha }}" --run-tests \
            --out evidence/progress_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/progress_report.json').read_text())
          assert x['trade_gate']=='BLOCKED' and x['historical_PIT_verified'] is False
          assert x['orders']==[] and x['executable_candidates']==[]
          for phase in ('P2','P3','P4'):
              y=x['stages'][phase]
              assert y['engineering_acceptance_baseline_pct']==(50 if phase=='P4' else 30)
              assert sum(z['passed'] for z in y['criteria'])==(5 if phase=='P4' else 3)
              assert y['formal_trading_ready'] is False
          print('P2/P3 three and P4 five bounded offline engineering contracts verified, no trading')
          PY
      - name: Validate current P1 pinned SHA checkpoint, never reuse old epochs
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m collector.p1_current_progress \
            --repo "${{ github.repository }}" \
            --out evidence/p1_current_progress.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/p1_current_progress.json').read_text())
          assert p['status']=='VERIFIED_DURABLE_LEDGER_NOT_MARKET_CERTIFICATION'
          assert p['trade_gate']=='BLOCKED' and p['historical_PIT_verified'] is False
          assert p['orders']==[] and p['executable_candidates']==[]
          print('Current P1 SHA pinned research progress:',p['completed_shards'],'/',p['total_shards'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stockmate-conservative-progress-${{ github.run_id }}
          path: |
            evidence/progress_report.json
            evidence/p1_current_progress.json
          if-no-files-found: warn
          retention-days: 14
