name: P3 dated media and conservative halt-window regressions (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p3_600150_dated_media_crosscheck.py'
      - 'tests/test_p3_600150_dated_media_crosscheck.py'
      - 'collector/p3_600150_halt_window_exclusion.py'
      - 'tests/test_p3_600150_halt_window_exclusion.py'
      - '.github/workflows/p3-600150-dated-media-crosscheck.yml'
  push:
    branches: ['feat/p3-600150-dated-media-crosscheck-20261112']
    paths:
      - 'collector/p3_600150_dated_media_crosscheck.py'
      - 'tests/test_p3_600150_dated_media_crosscheck.py'
      - 'collector/p3_600150_halt_window_exclusion.py'
      - 'tests/test_p3_600150_halt_window_exclusion.py'
      - '.github/workflows/p3-600150-dated-media-crosscheck.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify media crosscheck and issuer-claimed halt exclusion stay fail-closed
        run: python -m unittest -v tests.test_p3_600150_dated_media_crosscheck tests.test_p3_600150_halt_window_exclusion
