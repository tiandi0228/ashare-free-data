name: P3 600150 dated evidence and SSE-titled daily bulletin research (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p3_600150_dated_media_crosscheck.py'
      - 'tests/test_p3_600150_dated_media_crosscheck.py'
      - 'collector/p3_600150_halt_window_exclusion.py'
      - 'tests/test_p3_600150_halt_window_exclusion.py'
      - 'collector/p3_600150_sse_daily_bulletin_mirror.py'
      - 'tests/test_p3_600150_sse_daily_bulletin_mirror.py'
      - 'collector/p3_600150_sse_daily_artifact_replay.py'
      - 'tests/test_p3_600150_sse_daily_artifact_replay.py'
      - '.github/workflows/p3-600150-dated-media-crosscheck.yml'
  push:
    branches: ['feat/p3-600150-dated-media-crosscheck-20261112']
    paths:
      - 'collector/p3_600150_dated_media_crosscheck.py'
      - 'tests/test_p3_600150_dated_media_crosscheck.py'
      - 'collector/p3_600150_halt_window_exclusion.py'
      - 'tests/test_p3_600150_halt_window_exclusion.py'
      - 'collector/p3_600150_sse_daily_bulletin_mirror.py'
      - 'tests/test_p3_600150_sse_daily_bulletin_mirror.py'
      - 'collector/p3_600150_sse_daily_artifact_replay.py'
      - 'tests/test_p3_600150_sse_daily_artifact_replay.py'
      - '.github/workflows/p3-600150-dated-media-crosscheck.yml'
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify dated sources, conservative halt exclusion, bulletin acquisition safety
        run: |
          python -m unittest -v \
            tests.test_p3_600150_dated_media_crosscheck \
            tests.test_p3_600150_halt_window_exclusion \
            tests.test_p3_600150_sse_daily_bulletin_mirror \
            tests.test_p3_600150_sse_daily_artifact_replay
      - name: Fetch one exact SSE-titled 2025-08-18 source PDF as research artifact
        run: python -m collector.p3_600150_sse_daily_bulletin_mirror --output-dir evidence/p3_sse_daily_research
      - name: Preserve original research PDF and SHA receipt (30 days, NO TRADES)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-600150-sse-daily-research-${{ github.run_id }}
          path: evidence/p3_sse_daily_research/
          if-no-files-found: ignore
          retention-days: 30
      - name: Independently replay frozen real daily-bulletin ZIP/PDF receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/tiandi0228/ashare-free-data/actions/artifacts/13908412596/zip" \
            --output /tmp/p3_sse_daily_original.zip
          python -m collector.p3_600150_sse_daily_artifact_replay \
            --zip /tmp/p3_sse_daily_original.zip
