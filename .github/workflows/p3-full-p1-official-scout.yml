name: P3 rotating official originals for full audited P1 issuer queue (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p3_full_queue_scout.py'
      - 'collector/p3_archived_visit_hint.py'
      - 'tests/test_p3_archived_visit_hint.py'
      - 'collector/p3_full_queue_source_join.py'
      - 'collector/p3_original_effective_clause_review.py'
      - 'collector/p3_real_p1_pdf_text_cues.py'
      - 'tests/test_p3_real_p1_pdf_text_cues.py'
      - 'collector/p3_official_original_archive.py'
      - 'collector/p3_persisted_temporal_risk_triage.py'
      - 'collector/p3_index_chronology_guard.py'
      - 'tests/test_p3_index_chronology_guard.py'
      - 'collector/p3_archived_event_episode_ledger.py'
      - 'collector/p3_event_proof_gap_queue.py'
      - 'collector/p3_official_review_packets.py'
      - 'tests/test_p3_official_review_packets.py'
      - 'collector/p3_proof_gap_triage.py'
      - 'collector/p3_conflict_review_packet.py'
      - 'tests/test_p3_proof_gap_triage.py'
      - 'tests/test_p3_conflict_review_packet.py'
      - 'tests/test_p3_event_proof_gap_queue.py'
      - 'collector/p3_resume_followup_discovery.py'
      - 'collector/p3_resume_original_archive.py'
      - 'collector/p3_halt_resume_pair_review.py'
      - 'tests/test_p3_halt_resume_pair_review.py'
      - 'tests/test_p3_resume_followup_discovery.py'
      - 'tests/test_p3_resume_original_archive.py'
      - 'tests/test_p3_archived_event_episode_ledger.py'
      - 'tests/test_p3_persisted_temporal_risk_triage.py'
      - 'tests/test_p3_official_original_archive.py'
      - 'tests/test_p3_original_effective_clause_review.py'
      - 'tests/test_p3_full_queue_scout.py'
      - 'collector/p3_real_target_pdf_capture.py'
      - 'collector/p3_real_target_index_probe.py'
      - 'tests/test_p3_real_target_index_probe.py'
      - 'tests/test_p3_real_target_pdf_capture.py'
      - '.github/workflows/p3-full-p1-official-scout.yml'
  workflow_run:
    workflows: ['P1 fresh Baostock mainboard roster observation (NO TRADES)']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: p3-full-p1-official-scout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scout:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline boundaries and official-source tests
        run: python -m unittest tests.test_p3_full_queue_scout tests.test_p3_archived_visit_hint tests.test_p3_real_target_index_probe tests.test_p3_real_target_pdf_capture tests.test_p3_original_effective_clause_review tests.test_p3_official_original_archive tests.test_p3_persisted_temporal_risk_triage tests.test_p3_index_chronology_guard tests.test_p3_archived_event_episode_ledger tests.test_p3_event_proof_gap_queue tests.test_p3_proof_gap_triage tests.test_p3_conflict_review_packet tests.test_p3_official_review_packets tests.test_p3_resume_followup_discovery tests.test_p3_resume_original_archive tests.test_p3_halt_resume_pair_review -v
      - name: Install free PDF text parser
        run: python -m pip install 'pypdf>=4,<7'
      - name: Verify malformed archived-PDF quarantine and SHA integrity fail-closed
        run: python -m unittest -v tests.test_p3_real_p1_pdf_text_cues
      - name: Fetch successful original P1 queue artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME']=='workflow_run':
              upstream=event['workflow_run']
              if upstream['conclusion']!='success' or upstream['name']!='P1 fresh Baostock mainboard roster observation (NO TRADES)':
                  raise ValueError('unexpected upstream P1 run')
              run_id=upstream['id']
          else:
              recent=json.loads(subprocess.check_output(['gh','run','list','--workflow','p1-fresh-vendor-roster.yml','--limit','20','--json','databaseId,conclusion'],text=True))
              run_id=next(row['databaseId'] for row in recent if row['conclusion']=='success')
          Path('p1').mkdir(exist_ok=True)
          subprocess.run(['gh','run','download',str(run_id),'-n',f'p1-fresh-roster-{run_id}','-D','p1'],check=True)
          candidates=list(Path('p1').rglob('p3_all_completed_official_evidence_queue.json'))
          if len(candidates)!=1:raise ValueError('P1 full-issuer evidence queue artifact missing/ambiguous')
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/full_p1_queue.json').write_bytes(candidates[0].read_bytes())
          Path('evidence/upstream.json').write_text(json.dumps({'upstream_run_id':run_id,'is_historical_official_PIT_authenticated':False,'trade_gate':'BLOCKED'})+'\n')
          print('P3_SOURCE_P1_RUN',run_id)
          PY
      - name: Read optional independently SHA-checked P2 gap research priorities
        run: |
          if git ls-remote --exit-code --heads origin p2-feature-coverage >/dev/null 2>&1; then
            git fetch --depth=1 origin p2-feature-coverage
            python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          q=json.loads(Path('evidence/full_p1_queue.json').read_text())
          source=q['roster_source_sha256']
          if not re.fullmatch(r'[0-9a-f]{64}',source):
              raise SystemExit('Invalid current P3 source roster SHA')
          file=f"summaries/{source[:16]}.json"
          result=subprocess.run(['git','show',f'FETCH_HEAD:{file}'],
                                capture_output=True,text=True,timeout=25)
          if result.returncode==0:
              dst=Path('evidence/p2_verified_research_hint.json')
              dst.write_text(result.stdout)
              print('P2 source-bound research gap hint found')
          else:
              print('No matching P2 gap hint; retain bounded P3 original rotation')
          PY
          else
            echo "No prior P2 feature research branch; normal P3 source rotation"
          fi
      - name: Replay bounded previous P3 visit manifests as read-only research history
        run: |
          if git ls-remote --exit-code --heads origin research-official-originals-archive >/dev/null 2>&1; then
            git fetch --depth=1 origin research-official-originals-archive
            git worktree add --detach prior-official-research FETCH_HEAD
            SOURCE_SHA=$(python -c "import json;print(json.load(open('evidence/full_p1_queue.json'))['roster_source_sha256'])")
            python -m collector.p3_archived_visit_hint \
              --archive-root prior-official-research \
              --source-epoch "$SOURCE_SHA" \
              --out evidence/p3_prior_research_visits.json
          else
            echo "No prior official originals research archive; rotation remains safe"
          fi
      - name: Select three distinct current P1 historical official-source targets
        run: |
          ARGS=()
          if [ -s evidence/p2_verified_research_hint.json ]; then
            ARGS+=(--p2-feature-coverage evidence/p2_verified_research_hint.json)
          fi
          if [ -s evidence/p3_prior_research_visits.json ]; then
            ARGS+=(--archive-visit-hint evidence/p3_prior_research_visits.json)
          fi
          python -m collector.p3_full_queue_scout \
            --queue evidence/full_p1_queue.json \
            --out evidence/scout_queue.json \
            --rotation-index "${{ github.run_number }}" "${ARGS[@]}"
          python - <<'PY'
          import json
          r=json.load(open('evidence/scout_queue.json'))
          assert r['trade_gate']=='BLOCKED' and r['orders']==[]
          assert r['official_PIT_verified'] is False
          assert r['p2_hint_is_official_evidence'] is False
          assert r['archive_visit_hint_is_official_proof'] is False
          print('P3 research visit history used:',r['archive_visit_hint_present'],
                'same-epoch archive runs:',r['archived_same_epoch_runs_checked'])
          assert r['rotation_basis']=='P3_WORKFLOW_RUN_NUMBER'
          assert r['rotation_index']==int('${{ github.run_number }}')
          print('P3 P2 SHA-BOUND PRIORITY RESEARCH TARGETS:',
                r['p2_original_sha_priority_targets'])
          PY
      - name: Query free CNINFO official announcement index for selected issuers
        run: python -m collector.p3_real_target_index_probe --queue evidence/scout_queue.json --out evidence/index.json
      - name: Retrieve bounded original PDF bytes, no PIT certification
        run: python -m collector.p3_real_target_pdf_capture --index evidence/index.json --scout evidence/scout_queue.json --out evidence/originals
      - name: Reverify original PDF hashes and extract candidate date-context text
        run: |
          python -m collector.p3_real_p1_pdf_replay --root evidence/originals --out evidence/pdf_replay.json
          python -m collector.p3_real_p1_pdf_text_cues --root evidence/originals --out evidence/pdf_text.json
          python -m collector.p3_real_date_context_triage --source evidence/pdf_text.json --out evidence/triage.json
          python -m collector.p3_full_queue_source_join --queue evidence/full_p1_queue.json --scout evidence/scout_queue.json --index evidence/index.json --originals evidence/originals/quality.json --replay evidence/pdf_replay.json --triage evidence/triage.json --out evidence/full_p1_source_join.json
          python -m collector.p3_original_effective_clause_review --join evidence/full_p1_source_join.json --triage evidence/triage.json --pdf-text evidence/pdf_text.json --originals evidence/originals/quality.json --index evidence/index.json --out evidence/original_effective_clause_review.json
      - name: Assert official historical PIT remains uncertified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/full_p1_source_join.json').read_text())
          original=json.loads(Path('evidence/originals/quality.json').read_text())
          assert report['index_lookups'] in (1,2,3)
          assert original['retrieved']<=original['attempted']<=3
          assert report['official_pdf_originals_sha_replayed']==original['retrieved']
          assert report['official_PIT_cells_certified']==0
          assert report['first_publication_times_independently_authenticated']==0
          assert report['historical_PIT_verified'] is False
          assert report['trade_gate']=='BLOCKED' and report['orders']==[]
          semantic=json.loads(Path('evidence/original_effective_clause_review.json').read_text())
          assert semantic['evaluated_research_links']==report['research_issuer_day_date_cue_links']
          assert semantic['explicit_original_clause_candidates']<=semantic['evaluated_research_links']
          assert semantic['certified_effective_dates']==0
          assert semantic['authenticated_first_publication_times']==0
          assert semantic['historical_PIT_verified'] is False
          assert semantic['trade_gate']=='BLOCKED' and semantic['orders']==[]
          print('P3 REAL ORIGINAL LOCAL CLAUSES:',semantic['explicit_original_clause_candidates'],'out of',semantic['evaluated_research_links'],'research leads; 0 certified effective states')
          print('P3 ORIGINAL SOURCE RESEARCH ACCEPTED',report['index_lookups'],'issuers',original['retrieved'],'retrieved original PDFs, ZERO certified PIT')
          PY
      - name: Append SHA-verified official PDF originals and research lineage to free Git archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          SOURCE_RUN=$(python -c "import json;print(json.load(open('evidence/upstream.json'))['upstream_run_id'])")
          python -m collector.p3_official_original_archive --mode archive \
            --source-root evidence/originals \
            --review evidence/original_effective_clause_review.json \
            --queue evidence/full_p1_queue.json \
            --index evidence/index.json \
            --run-id "${{ github.run_id }}" --upstream-run-id "$SOURCE_RUN"
      - name: Independently replay original PDF bytes from durable Git archive
        run: |
          git fetch --depth=1 origin research-official-originals-archive
          git worktree add --detach archived-official-research FETCH_HEAD
          python -m collector.p3_official_original_archive --mode verify \
            --root archived-official-research --source-root evidence/originals \
            --run-id "${{ github.run_id }}" | tee evidence/p3_durable_original_replay.json
          python - <<'PY'
          import json
          audit=json.load(open('evidence/p3_durable_original_replay.json'))
          original=json.load(open('evidence/originals/quality.json'))
          review=json.load(open('evidence/original_effective_clause_review.json'))
          assert audit['retrieved_and_persisted_originals']==original['retrieved']
          assert audit['archived_semantic_research_links']==review['evaluated_research_links']
          assert audit['historical_PIT_verified'] is False
          assert audit['trade_gate']=='BLOCKED' and audit['orders']==[]
          print('P3 DURABLE ORIGINAL ARCHIVE PASS:',audit['retrieved_and_persisted_originals'],
                'PDFs persisted & replayed with',audit['archived_semantic_research_links'],'research leads; 0 PIT certifications')
          PY
      - name: Independently flag archived approval-vs-effective and event-vs-decision date risks
        run: |
          python -m collector.p3_persisted_temporal_risk_triage \
            --manifest "archived-official-research/runs/${{ github.run_id }}.json" \
            --out evidence/p3_persisted_temporal_risk_triage.json
          python -m collector.p3_index_chronology_guard \
            --manifest "archived-official-research/runs/${{ github.run_id }}.json" \
            --out evidence/p3_index_chronology_guard.json
          python - <<'PY'
          import json
          from pathlib import Path
          triage=json.loads(Path('evidence/p3_persisted_temporal_risk_triage.json').read_text())
          review=json.loads(Path('evidence/original_effective_clause_review.json').read_text())
          assert triage['explicit_textual_candidate_count']==review['explicit_original_clause_candidates']
          assert triage['historical_PIT_verified'] is False
          assert triage['certified_event_effective_dates']==0
          assert triage['trade_gate']=='BLOCKED' and triage['orders']==[]
          chronology=json.loads(Path('evidence/p3_index_chronology_guard.json').read_text())
          assert chronology['status']=='INDEX_CHRONOLOGY_CROSSCHECK_RESEARCH_ONLY'
          assert chronology['research_links_rechecked']==review['evaluated_research_links']
          assert chronology['certified_first_publication_times']==0
          assert chronology['certified_issuer_state_intervals']==0
          assert chronology['historical_PIT_verified'] is False
          assert chronology['trade_gate']=='BLOCKED' and chronology['orders']==[]
          print('P3 INDEX CHRONOLOGY:',chronology['research_links_rechecked'],
                'SHA-linked receipts;',chronology['index_after_decision_close_unverified'],
                'mutable index timestamps after decision close, PIT ZERO')
          print('P3 TEMPORAL SANITY: unverified text candidates',triage['explicit_textual_candidate_count'],
                'date mismatches',triage['candidate_with_text_date_not_decision_day'],
                'approval/consent caveats',triage['candidate_with_approval_not_effective_date'])
          PY
      - name: Replay all archived original PDFs and research halt-resume event episodes
        run: |
          python -m collector.p3_archived_event_episode_ledger \
            --root archived-official-research \
            --out evidence/p3_all_archived_original_event_episodes.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/p3_all_archived_original_event_episodes.json').read_text())
          assert report['runs_replayed']>=1
          assert report['raw_text_assertion_references']>=report['deduplicated_text_event_claims']
          assert report['claims_with_sha_pinned_first_research_capture']==report['deduplicated_text_event_claims']
          assert report['official_first_publication_authenticated_from_capture']==0
          assert 0<=report['claims_first_archive_capture_after_event_text_day']<=report['deduplicated_text_event_claims']
          assert report['official_PIT_cells_certified']==0
          assert report['historical_first_publication_authenticated'] is False
          assert report['complete_issuer_halt_intervals_certified'] is False
          assert report['historical_PIT_verified'] is False
          assert report['trade_gate']=='BLOCKED' and report['orders']==[]
          print('P3 ARCHIVED EVENT EPISODES: runs',report['runs_replayed'],
                'unique text events',report['deduplicated_text_event_claims'],
                'unpaired halt evidence',report['unpaired_halt_starts_needing_resumption_search'],
                'paired text events UNCERTIFIED',report['paired_halt_resume_text_claims_unverified'],
                'certified states ZERO')
          PY
      - name: Build independently SHA-linked official event missing-proof work queue
        run: |
          python -m collector.p3_event_proof_gap_queue \
            --episodes evidence/p3_all_archived_original_event_episodes.json \
            --out evidence/p3_original_event_missing_proof_queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('evidence/p3_all_archived_original_event_episodes.json').read_text())
          q=json.loads(Path('evidence/p3_original_event_missing_proof_queue.json').read_text())
          expected=(source['paired_halt_resume_text_claims_unverified']
                    +source['unpaired_halt_starts_needing_resumption_search']
                    +source['unpaired_resume_claims']
                    +source['overlapping_halt_claims_without_resume'])
          assert q['work_item_count']==expected
          assert q['upstream_unique_text_events']==source['deduplicated_text_event_claims']
          assert q['source_claims_with_sha_verified_archive_capture']==source['claims_with_sha_pinned_first_research_capture']
          assert q['source_claims_first_archive_capture_after_text_event_day']==source['claims_first_archive_capture_after_event_text_day']
          assert q['official_first_publication_authenticated_from_capture']==0
          assert q['status']=='UNVERIFIED_PIT_WORK_QUEUE_ONLY'
          assert q['certified_first_publication_count']==0
          assert q['completed_pit_cells']==0 and not q['historical_PIT_verified']
          assert q['trade_gate']=='BLOCKED' and q['orders']==[] and q['recommendations']==[]
          print('P3 MISSING PROOF QUEUE:',q['work_item_count'],
                'SHA-backed research work items; PIT ZERO')
          PY
      - name: Independently triage all P3 missing-proof work items (NO CERTIFICATION)
        run: |
          python -m collector.p3_proof_gap_triage \
            --queue evidence/p3_original_event_missing_proof_queue.json \
            --out evidence/p3_official_proof_gap_triage.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          queue=json.loads(Path('evidence/p3_original_event_missing_proof_queue.json').read_text())
          triage=json.loads(Path('evidence/p3_official_proof_gap_triage.json').read_text())
          assert triage['phase']=='P3_UNCERTIFIED_PROOF_GAP_TRIAGE'
          assert triage['status']=='TRIAGED_NOT_CERTIFIED'
          assert triage['total_unresolved_work_items']==queue['work_item_count']
          assert sum(triage['review_bucket_counts'].values())==queue['work_item_count']
          assert len(triage['work_items'])==queue['work_item_count']
          assert Counter(x['source_kind'] for x in triage['work_items'])==queue['work_type_counts']
          assert all(x['official_evidence_status']=='NOT_AUTHENTICATED'
                     and x['eligible_for_historical_trade_replay'] is False
                     for x in triage['work_items'])
          assert triage['historical_PIT_verified'] is False
          assert triage['official_first_publication_authenticated']==0
          assert triage['official_state_intervals_certified']==0
          assert triage['trade_gate']=='BLOCKED'
          assert triage['orders']==[] and triage['executable_candidates']==[]
          assert triage['recommendations']==[]
          print('P3 INDEPENDENT GAP TRIAGE VERIFIED:',
                triage['total_unresolved_work_items'],'unresolved; classes',
                json.dumps(triage['review_bucket_counts'],sort_keys=True))
          PY
      - name: Generate highest-priority SHA-linked halt conflict packets without historical PIT claims
        run: |
          python -m collector.p3_conflict_review_packet \
            --triage evidence/p3_official_proof_gap_triage.json \
            --out evidence/p3_priority_zero_halt_conflict_review.json
          python - <<'PY'
          import json
          from pathlib import Path
          triage=json.loads(Path('evidence/p3_official_proof_gap_triage.json').read_text())
          packet=json.loads(Path('evidence/p3_priority_zero_halt_conflict_review.json').read_text())
          assert packet['priority_zero_conflicts']==triage['review_bucket_counts'].get('CONFLICT_REQUIRES_ORIGINAL_REVIEW',0)
          assert packet['source_queue_unresolved_items']==triage['total_unresolved_work_items']
          assert packet['historical_first_publication_authenticated']==0
          assert packet['official_halt_resume_intervals_certified']==0
          assert packet['historical_PIT_verified'] is False
          assert packet['trade_gate']=='BLOCKED' and packet['orders']==[]
          print('P3 priority-zero official review packets:',packet['priority_zero_conflicts'],'unverified')
          PY
      - name: Produce source-pinned manual official evidence request packets
        run: |
          python -m collector.p3_official_review_packets \
            --triage evidence/p3_official_proof_gap_triage.json \
            --out evidence/p3_official_manual_review_packets.json \
            --csv evidence/p3_official_manual_review_packets.csv
          python - <<'PY'
          import json
          from pathlib import Path
          triage=json.loads(Path('evidence/p3_official_proof_gap_triage.json').read_text())
          packet=json.loads(Path('evidence/p3_official_manual_review_packets.json').read_text())
          assert packet['total_review_tasks']==triage['total_unresolved_work_items']
          assert packet['review_bucket_counts']==triage['review_bucket_counts']
          assert len(packet['tasks'])==packet['total_review_tasks']
          assert len({x['task_id'] for x in packet['tasks']})==len(packet['tasks'])
          assert packet['historical_PIT_verified'] is False
          assert packet['certified_historical_state_intervals']==0
          assert packet['authenticated_first_publication_count']==0
          assert packet['trade_gate']=='BLOCKED'
          assert packet['orders']==[] and packet['recommendations']==[]
          assert Path('evidence/p3_official_manual_review_packets.csv').is_file()
          print('P3 OFFICIAL MANUAL EVIDENCE REQUEST PACKET:',
                packet['total_review_tasks'], 'still uncertified; no trades')
          PY
      - name: Verify existing resume PDFs and exclude already-paired text leads from search
        run: |
          git fetch --depth=1 origin research-official-originals-archive
          git worktree add --detach archived-official-resume-prior FETCH_HEAD
          python -m collector.p3_halt_resume_pair_review \
            --episodes evidence/p3_all_archived_original_event_episodes.json \
            --archive archived-official-resume-prior \
            --out evidence/p3_prior_original_resume_pairs.json
          python - <<'PY'
          import json
          p=json.load(open('evidence/p3_prior_original_resume_pairs.json'))
          assert p['trade_gate']=='BLOCKED' and p['historical_PIT_verified'] is False
          assert p['official_halt_resume_intervals_certified']==0
          assert p['authenticated_first_publication_count']==0
          print('P3 SHA-replayed original resume pairs:',p['deduplicated_research_text_pairs'],
                'still unmatched:',p['unpaired_halt_sources_remaining_in_bounded_research'],
                '; no PIT certification')
          PY
      - name: Search genuine archived unpaired halt issuers for subsequent resumption originals
        run: |
          python -m collector.p3_resume_followup_discovery \
            --episodes evidence/p3_all_archived_original_event_episodes.json \
            --run-number "${{ github.run_number }}" \
            --paired evidence/p3_prior_original_resume_pairs.json \
            --out evidence/resume_index.json
          python -m collector.p3_real_target_pdf_capture \
            --index evidence/resume_index.json --out evidence/resume_originals
          python -m collector.p3_real_p1_pdf_replay \
            --root evidence/resume_originals --out evidence/resume_pdf_sha_replay.json
          python -m collector.p3_real_p1_pdf_text_cues \
            --root evidence/resume_originals --out evidence/resume_original_pdf_text.json
      - name: Persist separate resumption original PDFs and verify append-only SHA receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python -m collector.p3_resume_original_archive \
            --mode archive --index evidence/resume_index.json \
            --originals evidence/resume_originals \
            --text evidence/resume_original_pdf_text.json \
            --run-id "${{ github.run_id }}" --repo "${{ github.repository }}"
          git fetch --depth=1 origin research-official-originals-archive
          git worktree add --detach archived-official-resume FETCH_HEAD
          python -m collector.p3_resume_original_archive \
            --mode verify --root archived-official-resume \
            --run-id "${{ github.run_id }}" | tee evidence/resume_original_archive_replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          resume=json.loads(Path('evidence/resume_original_archive_replay.json').read_text())
          captured=json.loads(Path('evidence/resume_originals/quality.json').read_text())
          assert resume['official_originals_sha_verified']==captured['retrieved']
          assert resume['source_issuers'] in (1,2,3)
          assert resume['official_resume_effective_dates_certified']==0
          assert resume['historical_PIT_verified'] is False
          assert resume['trade_gate']=='BLOCKED' and resume['orders']==[]
          print('P3 RESUME FOLLOWUP VERIFIED:',resume['source_issuers'],
                'halt sources',resume['official_originals_sha_verified'],
                'original PDF SHA replayed',resume['same_clause_resumption_text_candidates'],
                'unverified resume text leads; PIT zero')
          PY
      - name: Pair independently SHA-verified historical halt and resumption PDF text across runs
        run: |
          python -m collector.p3_halt_resume_pair_review \
            --episodes evidence/p3_all_archived_original_event_episodes.json \
            --archive archived-official-resume \
            --out evidence/p3_all_resume_original_text_pairs.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('evidence/p3_all_resume_original_text_pairs.json').read_text())
          assert result['archived_resume_runs_replayed']>=1
          assert result['official_halt_resume_intervals_certified']==0
          assert result['authenticated_first_publication_count']==0
          assert result['historical_PIT_verified'] is False
          assert result['trade_gate']=='BLOCKED' and result['orders']==[]
          print('P3 ORIGINAL RESEARCH PAIRS:',result['deduplicated_research_text_pairs'],
                'text-only SHA pairs',result['unpaired_halt_sources_remaining_in_bounded_research'],
                'unpaired archive starts; certified exchange states ZERO')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-full-p1-official-scout-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
