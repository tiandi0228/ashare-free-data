name: P2 real archived research features observation (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2-real-archive-feature-observation.yml'
      - 'collector/p2_real_archive_features.py'
      - 'collector/p2_paged_real_archive.py'
      - 'collector/p2_independent_bars.py'
      - 'tests/test_p2_paged_real_archive.py'
  pull_request:
    paths:
      - '.github/workflows/p2-real-archive-feature-observation.yml'
      - 'collector/p2_real_archive_features.py'
      - 'collector/p2_independent_bars.py'
  workflow_run:
    workflows: ["P1 fresh Baostock mainboard roster observation (NO TRADES)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      page:
        description: 'Optional zero-based archived research page (blank rotates automatically)'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: p2-real-archived-feature-observation
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original CSV research feature adapter
        run: python -m unittest tests.test_p2_independent_bars tests.test_p2_real_archive_features tests.test_p2_paged_real_archive -v
      - name: Fetch immutable-original research archive branch
        run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
      - name: Replay bounded rotating archived shards at frozen P1 date
        env:
          P2_EXPLICIT_PAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.page || '' }}
        run: |
          ARGS=()
          if [ -n "$P2_EXPLICIT_PAGE" ]; then
            ARGS+=(--page "$P2_EXPLICIT_PAGE")
          fi
          python -m collector.p2_paged_real_archive \
            --archive-root archived-research \
            --checkpoints evidence/checkpoints \
            --run-number "${{ github.run_number }}" \
            "${ARGS[@]}" \
            --out evidence/p2_real_archive_feature_observation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-real-archive-feature-observation-${{ github.run_id }}
          path: evidence/p2_real_archive_feature_observation.json
          retention-days: 14
          if-no-files-found: warn
