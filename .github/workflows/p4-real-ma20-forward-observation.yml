name: P4 real vendor MA20 forward observation (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p4_real_ma20_forward_observation.py'
      - 'collector/p4_independent_event_evidence.py'
      - 'collector/p4_real_holdout_forward_prices.py'
      - 'collector/p4_holdout_direction_bias_audit.py'
      - 'collector/p4_next_open_forward_proxy.py'
      - 'collector/p2_real_proxy_purged_chronology.py'
      - 'collector/p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_real_proxy_purged_chronology.py'
      - 'collector/p4_observed_fee_friction.py'
      - 'collector/p4_tplus1_barrier_touch.py'
      - 'collector/p4_fee_floor_gap_audit.py'
      - 'collector/p4_three_to_five_vendor_horizon.py'
      - 'collector/p4_friday_asof_preentry_guard.py'
      - 'collector/p4_synthetic_t1_execution_kernel.py'
      - 'tests/test_p4_synthetic_t1_execution_kernel.py'
      - 'tests/test_p4_friday_asof_preentry_guard.py'
      - 'tests/test_p4_three_to_five_vendor_horizon.py'
      - 'tests/test_p4_fee_floor_gap_audit.py'
      - 'tests/test_p4_tplus1_barrier_touch.py'
      - 'tests/test_p4_observed_fee_friction.py'
      - 'tests/test_p4_next_open_forward_proxy.py'
      - 'tests/test_p4_holdout_direction_bias_audit.py'
      - 'tests/test_p4_real_holdout_forward_prices.py'
      - 'tests/test_p4_independent_event_evidence.py'
      - 'tests/test_p4_real_ma20_forward_observation.py'
      - '.github/workflows/p4-real-ma20-forward-observation.yml'
  pull_request:
    paths:
      - '.github/workflows/p4-real-ma20-forward-observation.yml'
      - 'collector/p4_real_holdout_forward_prices.py'
      - 'collector/p4_holdout_direction_bias_audit.py'
      - 'collector/p4_next_open_forward_proxy.py'
      - 'collector/p2_real_proxy_purged_chronology.py'
      - 'collector/p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_prospective_parameter_preregistration.py'
      - 'tests/test_p2_real_proxy_purged_chronology.py'
      - 'collector/p4_observed_fee_friction.py'
      - 'collector/p4_tplus1_barrier_touch.py'
      - 'collector/p4_fee_floor_gap_audit.py'
      - 'collector/p4_three_to_five_vendor_horizon.py'
      - 'collector/p4_friday_asof_preentry_guard.py'
      - 'collector/p4_synthetic_t1_execution_kernel.py'
      - 'tests/test_p4_synthetic_t1_execution_kernel.py'
      - 'tests/test_p4_friday_asof_preentry_guard.py'
      - 'tests/test_p4_three_to_five_vendor_horizon.py'
      - 'tests/test_p4_fee_floor_gap_audit.py'
      - 'tests/test_p4_tplus1_barrier_touch.py'
      - 'tests/test_p4_observed_fee_friction.py'
      - 'tests/test_p4_next_open_forward_proxy.py'
      - 'tests/test_p4_holdout_direction_bias_audit.py'
      - 'tests/test_p4_real_holdout_forward_prices.py'
  workflow_run:
    workflows: ["P1 fresh Baostock mainboard roster observation (NO TRADES)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p4_real_ma20_forward_observation tests.test_p4_independent_event_evidence tests.test_p4_real_holdout_forward_prices tests.test_p4_holdout_direction_bias_audit tests.test_p4_next_open_forward_proxy tests.test_p2_real_proxy_purged_chronology tests.test_p2_prospective_parameter_preregistration tests.test_p4_observed_fee_friction tests.test_p4_tplus1_barrier_touch tests.test_p4_fee_floor_gap_audit tests.test_p4_three_to_five_vendor_horizon tests.test_p4_friday_asof_preentry_guard tests.test_p4_synthetic_t1_execution_kernel -v
      - run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
          ARCHIVE_COMMIT=$(git -C archived-research rev-parse HEAD)
          python -m collector.p4_real_ma20_forward_observation --root archived-research --cutoff 2025-12-31 --archive-commit "$ARCHIVE_COMMIT" --out evidence/p4_ma20_forward_observation.json
          python -m collector.p4_independent_event_evidence --root archived-research --manifest evidence/p4_ma20_forward_observation.json
          python -m collector.p4_real_holdout_forward_prices --root archived-research --manifest evidence/p4_ma20_forward_observation.json --out evidence/p4_real_holdout_forward_prices.json
          python -m collector.p4_next_open_forward_proxy --root archived-research --manifest evidence/p4_ma20_forward_observation.json --out evidence/p4_next_open_forward_proxy.json
          python -m collector.p2_real_proxy_purged_chronology \
            --proxy evidence/p4_next_open_forward_proxy.json \
            --train-end 2026-06-30 --validation-start 2026-07-08 --validation-end 2026-10-22 \
            --page-index 0 --out evidence/p2_real_proxy_purged_chronology_page0.json
          python -m collector.p2_real_proxy_purged_chronology \
            --proxy evidence/p4_next_open_forward_proxy.json \
            --train-end 2026-06-30 --validation-start 2026-07-08 --validation-end 2026-10-22 \
            --all-pages --out evidence/p2_real_proxy_purged_chronology_full.json
          # Current run cannot retroactively attest a July 2026 holdout.
          # This is intentionally a retrospective-blocked audit receipt.
          python -m collector.p2_prospective_parameter_preregistration \
            --source-commit "${{ github.sha }}" \
            --fold-report evidence/p2_real_proxy_purged_chronology_full.json \
            --validation-start 2026-07-08 --validation-end 2026-10-22 \
            --evidence-created-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out evidence/p2_parameter_preregistration_retrospective_veto.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("evidence/p2_parameter_preregistration_retrospective_veto.json").read_text())
          assert x["status"]=="RETROSPECTIVE_WINDOW_CANNOT_BE_FROZEN_AFTER_START"
          assert x["historical_OOS_validated"] is False
          assert x["parameters_frozen_before_historical_holdout_verified"] is False
          assert x["trade_gate"]=="BLOCKED" and x["orders"]==[]
          print("P2 HISTORICAL HOLDOUT CANNOT BE RETROACTIVELY FROZEN")
          PY
          python -m collector.p4_observed_fee_friction --input evidence/p4_next_open_forward_proxy.json --out evidence/p4_observed_fee_friction.json
          python -m collector.p4_tplus1_barrier_touch \
            --root archived-research \
            --manifest evidence/p4_ma20_forward_observation.json \
            --proxy evidence/p4_next_open_forward_proxy.json \
            --out evidence/p4_tplus1_barrier_touch.json
          python -m collector.p4_fee_floor_gap_audit \
            --proxy evidence/p4_next_open_forward_proxy.json \
            --barriers evidence/p4_tplus1_barrier_touch.json \
            --out evidence/p4_fee_floor_gap_audit.json
          python -m collector.p4_three_to_five_vendor_horizon \
            --root archived-research \
            --manifest evidence/p4_ma20_forward_observation.json \
            --proxy evidence/p4_next_open_forward_proxy.json \
            --out evidence/p4_three_to_five_vendor_horizon.json
          python -m collector.p4_friday_asof_preentry_guard \
            --proxy evidence/p4_next_open_forward_proxy.json \
            --out evidence/p4_friday_asof_preentry_guard.json
          python - <<'PY'
          from collector.p4_synthetic_t1_execution_kernel import contract_summary,replay,PROVENANCE
          from pathlib import Path
          import json
          proof=contract_summary()
          assert proof['provenance']=='SYNTHETIC_OFFLINE_FIXTURE_ONLY'
          assert proof['execution_inputs']=='SYNTHETIC_ONLY_NOT_FROM_VENDOR_OHLC'
          assert proof['verified_broker_fills']==0
          assert not proof['historical_exchange_calendar_authenticated']
          assert not proof['historical_PIT_verified'] and not proof['historical_OOS_validated']
          assert not proof['frozen_strategy_ready'] and not proof['trade_authorized']
          assert not proof['real_friday_liquidation_certified']
          assert proof['friday_session_close_proof_required_in_future_executable_gate']
          assert proof['trade_gate']=='BLOCKED' and proof['orders']==[]
          Path('evidence/p4_synthetic_execution_contract.json').write_text(
              json.dumps(proof,indent=2)+'\n')
          # Completely synthetic fixture: 100 shares bought Monday;
          # Friday forced exit only gets 40 fake shares filled.
          # The last 60 MUST persist as Friday weekend risk, not be
          # silently marked as fully liquidated or a real broker fill.
          day1='2026-11-02'
          fri='2026-11-06'
          fixture={'provenance':PROVENANCE,'trade_gate':'BLOCKED',
            'orders':[],'issuer':'sh.600000',
            'historical_PIT_verified':False,
            'real_liquidity_authenticated':False,'events':[
              {'session':day1,'kind':'BEGIN_SESSION'},
              {'session':day1,'kind':'PLACE_BUY','quantity':100,'limit_price':'10.00'},
              {'session':day1,'kind':'FILL_BUY','quantity':100,'fill_price':'10.00',
               'origin':'SYNTHETIC_MATCHING_FIXTURE'},
              {'session':fri,'kind':'BEGIN_SESSION'},
              {'session':fri,'kind':'PLACE_SELL','quantity':100,'limit_price':'9.80',
               'reason':'FRIDAY_FORCE'},
              {'session':fri,'kind':'FILL_SELL','quantity':40,'fill_price':'9.80',
               'origin':'SYNTHETIC_MATCHING_FIXTURE'},
              {'session':fri,'kind':'END_SESSION'},
            ]}
          report=replay(fixture)
          assert report['status']=='SYNTHETIC_ONLY_TPLUS1_AND_PARTIAL_ORDER_STATE_TESTED'
          assert report['synthetic_position_shares']==60
          assert report['synthetic_friday_close_report_count']==1
          assert report['synthetic_friday_close_reports'][0]['unliquidated_shares']==60
          assert report['synthetic_friday_close_reports'][0]['synthetic_close_status']=='SYNTHETIC_FRIDAY_UNFILLED_SELL_REMAINDER'
          assert not report['synthetic_all_friday_sessions_proven_flat_in_fixture']
          assert report['real_friday_exit_authentication_count']==0
          assert not report['real_friday_liquidation_certified']
          assert report['trade_gate']=='BLOCKED' and report['orders']==[]
          Path('evidence/p4_synthetic_friday_close_fixture.json').write_text(
              json.dumps(report,indent=2)+'\n')
          print('P4 SYNTHETIC FRIDAY CLOSE:',report['synthetic_friday_close_reports'][0]['synthetic_close_status'],
                '60 FAKE SHARES UNLIQUIDATED; NO REAL FILLS')
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          previous=json.loads(Path('evidence/p4_real_holdout_forward_prices.json').read_text())
          proxy=json.loads(Path('evidence/p4_next_open_forward_proxy.json').read_text())
          assert proxy['status']=='OBSERVED_NEXT_OPEN_PROXY_NOT_BACKTEST'
          assert proxy['archive_commit_sha']==previous['archive_commit_sha']
          assert proxy['verified_nonoverlap_events']==previous['verified_ma20_crossing_events']
          assert proxy['observed_next_open_to_third_close']==previous['observed_with_three_vendor_tradable_rows']
          assert proxy['censored_events']==previous['censored_insufficient_following_rows']
          assert proxy['future_vendor_status_blocked']==previous['unscorable_future_vendor_status']
          assert proxy['fills_assumed']==0 and proxy['trades_assumed']==0
          assert not proxy['historical_OOS_validated'] and not proxy['strategy_backtest_certified']
          assert proxy['trade_gate']=='BLOCKED' and proxy['orders']==[]
          friction=json.loads(Path('evidence/p4_observed_fee_friction.json').read_text())
          assert friction['status']=='OBSERVED_VENDOR_PRICE_FRICTION_SCENARIOS_NOT_BACKTEST'
          assert friction['archive_commit_sha']==proxy['archive_commit_sha']
          assert friction['observed_price_pairs']==proxy['observed_next_open_to_third_close']
          assert friction['verified_nonoverlap_events']==proxy['verified_nonoverlap_events']
          assert [x['assumed_slippage_bps_each_side'] for x in friction['scenarios']]==[0,10]
          assert not friction['strategy_backtest_certified'] and not friction['trade_authorized']
          assert not friction['risk_gate_verified'] and not friction['portfolio_pnl_computed']
          assert friction['trade_gate']=='BLOCKED' and friction['orders']==[]
          assert friction['actionable_buy_signals']==[]
          barriers=json.loads(Path('evidence/p4_tplus1_barrier_touch.json').read_text())
          assert barriers['status']=='TPLUS1_BARRIER_TOUCHES_NOT_EXECUTABLE_BACKTEST'
          assert barriers['archive_commit_sha']==proxy['archive_commit_sha']
          assert barriers['source_verified_mature_price_pairs']==proxy['observed_next_open_to_third_close']
          assert barriers['fills_assumed']==0 and barriers['trades_assumed']==0
          assert not barriers['historical_PIT_verified'] and not barriers['historical_OOS_validated']
          assert not barriers['strategy_backtest_certified'] and not barriers['trade_authorized']
          assert barriers['trade_gate']=='BLOCKED' and barriers['orders']==[]
          assert barriers['actionable_buy_signals']==[] and barriers['executable_candidates']==[]
          fee_gap=json.loads(Path('evidence/p4_fee_floor_gap_audit.json').read_text())
          assert fee_gap['status']=='MODELLED_FEE_BARRIER_GAP_EXPLAINED_NO_BACKTEST'
          assert fee_gap['archive_commit_sha']==barriers['archive_commit_sha']
          assert fee_gap['source_verified_price_pairs']==barriers['source_verified_mature_price_pairs']
          assert fee_gap['source_frozen_5pct_reward_risk_passes']==barriers['theoretical_friction_plan_checks']['modelled_reward_at_least_2x_stop_risk']
          assert not fee_gap['historical_PIT_verified'] and not fee_gap['historical_OOS_validated']
          assert not fee_gap['trade_authorized'] and fee_gap['broker_trades_verified']==0
          assert fee_gap['trade_gate']=='BLOCKED' and fee_gap['orders']==[] and fee_gap['actionable_buy_signals']==[]
          horizon=json.loads(Path('evidence/p4_three_to_five_vendor_horizon.json').read_text())
          assert horizon['status']=='THREE_TO_FIVE_VENDOR_COVERAGE_ONLY_NO_BACKTEST'
          assert horizon['archive_commit_sha']==barriers['archive_commit_sha']
          assert horizon['hypothetical_entry_price_pairs']==barriers['source_verified_mature_price_pairs']
          assert horizon['verified_original_ma20_crossing_events']==proxy['verified_nonoverlap_events']
          for h in ('3','4','5'):
              outcome=horizon['horizon_sessions_after_hypothetical_entry'][h]
              assert sum(outcome.values())==horizon['hypothetical_entry_price_pairs']
          assert sum(horizon['friday_mandatory_exit_conflicts'].values())==horizon['hypothetical_entry_price_pairs']
          gate=horizon['friday_and_minimum_holding_compatibility_research']
          friday=horizon['friday_mandatory_exit_conflicts']
          assert sum(gate.values())==horizon['hypothetical_entry_price_pairs']
          assert gate.get('NO_GO_ENTRY_FRIDAY_TPLUS1',0)==friday.get('ENTRY_FRIDAY_TPLUS1_CANNOT_CLEAR_SAME_FRIDAY',0)
          assert gate.get('NO_GO_MINIMUM_HOLD_VS_FRIDAY',0)==friday.get('FRIDAY_BEFORE_MINIMUM_THREE_VENDOR_SESSIONS',0)
          assert gate.get('OBSERVED_FRIDAY_WINDOW_ONLY_NOT_TRADABLE',0)+gate.get('UNKNOWN_VENDOR_STATUS_BEFORE_FRIDAY',0)==friday.get('FRIDAY_AT_THREE_TO_FIVE_VENDOR_SESSIONS',0)
          assert gate.get('UNKNOWN_FIRST_FRIDAY_NOT_IN_ARCHIVE_WINDOW',0)==friday.get('FIRST_FRIDAY_NOT_OBSERVED_IN_BOUNDED_WINDOW',0)
          assert not horizon['pre_entry_friday_policy_trade_permission_certified']
          assert not horizon['lookahead_data_used_for_entry_screening']
          assert not horizon['prospective_friday_calendar_rule_frozen']
          print('P4 FRIDAY AND MINIMUM HOLD RESEARCH:',gate,'NO TRADES')
          assert horizon['broker_fills_confirmed']==0 and not horizon['historical_PIT_verified']
          assert not horizon['trading_calendar_certified'] and not horizon['historical_OOS_validated']
          assert not horizon['trade_authorized'] and not horizon['strategy_backtest_certified']
          assert sum(horizon['entry_daily_ohlc_queue_ambiguity'].values())==horizon['hypothetical_entry_price_pairs']
          assert sum(horizon['friday_exit_daily_ohlc_queue_ambiguity'].values())==horizon['hypothetical_entry_price_pairs']
          assert not horizon['historical_issuer_st_price_limit_band_verified']
          assert not horizon['continuous_order_book_queue_replayed']
          assert horizon['confirmed_entry_fill_count']==0
          assert horizon['confirmed_friday_exit_fill_count']==0
          assert horizon['entry_daily_ohlc_not_an_executable_buy_quote']
          print('P4 VENDOR DAILY QUEUE LIMITATIONS:',
                horizon['entry_daily_ohlc_queue_ambiguity'],
                horizon['friday_exit_daily_ohlc_queue_ambiguity'],
                'NO FILLS')
          assert horizon['trade_gate']=='BLOCKED' and horizon['orders']==[]
          asof=json.loads(Path('evidence/p4_friday_asof_preentry_guard.json').read_text())
          assert asof['status']=='ASOF_WEEKDAY_ONLY_NO_AUTHENTICATED_CALENDAR_NO_TRADES'
          assert asof['archive_commit_sha']==proxy['archive_commit_sha']
          assert asof['verified_mature_proxy_signals']==proxy['observed_next_open_to_third_close']
          assert sum(asof['conditional_next_weekday_screen'].values())==asof['verified_mature_proxy_signals']
          assert sum(asof['signal_weekday_histogram'].values())==asof['verified_mature_proxy_signals']
          assert asof['calendar_certificate_missing_for_all']==asof['verified_mature_proxy_signals']
          assert asof['approved_entries']==0 and not asof['trade_authorized']
          assert not asof['historical_PIT_verified'] and not asof['historical_OOS_validated']
          assert not asof['future_vendor_bars_used_in_entry_precheck']
          assert not asof['historical_calendar_asof_authenticated']
          assert not asof['preentry_executable_signal_generated']
          assert asof['trade_gate']=='BLOCKED' and asof['orders']==[] and asof['actionable_buy_signals']==[]
          print('P4 SIGNAL ASOF FRIDAY PRECHECK:',asof['conditional_next_weekday_screen'],'NO TRADES')
          PY
          python -m collector.p4_holdout_direction_bias_audit --input evidence/p4_real_holdout_forward_prices.json --out evidence/p4_holdout_direction_bias_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/p4_real_holdout_forward_prices.json').read_text())
          d=json.loads(Path('evidence/p4_holdout_direction_bias_audit.json').read_text())
          assert d['status']=='DIRECTIONAL_OBSERVATION_BIAS_AUDITED_NOT_STRATEGY'
          assert d['event_total']==r['verified_ma20_crossing_events']
          assert d['observed_events']==r['observed_with_three_vendor_tradable_rows']
          assert d['observed_positive']==r['observed_positive_close_changes']
          assert d['observed_negative']==r['observed_negative_close_changes']
          assert d['observed_zero']==r['observed_zero_close_changes']
          assert d['source_archive_commit_sha']==r['archive_commit_sha']
          assert not d['win_rate_claimed'] and not d['trade_returns_calculated']
          assert d['trade_gate']=='BLOCKED' and d['orders']==[]
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('evidence/p4_ma20_forward_observation.json').read_text())
          result=json.loads(Path('evidence/p4_real_holdout_forward_prices.json').read_text())
          assert result['status']=='HOLDOUT_PRICE_OBSERVATIONS_NOT_BACKTEST'
          assert result['verified_ma20_crossing_events']==manifest['nonoverlapping_three_observation_crossing_events']
          assert result['observed_with_three_vendor_tradable_rows']==manifest['nonoverlapping_crossings_with_three_following_vendor_tradable_rows']
          assert result['fills_assumed']==0 and not result['returns_computed_as_trades']
          assert not result['historical_OOS_validated'] and not result['historical_PIT_verified']
          assert result['trade_gate']=='BLOCKED' and result['orders']==[] and result['executable_candidates']==[]
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          source=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          kind=os.environ["GITHUB_EVENT_NAME"]
          upstream=source.get("workflow_run",{}) if kind=="workflow_run" else {}
          if kind=="workflow_run":
              from collector.p3_upstream_p1_guard import p1_upstream_run_id
              assert p1_upstream_run_id(upstream,os.environ['GITHUB_REPOSITORY'])==upstream['id']
          proof={"p4_trigger":kind,
                 "upstream_p1_run_id":upstream.get("id"),
                 "upstream_p1_conclusion":upstream.get("conclusion"),
                 "archive_commit_sha":json.loads(Path("evidence/p4_ma20_forward_observation.json").read_text())["archive_commit_sha"],
                 "trade_gate":"BLOCKED","orders":[]}
          Path("evidence/p4_trigger_provenance.json").write_text(json.dumps(proof,indent=2)+"\n")
          print("P4_TRIGGER_PROVENANCE",json.dumps(proof))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/p4_ma20_forward_observation.json').read_text())
          assert r['archive_commit_sha']==__import__('subprocess').check_output(['git','-C','archived-research','rev-parse','HEAD'],text=True).strip()
          assert r['independently_p2_checked_issuers']>0
          assert r['three_following_vendor_tradable_rows']<=r['post_cutoff_ma20_observations']
          assert r['entry_fills_assumed']==0 and not r['returns_computed']
          assert not r['historical_PIT_verified'] and not r['historical_OOS_validated']
          assert r['trade_gate']=='BLOCKED' and r['orders']==[] and r['executable_candidates']==[]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-real-ma20-observation-${{ github.run_id }}
          path: |
            evidence/p4_ma20_forward_observation.json
            evidence/p4_trigger_provenance.json
            evidence/p4_real_holdout_forward_prices.json
            evidence/p4_holdout_direction_bias_audit.json
            evidence/p4_next_open_forward_proxy.json
            evidence/p4_observed_fee_friction.json
            evidence/p4_tplus1_barrier_touch.json
            evidence/p4_fee_floor_gap_audit.json
            evidence/p4_three_to_five_vendor_horizon.json
            evidence/p4_friday_asof_preentry_guard.json
            evidence/p4_synthetic_execution_contract.json
            evidence/p4_synthetic_friday_close_fixture.json
          retention-days: 14
