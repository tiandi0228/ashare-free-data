name: P4 real vendor MA20 forward observation (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p4_real_ma20_forward_observation.py'
      - 'collector/p4_independent_event_evidence.py'
      - 'collector/p4_real_holdout_forward_prices.py'
      - 'collector/p4_holdout_direction_bias_audit.py'
      - 'tests/test_p4_holdout_direction_bias_audit.py'
      - 'tests/test_p4_real_holdout_forward_prices.py'
      - 'tests/test_p4_independent_event_evidence.py'
      - 'tests/test_p4_real_ma20_forward_observation.py'
      - '.github/workflows/p4-real-ma20-forward-observation.yml'
  pull_request:
    paths:
      - '.github/workflows/p4-real-ma20-forward-observation.yml'
      - 'collector/p4_real_holdout_forward_prices.py'
      - 'collector/p4_holdout_direction_bias_audit.py'
      - 'tests/test_p4_holdout_direction_bias_audit.py'
      - 'tests/test_p4_real_holdout_forward_prices.py'
  workflow_run:
    workflows: ["P1 fresh Baostock mainboard roster observation (NO TRADES)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p4_real_ma20_forward_observation tests.test_p4_independent_event_evidence tests.test_p4_real_holdout_forward_prices tests.test_p4_holdout_direction_bias_audit -v
      - run: |
          git fetch --depth=1 origin research-csv-archive
          git worktree add --detach archived-research FETCH_HEAD
          ARCHIVE_COMMIT=$(git -C archived-research rev-parse HEAD)
          python -m collector.p4_real_ma20_forward_observation --root archived-research --cutoff 2025-12-31 --archive-commit "$ARCHIVE_COMMIT" --out evidence/p4_ma20_forward_observation.json
          python -m collector.p4_independent_event_evidence --root archived-research --manifest evidence/p4_ma20_forward_observation.json
          python -m collector.p4_real_holdout_forward_prices --root archived-research --manifest evidence/p4_ma20_forward_observation.json --out evidence/p4_real_holdout_forward_prices.json
          python -m collector.p4_holdout_direction_bias_audit --input evidence/p4_real_holdout_forward_prices.json --out evidence/p4_holdout_direction_bias_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/p4_real_holdout_forward_prices.json').read_text())
          d=json.loads(Path('evidence/p4_holdout_direction_bias_audit.json').read_text())
          assert d['status']=='DIRECTIONAL_OBSERVATION_BIAS_AUDITED_NOT_STRATEGY'
          assert d['event_total']==r['verified_ma20_crossing_events']
          assert d['observed_events']==r['observed_with_three_vendor_tradable_rows']
          assert d['observed_positive']==r['observed_positive_close_changes']
          assert d['observed_negative']==r['observed_negative_close_changes']
          assert d['observed_zero']==r['observed_zero_close_changes']
          assert d['source_archive_commit_sha']==r['archive_commit_sha']
          assert not d['win_rate_claimed'] and not d['trade_returns_calculated']
          assert d['trade_gate']=='BLOCKED' and d['orders']==[]
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('evidence/p4_ma20_forward_observation.json').read_text())
          result=json.loads(Path('evidence/p4_real_holdout_forward_prices.json').read_text())
          assert result['status']=='HOLDOUT_PRICE_OBSERVATIONS_NOT_BACKTEST'
          assert result['verified_ma20_crossing_events']==manifest['nonoverlapping_three_observation_crossing_events']
          assert result['observed_with_three_vendor_tradable_rows']==manifest['nonoverlapping_crossings_with_three_following_vendor_tradable_rows']
          assert result['fills_assumed']==0 and not result['returns_computed_as_trades']
          assert not result['historical_OOS_validated'] and not result['historical_PIT_verified']
          assert result['trade_gate']=='BLOCKED' and result['orders']==[] and result['executable_candidates']==[]
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          source=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          kind=os.environ["GITHUB_EVENT_NAME"]
          upstream=source.get("workflow_run",{}) if kind=="workflow_run" else {}
          if kind=="workflow_run":
              assert upstream["conclusion"]=="success"
              assert upstream["name"]=="P1 fresh Baostock mainboard roster observation (NO TRADES)"
          proof={"p4_trigger":kind,
                 "upstream_p1_run_id":upstream.get("id"),
                 "upstream_p1_conclusion":upstream.get("conclusion"),
                 "archive_commit_sha":json.loads(Path("evidence/p4_ma20_forward_observation.json").read_text())["archive_commit_sha"],
                 "trade_gate":"BLOCKED","orders":[]}
          Path("evidence/p4_trigger_provenance.json").write_text(json.dumps(proof,indent=2)+"\n")
          print("P4_TRIGGER_PROVENANCE",json.dumps(proof))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/p4_ma20_forward_observation.json').read_text())
          assert r['archive_commit_sha']==__import__('subprocess').check_output(['git','-C','archived-research','rev-parse','HEAD'],text=True).strip()
          assert r['independently_p2_checked_issuers']>0
          assert r['three_following_vendor_tradable_rows']<=r['post_cutoff_ma20_observations']
          assert r['entry_fills_assumed']==0 and not r['returns_computed']
          assert not r['historical_PIT_verified'] and not r['historical_OOS_validated']
          assert r['trade_gate']=='BLOCKED' and r['orders']==[] and r['executable_candidates']==[]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-real-ma20-observation-${{ github.run_id }}
          path: |
            evidence/p4_ma20_forward_observation.json
            evidence/p4_trigger_provenance.json
            evidence/p4_real_holdout_forward_prices.json
            evidence/p4_holdout_direction_bias_audit.json
          retention-days: 14
