name: Baostock free bounded eight-issuer pilot (RESEARCH ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-batch.yml'
      - 'collector/baostock_batch.py'
      - 'manifests/baostock_pilot.txt'
  schedule:
    - cron: '35 8 * * 1-5' # 16:35 Beijing weekday research sample
  workflow_dispatch:
    inputs:
      batch_index:
        type: choice
        required: true
        default: '0'
        options: ['0','1']
      source_manifest:
        type: choice
        required: true
        default: 'main16'
        options: ['main16','delisted8']
permissions:
  contents: read
concurrency:
  group: baostock-bounded-pilot
  cancel-in-progress: false
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local parser required by P3 offline PDF tests
        run: python -m pip install 'pypdf>=5,<7'
      - name: Offline contract tests
        run: python -m unittest discover -s tests -v
      - name: Install no-cost historical provider
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Select bounded research shard
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_INDEX: ${{ inputs.batch_index }}
          MANUAL_SOURCE: ${{ inputs.source_manifest }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import datetime
          from zoneinfo import ZoneInfo
          event=os.environ['EVENT_NAME']
          new=event=='workflow_dispatch' and os.environ['MANUAL_SOURCE']=='delisted8'
          i=int(os.environ['MANUAL_INDEX']) if event=='workflow_dispatch' else (0 if event=='push' else datetime.datetime.now(ZoneInfo('Asia/Shanghai')).date().toordinal()%2)
          assert i in (0,1) and (not new or i==0)
          print('index='+str(i))
          print('manifest='+('manifests/baostock_delisted_8_pilot.txt' if new else 'manifests/baostock_pilot.txt'))
          PY
      - name: Fetch at most eight issuer histories, at most one transient retry each
        run: timeout 155s python -m collector.baostock_batch --manifest "${{ steps.select.outputs.manifest }}" --batch-index "${{ steps.select.outputs.index }}" --out evidence
      - name: Preserve original CSVs and SHA256 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-BAOSTOCK-${{ steps.select.outputs.index }}-${{ github.run_id }}-BLOCKED
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail closed on partial or invalid source
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence/quality.json')
          assert p.exists(),'No audit evidence'
          r=json.loads(p.read_text())
          assert r['phase']=='BAOSTOCK_FREE_BOUNDED_BATCH'
          assert r['status']=='OBSERVED_SUBSET_UNVERIFIED'
          assert 1<=r['issuer_count']<=8 and r['query_attempts']==r['issuer_count']
          assert r['provider_attempts']>=r['query_attempts']
          assert r['provider_attempts']<=2*r['query_attempts']
          assert 0<=r['transient_retries']<=r['query_attempts']
          assert r['provider_attempts']==r['query_attempts']+r['transient_retries']
          assert r['trade_gate']=='BLOCKED' and not r['orders'] and not r['executable_candidates']
          assert r['paid_api_calls']==0 and r['historical_point_in_time_universe_verified'] is False
          for x in r['results']:
              assert x['status']=='OBSERVED_UNVERIFIED'
              raw=Path('evidence',x['code'].replace('.','_')+'.csv').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==x['sha256']
          print('PASS: bounded subset data observed; historical PIT and trading BLOCKED')
          PY
