name: P1 FREE eight-of-24 byte-identical SHA re-fetch (NO TRADES)

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'One of three frozen eight-issuer batches, 0/1/2'
        type: choice
        required: true
        default: '2'
        options: ['0', '1', '2']

permissions:
  contents: read

concurrency:
  group: ashare-24-frozen-source-reacquire
  cancel-in-progress: false

jobs:
  research_sha_reacquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ALL local safety regressions before network request
        run: |
          python -m py_compile collector/reacquire_24_pilot.py
          python -m unittest discover -s tests -v
      - name: Install free data vendor client
        run: python -m pip install 'baostock>=0.8,<1'
      - name: Exactly eight frozen issuer historical source queries, no retries
        env:
          EVENT_KIND: ${{ github.event_name }}
          MANUAL_BATCH: ${{ inputs.batch_index }}
        run: |
          if [ "$EVENT_KIND" = "workflow_dispatch" ]; then
            SELECTED="$MANUAL_BATCH"
          else
            SELECTED="2"
          fi
          case "$SELECTED" in
            0|1|2) ;;
            *) echo "Invalid frozen batch index"; exit 2 ;;
          esac
          timeout 170s python -m collector.reacquire_24_pilot \
            --batch-index "$SELECTED" --out evidence/frozen_24_batch_sha_comparison.json
      - name: Audit SHA results and never release trade gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/frozen_24_batch_sha_comparison.json')
          assert p.exists(), "No source capture or failure evidence"
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x["phase"]=="P1_FROZEN_24_SOURCE_REACQUIRE_EIGHT_NO_RAW_REDISTRIBUTION"
          assert x["batch_index"] in (0,1,2) and x["batch_size"]==8
          assert x["logical_query_limit"]==8 and x["logical_issuer_queries"]<=8
          assert x["paid_api_calls"]==0
          assert x["trade_gate"]=="BLOCKED"
          assert x["orders"]==[] and x["candidate_universe"]==[]
          assert x["executable_candidates"]==[]
          assert x["original_raw_CSV_durably_archived"] is False
          assert x["provider_market_data_republication_license_verified"] is False
          assert x["all_24_history_recovered_in_this_run"] is False
          assert x["official_exchange_historical_PIT_verified"] is False
          assert x["status"]=="EIGHT_SOURCE_BYTES_IDENTICAL_NOW_RESEARCH_ONLY", (
            "Fail closed on absent/revised source: "+x["status"]
          )
          assert x["identical_source_count"]==8
          assert len(x["source_entries"])==8
          assert all(r["sha256_matches_frozen_original"] is True for r in x["source_entries"])
          print("PASS: EIGHT old original source histories now SHA identical, research only")
          PY
      - name: Save only non-reconstructible SHA differences, no original CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-frozen24-eight-source-reacquire-digests-NO-TRADES
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
