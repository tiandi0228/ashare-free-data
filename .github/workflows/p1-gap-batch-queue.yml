name: P1 pinned missing shard queue (NO WRITES)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p1-gap-batch-queue.yml'
      - 'collector/p1_gap_batch_queue.py'
      - 'collector/p1_archive_audit.py'
      - 'collector/p1_gap_batch_readback.py'
      - 'tests/test_p1_gap_batch_readback.py'
      - 'tests/test_p1_gap_batch_queue.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p1_gap_batch_readback tests.test_p1_gap_batch_queue tests.test_p1_live_gap_rehearsal tests.test_p1_prewrite_gap_guard -v
      - name: Replay pinned roster, checkpoint and actual archive directories
        run: |
          main=316a7ef01ded61fe809dc03a10cd4b32f91b8068
          archive=968b47863467ebfd00154e38cdf50851f3c3285b
          git fetch --depth=1 origin "$main" "$archive"
          git worktree add --detach "$RUNNER_TEMP/p1-archive" "$archive"
          python -m collector.p1_gap_batch_queue --main-sha "$main" --archive-sha "$archive" \
            --replay-checkout "$RUNNER_TEMP/p1-archive" > p1-gap-batch-queue.json
      - name: Independently check a real prior archive change and a still-missing shard
        run: |
          git fetch --depth=8 origin 316a7ef01ded61fe809dc03a10cd4b32f91b8068 968b47863467ebfd00154e38cdf50851f3c3285b
          git worktree add --detach "$RUNNER_TEMP/p1-prior-archive" a37b9fd3a9b80c5a301f3ff7ab4b4796cb21413e
          python -m collector.p1_gap_batch_readback \
            --main-before 315ceb03f88ecfa02fcf6d9f0f4883fb90b3cd18 --main-after 316a7ef01ded61fe809dc03a10cd4b32f91b8068 \
            --archive-before a37b9fd3a9b80c5a301f3ff7ab4b4796cb21413e --archive-after 968b47863467ebfd00154e38cdf50851f3c3285b \
            --checkout-before "$RUNNER_TEMP/p1-prior-archive" --checkout-after "$RUNNER_TEMP/p1-archive" \
            --selected 343 232 > p1-gap-readback.json
          python -c 'import json; r=json.load(open("p1-gap-readback.json")); assert r["selected_durably_present"] == [343] and r["selected_still_missing"] == [232]'
      - uses: actions/upload-artifact@v4
        with:
          name: p1-pinned-gap-batch-queue
          path: |
            p1-gap-batch-queue.json
            p1-gap-readback.json
          if-no-files-found: error

  vendor-preflight:
    if: github.repository == 'tiandi0228/ashare-free-data' && github.event.pull_request.number == 361 && github.event.pull_request.head.repo.full_name == github.repository
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: p1-readonly-gap-vendor-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'baostock>=0.8,<1'
      - name: Fetch and independently verify the first pending two shards without archiving
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from collector.p1_fresh_shard_plan import plan
          from collector.p1_gap_remote_preflight import read_remote
          from collector.p1_live_gap_rehearsal import rehearse
          from collector.p1_quad_verify import verify
          from collector.p1_roster_lock import unpack

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = [231, 232]
          epoch = "5ba00fbd720fad90c343591cc33e885b824adf182306b893e5b3ed4030bff022"

          def preflight():
              receipt = rehearse(repo)
              if (receipt["proposed_manual_shards"] != expected or receipt["source_sha256"] != epoch
                      or receipt["archive_index_parity_checked"] is not True):
                  raise ValueError("target shards or roster changed; do not query")

          preflight()
          provider_env = {k: v for k, v in os.environ.items() if k not in ("GH_TOKEN", "GITHUB_TOKEN")}
          outcome = {"attempted": [], "verified": [], "archive_writes": 0, "checkpoint_writes": 0,
                     "trade_gate": "BLOCKED", "historical_PIT_verified": False, "orders": []}
          try:
              with TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  raw, meta = unpack(read_remote(repo, "evidence/p1_active_roster.json", "main"))
                  roster = root / "roster.csv"
                  roster.write_bytes(raw)
                  manifests = root / "manifests"
                  frozen = plan(roster, manifests, meta["requested_day"])
                  if frozen["source_sha256"] != epoch:
                      raise ValueError("manifest epoch changed")
                  for index in expected:
                      preflight()
                      outcome["attempted"].append(index)
                      dest = root / str(index)
                      process = subprocess.run([
                          "timeout", "--kill-after=5s", "150s", sys.executable, "-u", "-m",
                          "collector.baostock_batch", "--manifest", str(manifests / frozen["shards"][index]["name"]),
                          "--batch-index", "0", "--out", str(dest),
                      ], env=provider_env, check=False)
                      if process.returncode:
                          outcome["provider_exit_code"] = process.returncode
                          quality = dest / "quality.json"
                          if quality.exists():
                              diagnostic = json.loads(quality.read_bytes())
                              outcome["provider_failure_categories"] = sorted({
                                  row["failure_category"] for row in diagnostic.get("results", [])
                                  if isinstance(row.get("failure_category"), str)
                              } | ({diagnostic["failure_category"]}
                                   if isinstance(diagnostic.get("failure_category"), str) else set()))
                          raise SystemExit(process.returncode)
                      checked = verify(frozen, [(index, dest)], manifests)
                      outcome["verified"].append({"index": index, "issuers": checked["verified_issuers"],
                          "active_rows": checked["independently_checked_active_rows"],
                          "suspended_rows": checked["independently_checked_suspended_rows"]})
                  preflight()
          finally:
              Path("p1-gap-provider-preflight.json").write_text(json.dumps(outcome, indent=2) + "\n")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-gap-provider-preflight
          path: p1-gap-provider-preflight.json
          if-no-files-found: warn
