name: P2 P3 real artifact-backed selection smoke test (NO TRADES)
on:
  pull_request:
    paths:
      - '.github/workflows/p2-p3-artifact-backed-real-readonly.yml'
      - 'collector/p2_p3_artifact_source_select.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  artifact-backed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source selection is artifact-backed and fails closed when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-proof"
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          from collector.p2_p3_artifact_source_select import resolve

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source-proof"
          repo = os.environ["GITHUB_REPOSITORY"]

          def gh(*args):
              return json.loads(subprocess.check_output(["gh", *args], text=True))
          def runs(workflow):
              return gh("run", "list", "-R", repo, "--workflow", workflow,
                        "--limit", "100", "--json", "databaseId,conclusion,event")
          def artifacts(run_id):
              return gh("api", f"repos/{repo}/actions/runs/{run_id}/artifacts",
                        "--method", "GET", "-f", "per_page=100")["artifacts"]

          try:
              selected = resolve(runs, artifacts)
          except ValueError as exc:
              if "no successful non-expired evidence artifact found for " not in str(exc):
                  raise
              outcome = {"status": "MISSING_REQUIRED_SOURCE_FAIL_CLOSED",
                         "reason": str(exc), "trade_gate": "BLOCKED",
                         "orders": [], "historical_PIT_verified": False}
              print("Expected guarded rejection:", exc)
          else:
              assert selected["trade_gate"] == "BLOCKED"
              assert selected["orders"] == []
              assert selected["official_PIT_certified"] is False
              outcome = selected
              print("Both required sources selected:", selected)
          (root / "selection-outcome.json").write_text(json.dumps(outcome, indent=2))
          PY
      - name: Independently download available historical P2 and P3 research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source-proof"
          outcome = json.loads((root / "selection-outcome.json").read_text())
          assert outcome["trade_gate"] == "BLOCKED" and outcome["orders"] == []
          # These are independent historical research artifacts, NOT substitutes
          # for the exact required p2-original-gap-triage-<run_id> source.
          sources = (
              ("historical-p2", 45313779368, "p2-392-original-mixed-gap-replay"),
              ("historical-p3", 45246691330, "p3-full-p1-official-scout-45246691330"),
          )
          for kind, run_id, name in sources:
              metadata = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{repo}/actions/runs/{run_id}/artifacts",
                  "--method", "GET", "-f", "per_page=100"], text=True))
              matches = [a for a in metadata["artifacts"] if a.get("name") == name]
              assert len(matches) == 1, "historical artifact missing/ambiguous: " + kind
              artifact = matches[0]
              assert artifact["expired"] is False
              assert type(artifact["size_in_bytes"]) is int and artifact["size_in_bytes"] > 0
              dest = root / kind
              dest.mkdir()
              subprocess.run(["gh", "run", "download", str(run_id), "-R", repo,
                              "-n", name, "-D", str(dest)], check=True, timeout=90)
              files = [p for p in dest.rglob("*") if p.is_file()]
              assert files and any(p.stat().st_size > 0 for p in files)
              print(kind, "downloaded", len(files), "files")
          print("PASS historical evidence transport; no source substitution or PIT certification")
          PY
      - name: Publish explicit evidence status
        if: success()
        run: |
          {
            echo '### Source availability and historical transport smoke test'
            echo 'The selector either found precisely named sources or failed closed.'
            echo 'Known historical P2/P3 research artifacts were independently downloadable.'
            echo 'Historical transport success does not repair any missing required production source.'
            echo 'No epoch join, original replay, PIT certification or trading eligibility is claimed.'
            echo 'trade_gate=BLOCKED; orders=[]'
          } >> "$GITHUB_STEP_SUMMARY"
