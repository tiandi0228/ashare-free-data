name: P2 original gaps vs P3 official research crosswalk (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p2_p3_gap_crosswalk.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p2_p3_workflow_epoch_binding.py'
      - 'collector/p2_p3_current_source_guard.py'
      - 'collector/p2_p3_issuer_proof_action_queue.py'
      - 'collector/p3_gap_original_provenance_index.py'
      - 'tests/test_p3_gap_original_provenance_index.py'
      - 'tests/test_p2_p3_issuer_proof_action_queue.py'
      - 'tests/test_p2_p3_current_source_guard.py'
      - 'tests/test_p2_p3_gap_crosswalk.py'
      - '.github/workflows/p2-p3-original-gap-crosswalk.yml'
  workflow_run:
    workflows:
      - "P2 original CSV 21-bar gap root-cause audit (NO TRADES)"
      - "P3 rotating official originals for full audited P1 issuer queue (NO TRADES)"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'collector/p2_p3_gap_crosswalk.py'
      - 'collector/p1_active_migration_checkpoint.py'
      - 'tests/test_p2_p3_workflow_epoch_binding.py'
      - 'collector/p2_p3_current_source_guard.py'
      - 'collector/p2_p3_issuer_proof_action_queue.py'
      - 'collector/p3_gap_original_provenance_index.py'
      - 'tests/test_p3_gap_original_provenance_index.py'
      - 'tests/test_p2_p3_issuer_proof_action_queue.py'
      - 'tests/test_p2_p3_current_source_guard.py'
      - 'tests/test_p2_p3_gap_crosswalk.py'
      - '.github/workflows/p2-p3-original-gap-crosswalk.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original issuer join without promoting PIT
        run: python -m unittest -v tests.test_p2_p3_gap_crosswalk tests.test_p2_original_gap_window_triage tests.test_p2_p3_current_source_guard tests.test_p2_p3_issuer_proof_action_queue tests.test_p3_gap_original_provenance_index tests.test_p2_p3_workflow_epoch_binding
  replay_once:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve latest successful P2 and P3 archival source runs (no frozen historical IDs)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sources/p2 evidence/sources/p3
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def latest(workflow):
              rows=json.loads(subprocess.check_output([
                  'gh','run','list','--workflow',workflow,'--limit','30',
                  '--json','databaseId,conclusion,event'],text=True))
              valid=[r for r in rows if r['conclusion']=='success'
                     and r['event']!='pull_request']
              if not valid:raise ValueError('no successful authentic source run: '+workflow)
              return max(r['databaseId'] for r in valid)
          p2=latest('p2-original-gap-window-triage.yml')
          p3=latest('p3-full-p1-official-scout.yml')
          if os.environ['GITHUB_EVENT_NAME']=='workflow_run':
              event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              run=event['workflow_run']
              if run['conclusion']!='success':
                  raise ValueError('invalid upstream success status')
              if run['name']=='P2 original CSV 21-bar gap root-cause audit (NO TRADES)':
                  p2=run['id']
              elif run['name']=='P3 rotating official originals for full audited P1 issuer queue (NO TRADES)':
                  p3=run['id']
              else:raise ValueError('unrecognized upstream research workflow')
          result={'p2_run_id':p2,'p3_run_id':p3}
          Path('evidence/sources/selected-runs.json').write_text(json.dumps(result))
          print('P2/P3 DYNAMIC SOURCE RUNS:',result)
          PY
          P2_RUN=$(python -c "import json;print(json.load(open('evidence/sources/selected-runs.json'))['p2_run_id'])")
          P3_RUN=$(python -c "import json;print(json.load(open('evidence/sources/selected-runs.json'))['p3_run_id'])")
          gh run download "$P2_RUN" -R "${{ github.repository }}" -n "p2-original-gap-triage-$P2_RUN" -D evidence/sources/p2
          gh run download "$P3_RUN" -R "${{ github.repository }}" -n "p3-full-p1-official-scout-$P3_RUN" -D evidence/sources/p3
      - name: Resolve active P1 roster and checkpoint (fail closed, same code commit)
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sources
          python -m collector.p1_active_migration_checkpoint \
            --root . \
            --out evidence/sources/current-p1-checkpoint.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Read durable P2 summary for active validated P1 epoch
        shell: bash
        run: |
          set -euo pipefail
          EPOCH="${{ steps.pin.outputs.source_epoch }}"
          PREFIX="${EPOCH:0:16}"
          test "${#EPOCH}" -eq 64
          git fetch --depth=1 origin p2-feature-coverage
          mkdir -p evidence/sources/coverage
          git show "FETCH_HEAD:summaries/$PREFIX.json" > evidence/sources/coverage/current.json
          python - <<'PY'
          import json
          from pathlib import Path
          active=json.loads(Path('evidence/sources/current-p1-checkpoint.json').read_text())
          coverage=json.loads(Path('evidence/sources/coverage/current.json').read_text())
          if (coverage.get('source_epoch_sha256')!=active['source_sha256']
              or coverage.get('checkpoint_completed_shards')!=active['completed_shards']
              or coverage.get('trade_gate')!='BLOCKED'
              or coverage.get('historical_PIT_verified') is not False
              or coverage.get('coverage_certified_for_trading') is not False):
              raise ValueError('P2 coverage stale or unsafe for active P1 checkpoint')
          PY
      - name: Verify current P2 gap membership and current P3 P1 source epoch, then join unverified texts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          def unique(root,name):
              files=list(Path(root).rglob(name))
              if len(files)!=1:raise ValueError('Missing/ambiguous archival source '+name)
              return str(files[0])
          chosen=json.loads(Path('evidence/sources/selected-runs.json').read_text())
          p2=unique('evidence/sources/p2','p2-original-gap-triage.json')
          p3queue=unique('evidence/sources/p3','full_p1_queue.json')
          event=unique('evidence/sources/p3','p3_all_archived_original_event_episodes.json')
          pairs=unique('evidence/sources/p3','p3_all_resume_original_text_pairs.json')
          coverage='evidence/sources/coverage/current.json'
          subprocess.run([
              'python','-m','collector.p2_p3_current_source_guard',
              '--p2-gaps',p2,'--p2-coverage',coverage,
              '--p3-queue',p3queue,
              '--p2-run',str(chosen['p2_run_id']),
              '--p3-run',str(chosen['p3_run_id']),
              '--out','evidence/p2-p3-source-provenance.json'],check=True)
          subprocess.run([
              'python','-m','collector.p2_p3_gap_crosswalk',
              '--p2-gap-triage',p2,
              '--p3-event-episodes',event,
              '--p3-pairs',pairs,
              '--out','evidence/p2-p3-gap-crosswalk.json'],check=True)
          guard=json.loads(Path('evidence/p2-p3-source-provenance.json').read_text())
          result=json.loads(Path('evidence/p2-p3-gap-crosswalk.json').read_text())
          if (result['gap_issuers_examined']!=guard['p2_vendor_gap_issuers']
              or sorted(x['issuer'] for x in result['issuer_evidence'])!=guard['issuer_codes']
              or result['official_halt_intervals_authenticated']!=0
              or result['feature_gaps_resolved']!=0
              or result['historical_PIT_verified'] is not False
              or result['trade_gate']!='BLOCKED' or result['orders']!=[]):
              raise ValueError('P2/P3 issuer join not same-source or falsely certified')
          subprocess.run([
              'python','-m','collector.p2_p3_issuer_proof_action_queue',
              '--crosswalk','evidence/p2-p3-gap-crosswalk.json',
              '--guard','evidence/p2-p3-source-provenance.json',
              '--out','evidence/p2-p3-issuer-proof-action-queue.json'],check=True)
          review=json.loads(Path('evidence/p2-p3-issuer-proof-action-queue.json').read_text())
          assert review['gap_issuer_count']==result['gap_issuers_examined']
          assert review['unresolved_issuer_count']==guard['p2_vendor_gap_issuers']
          assert sum(review['review_action_counts'].values())==review['gap_issuer_count']
          assert review['official_halt_intervals_certified']==0
          assert review['feature_gaps_resolved']==0
          assert review['historical_PIT_verified'] is False
          assert review['trade_gate']=='BLOCKED' and review['orders']==[]
          subprocess.run([
              'python','-m','collector.p3_gap_original_provenance_index',
              '--queue','evidence/p2-p3-issuer-proof-action-queue.json',
              '--events',event,'--pairs',pairs,
              '--out','evidence/p3-gap-original-pdf-source-index.json'],check=True)
          pdf=json.loads(Path('evidence/p3-gap-original-pdf-source-index.json').read_text())
          assert pdf['gap_issuer_count']==review['gap_issuer_count']
          assert pdf['issuer_with_original_halt_resume_text']==review['issuer_with_same_issuer_text_lead']
          assert pdf['issuer_with_resume_text_pair']==review['issuer_with_resume_text_pair']
          assert pdf['source_epoch_sha256']==review['source_epoch_sha256']
          assert pdf['authenticated_first_publication_count']==0
          assert pdf['certified_exchange_intervals']==0 and pdf['feature_gaps_resolved']==0
          assert pdf['historical_PIT_verified'] is False
          assert pdf['trade_gate']=='BLOCKED' and pdf['orders']==[]
          print('P3 ORIGINAL PDF SOURCE LOCATORS:',pdf['total_source_document_text_leads'],
                'event text references and',pdf['total_sha_linked_resume_text_pairs'],
                'uncertified text pairs; no historical PIT promotion')
          print('P2/P3 SOURCE-SHA OFFICIAL PROOF TASKS:',
                json.dumps(review['review_action_counts'],sort_keys=True))
          print('P2/P3 CURRENT ORIGINAL SHA RESEARCH CROSSWALK:',
                guard['p2_current_archived_shards'],'P1 shards,',
                result['gap_issuers_examined'],'gap issuers,',
                result['gap_issuers_with_same_issuer_official_pdf_text_lead'],
                'same-issuer text leads; 0 certified PIT intervals')
          PY
      - name: Archive source-bound report without modifying original vendor or official evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-p3-original-gap-crosswalk-${{ github.run_id }}
          path: |
            evidence/p2-p3-gap-crosswalk.json
            evidence/p2-p3-source-provenance.json
            evidence/p2-p3-issuer-proof-action-queue.json
            evidence/p3-gap-original-pdf-source-index.json
            evidence/sources/selected-runs.json
            evidence/sources/current-p1-checkpoint.json
          if-no-files-found: warn
          retention-days: 14
