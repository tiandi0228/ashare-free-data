name: P1 cron delay incident offline validation (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p1_schedule_run_provenance.py'
      - 'tests/test_p1_schedule_run_provenance.py'
      - '.github/workflows/p1-cron-delay-incident-offline.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p1_schedule_run_provenance.py'
      - 'tests/test_p1_schedule_run_provenance.py'
      - '.github/workflows/p1-cron-delay-incident-offline.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_p1_schedule_run_provenance
