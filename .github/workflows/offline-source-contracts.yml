name: Public market-data contract tests (OFFLINE, NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - 'collector/baostock_dated_universe.py'
      - 'tests/test_baostock_dated_universe.py'
      - 'tests/test_delisted_backfill_pilot.py'
      - 'manifests/baostock_delisted_8_pilot.txt'
      - 'collector/baostock_batch.py'
      - 'collector/batch.py'
      - 'tests/test_batch.py'
      - 'collector/p1_roster_shard_manifest.py'
      - 'tests/test_p1_roster_shard_manifest.py'
      - 'collector/research_24_coverage_gate.py'
      - 'tests/test_research_24_coverage_gate.py'
      - 'collector/vendor_historical_st_probe.py'
      - 'tests/test_vendor_historical_st_probe.py'
      - 'reports/p1_delisted_8_source_digests_20261021.json'
      - 'collector/source_retention_gate.py'
      - 'tests/test_source_retention_gate.py'
      - 'reports/source_artifact_inventory_20261021.json'
      - 'collector/reacquire_source_digest.py'
      - 'tests/test_reacquire_source_digest.py'
      - 'collector/reacquire_24_pilot.py'
      - 'tests/test_reacquire_24_pilot.py'
      - 'collector/p1_early_only_recovery.py'
      - 'tests/test_p1_early_only_recovery.py'
      - 'tests/test_p1_eight_committed_receipt_integrity.py'
      - 'collector/p1_eight_reacquire_compare.py'
      - 'tests/test_p1_eight_reacquire_compare.py'
      - 'collector/p3_historical_evidence_coverage.py'
      - 'tests/test_p3_historical_evidence_coverage.py'
      - 'collector/p3_evidence_gap_report.py'
      - 'tests/test_p3_evidence_gap_report.py'
      - 'collector/p3_real_receipt_gap.py'
      - 'tests/test_p3_real_receipt_gap.py'
      - 'collector/p3_sse_official_receipt_gap.py'
      - 'tests/test_p3_sse_official_receipt_gap.py'
      - 'collector/p3_cross_publisher_replay.py'
      - 'tests/test_p3_cross_publisher_replay.py'
      - 'collector/p4_real_source_readiness.py'
      - 'collector/p4_prospective_handoff.py'
      - 'collector/p3_typed_event_research_ledger.py'
      - 'collector/p3_multi_issuer_research_events.py'
      - 'collector/p3_exchange_notice_event_reconciliation.py'
      - 'collector/p3_exchange_research_handoff.py'
      - 'tests/test_p3_exchange_research_handoff.py'
      - 'tests/test_p3_exchange_notice_event_reconciliation.py'
      - 'tests/test_p3_multi_issuer_research_events.py'
      - 'tests/test_p3_typed_event_research_ledger.py'
      - 'tests/test_p4_prospective_handoff.py'
      - 'tests/test_p4_real_source_readiness.py'
      - 'collector/p3_capture_temporal_boundary.py'
      - 'tests/test_p3_capture_temporal_boundary.py'
      - 'reports/p3_sse_independent_two_originals_verified_20261022.json'
      - 'reports/p3_cninfo_two_pdf_independent_sha_recapture_20261022.json'
      - 'reports/p3_sse_two_official_original_sha_observed_20261022.json'
      - 'reports/p1_early_only_8_historical_research_20261022.json'
      - 'collector/audit_dated_rosters.py'
      - 'tests/test_audit_dated_rosters.py'
      - 'collector/audit_24_reacquisition.py'
      - 'tests/test_audit_24_reacquisition.py'
      - 'reports/p1_reacquire_8_of_24_batch_2_20261021.json'
      - 'reports/p1_reacquire_16_batches_01_20261021.json'
      - '.github/workflows/offline-source-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: offline-source-contracts
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline source-contract modules
        run: python -m py_compile collector/baostock_dated_universe.py collector/baostock_batch.py collector/p1_roster_shard_manifest.py collector/research_24_coverage_gate.py collector/vendor_historical_st_probe.py collector/source_retention_gate.py collector/reacquire_source_digest.py collector/reacquire_24_pilot.py collector/p1_early_only_recovery.py collector/audit_dated_rosters.py collector/audit_24_reacquisition.py collector/p4_prospective_handoff.py collector/p3_typed_event_research_ledger.py collector/p3_multi_issuer_research_events.py
      - name: Verify fail-closed source tests without installing a provider or contacting markets
        run: python -m unittest discover -s tests -v
      - name: Audit real CNINFO two-PDF receipt against frozen P3 decision days
        run: |
          python -m collector.p3_real_receipt_gap --out audit/p3_real_600421_evidence_gaps.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('audit/p3_real_600421_evidence_gaps.json').read_text())
          assert q['required_evidence_cells']==28 and q['verified_evidence_cells']==0
          assert q['missing_evidence_cells']==28 and q['issuer_documents_observed']==2
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          print('PASS: two authentic issuer capture receipts; zero independently official PIT-complete cells')
          PY
      - name: Reconcile real SSE official page receipt without promoting PIT
        run: |
          python -m collector.p3_sse_official_receipt_gap --out audit/p3_sse_official_600421_gap.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('audit/p3_sse_official_600421_gap.json').read_text())
          assert q['official_host_pages_observed']==2
          assert q['verified_evidence_cells']==0 and q['missing_evidence_cells']==28
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          print('PASS: official SSE source verified as observed; full historical PIT still blocked')
          PY
      - name: Reconcile four real CNINFO and SSE independently replayed originals
        run: |
          python -m collector.p3_cross_publisher_replay --out audit/p3_cross_publisher_replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit/p3_cross_publisher_replay.json').read_text())
          assert r['independently_replayed_originals']==4
          assert r['trade_gate']=='BLOCKED' and r['orders']==[]
          assert r['historical_publication_instant_verified'] is False
          print('PASS: 4/4 independently matched originals; official historical PIT still unverified')
          PY
      - name: Generate typed issuer event chronology without asserting effective states
        run: |
          python -m collector.p3_typed_event_research_ledger --out audit/p3_typed_event_research_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('audit/p3_typed_event_research_ledger.json').read_text())
          assert q['row_count']==3 and q['confirmed_exchange_effective_event_count']==0
          assert all(x['confirmed_effective_date'] is None for x in q['rows'])
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          PY
      - name: Reconcile authentic SSE delisting effective-date notice
        run: |
          python -m collector.p3_exchange_notice_event_reconciliation --out audit/p3_sse_delist_effective_date_research.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("audit/p3_sse_delist_effective_date_research.json").read_text())
          assert x["observed_official_notice_event_count"]==1
          assert x["historical_point_in_time_issuer_state_count"]==0
          assert x["rows"][0]["effective_date_as_stated_in_observed_official_notice"]=="2026-06-26"
          assert x["trade_gate"]=="BLOCKED" and x["orders"]==[]
          PY
      - name: Reconcile SSE notice and typed issuer ledger as research only
        run: |
          python -m collector.p3_exchange_research_handoff --out audit/p3_exchange_research_handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit/p3_exchange_research_handoff.json').read_text())
          assert r['observed_exchange_effective_date_notices']==1
          assert r['historically_authenticated_effective_dates']==0
          assert r['historical_PIT_state_eligible'] is False
          assert r['trade_gate']=='BLOCKED' and r['orders']==[]
          PY
      - name: P4 readiness from real evidence, not fictional backtest
        run: |
          python -m collector.p4_real_source_readiness --out audit/p4_real_source_readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('audit/p4_real_source_readiness.json').read_text())
          assert q['required_conditions']==6 and q['verified_conditions']==1
          assert q['status']=='NOT_READY_RESEARCH_ONLY'
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          print('PASS: real provenance present but P4 not ready for OOS/backtest/trading')
          PY
      - name: Verify actual capture observation time is not backdated as PIT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collector.p3_capture_temporal_boundary import observe
          root=Path("reports")
          q=observe(
            json.loads((root/"p3_cninfo_two_pdf_independent_sha_recapture_20261022.json").read_text()),
            json.loads((root/"p3_sse_two_official_original_sha_observed_20261022.json").read_text()))
          assert q["document_count"]==4 and q["historical_availability_verified"] is False
          assert q["trade_gate"]=="BLOCKED" and q["orders"]==[]
          Path("audit").mkdir(exist_ok=True)
          (Path("audit")/"p3_observed_capture_temporal_boundary.json").write_text(json.dumps(q,indent=2)+"\\n")
          print("PASS: all four original receipts observed in October, not authenticated as of prior decision days")
          PY
      - name: Aggregate 24 independently replayed research issuer SHA receipts only
        run: |
          python -m collector.research_24_coverage_gate --out audit/24_research_source_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/24_research_source_coverage.json')
          q=json.loads(p.read_text())
          assert q['frozen_issuer_count']==24
          assert q['original_source_rows']==11563
          assert q['trade_status_1_rows']==11523
          assert q['trade_status_0_rows']==40
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          assert q['official_historical_point_in_time_issuer_pool_verified'] is False
          assert q['full_mainboard_historical_backfill_complete'] is False
          print('PASS: 24 limited research issuers, NOT official complete mainboard coverage')
          PY
      - name: Re-check FOUR real original Artifacts from GitHub API (no market queries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]
          ids=(39572697952,39573265839,39589103403,39602222641)
          runs=[]
          for run_id in ids:
              out=subprocess.run(
                  ["gh","api",f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"],
                  capture_output=True,text=True,check=True,timeout=20,
              )
              raw=json.loads(out.stdout)
              runs.append({"run_id":run_id,"artifacts":[{
                  k:a.get(k) for k in ("id","name","created_at","expires_at","expired")
              } for a in raw["artifacts"]]})
          q={"repository":repo,
             "inspected_at_utc":datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
             "runs":runs}
          Path("audit").mkdir(exist_ok=True)
          Path("audit/live_artifacts.json").write_text(json.dumps(q,indent=2)+"\n")
          print("Read GitHub Actions retention metadata for exactly 4 known captures.")
          PY
      - name: Audit live retention, licensing blocker, and fail-closed trade gate
        run: |
          python -m collector.source_retention_gate \
            --inventory audit/live_artifacts.json \
            --out audit/original_source_retention_readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("audit/original_source_retention_readiness.json").read_text())
          assert q["phase"]=="P1_P3_FREE_GITHUB_ORIGINAL_RETENTION_PREFLIGHT"
          assert q["original_artifacts_expected"]==4
          assert q["retention_is_permanent"] is False
          assert q["license_for_public_vendor_CSV_redistribution_verified"] is False
          assert q["public_GitHub_Releases_is_approved_storage"] is False
          assert q["original_source_archive_replay_ready"] is False
          assert q["historical_point_in_time_authority_verified"] is False
          assert q["trade_gate"]=="BLOCKED" and q["orders"]==[]
          assert q["executable_candidates"]==[] and q["candidate_universe"]==[]
          print("Artifact inventory:",q["status"],
                "currently available",q["original_artifacts_currently_available"],
                "/4, min days",q["minimum_remaining_days"])
          print("PASS: data storage/license and official PIT stay BLOCKED")
          PY
      - name: Independently reconcile all three 24-source re-fetch receipts
        run: |
          python -m collector.audit_24_reacquisition --out audit/p1_24_source_sha_reacquisition.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('audit/p1_24_source_sha_reacquisition.json').read_text())
          assert q['status']=='24_FROZEN_RESEARCH_SOURCE_BYTES_IDENTICAL_AT_CAPTURE_TIME'
          assert q['matching_issuers']==24
          assert q['verified_reacquired_rows']==11563
          assert q['number_of_independent_capped_batches']==3
          assert q['source_raw_originals_permanently_archived'] is False
          assert q['license_for_public_raw_market_CSV'] is False
          assert q['vendor_historical_revisions_impossible'] is False
          assert q['complete_mainboard_PIT_verified'] is False
          assert q['p3_historical_official_ST_halt_delist_verified'] is False
          assert q['p4_actual_OOS_validated'] is False
          assert q['trade_gate']=='BLOCKED'
          assert q['orders']==[] and q['executable_candidates']==[]
          print('PASS: all 24 research-only source hashes match now; official PIT/trading blocked')
          PY
      - name: Retain non-reconstructible 24-source coverage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-24-issuer-SHA-coverage-research-BLOCKED
          path: audit/
          if-no-files-found: warn
          retention-days: 30
