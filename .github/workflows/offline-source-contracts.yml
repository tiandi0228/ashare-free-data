name: Public market-data contract tests (OFFLINE, NO TRADES)

on:
  push:
    branches: [main]
    paths:
      - 'collector/baostock_dated_universe.py'
      - 'tests/test_baostock_dated_universe.py'
      - 'tests/test_delisted_backfill_pilot.py'
      - 'manifests/baostock_delisted_8_pilot.txt'
      - 'collector/baostock_batch.py'
      - 'collector/research_24_coverage_gate.py'
      - 'tests/test_research_24_coverage_gate.py'
      - 'collector/vendor_historical_st_probe.py'
      - 'tests/test_vendor_historical_st_probe.py'
      - 'reports/p1_delisted_8_source_digests_20261021.json'
      - '.github/workflows/offline-source-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-source-contracts
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline source-contract modules
        run: python -m py_compile collector/baostock_dated_universe.py collector/baostock_batch.py collector/research_24_coverage_gate.py collector/vendor_historical_st_probe.py
      - name: Verify fail-closed source tests without installing a provider or contacting markets
        run: python -m unittest discover -s tests -v
      - name: Aggregate 24 independently replayed research issuer SHA receipts only
        run: |
          python -m collector.research_24_coverage_gate --out audit/24_research_source_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit/24_research_source_coverage.json')
          q=json.loads(p.read_text())
          assert q['frozen_issuer_count']==24
          assert q['original_source_rows']==11563
          assert q['trade_status_1_rows']==11523
          assert q['trade_status_0_rows']==40
          assert q['trade_gate']=='BLOCKED' and q['orders']==[]
          assert q['official_historical_point_in_time_issuer_pool_verified'] is False
          assert q['full_mainboard_historical_backfill_complete'] is False
          print('PASS: 24 limited research issuers, NOT official complete mainboard coverage')
          PY
      - name: Retain non-reconstructible 24-source coverage metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-24-issuer-SHA-coverage-research-BLOCKED
          path: audit/
          if-no-files-found: warn
          retention-days: 30
