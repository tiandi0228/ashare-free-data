name: P3 SHA-paired halt targeting offline acceptance (NO TRADES)
on:
  pull_request:
    paths:
      - 'collector/p3_resume_followup_discovery.py'
      - 'tests/test_p3_resume_followup_discovery.py'
      - '.github/workflows/p3-unpaired-rotation-offline.yml'
  push:
    branches: [main]
    paths:
      - 'collector/p3_resume_followup_discovery.py'
      - 'tests/test_p3_resume_followup_discovery.py'
      - '.github/workflows/p3-unpaired-rotation-offline.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm original-SHA research pairing scope and fail-closed selection
        run: python -m unittest -v tests.test_p3_resume_followup_discovery tests.test_p3_halt_resume_pair_review
