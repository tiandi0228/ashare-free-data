name: P4 SSE notice text date checks (NO TRADES)
on:
  push:
    branches: [main]
    paths:
      - 'collector/p4_sse_notice_body_dates.py'
      - 'tests/test_p4_sse_notice_body_dates.py'
      - '.github/workflows/p4-sse-notice-body.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p4_sse_notice_body_dates -v
      - run: |
          python -m collector.p4_sse_notice_body_dates --out evidence/p4_sse_body.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("evidence/p4_sse_body.json").read_text())
          assert x['trade_gate']=='BLOCKED' and x['orders']==[]
          assert x['historical_exchange_calendar_authenticated'] is False
          print("SSE BODY DATE CHECK:",[(i["year"],i["fetch_status"],len(i["ranges_missing_textual_dates"]),len(i.get("ranges_without_adjacent_closure_phrase",[]))) for i in x["results"]])
          assert all(i["fetch_status"]=="FETCHED" for i in x["results"])
          assert all(not i["ranges_missing_textual_dates"] for i in x["results"])
          assert all(not i["ranges_without_adjacent_closure_phrase"] for i in x["results"]), "Source semantic span coverage incomplete"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-sse-body-${{ github.run_id }}
          path: evidence/p4_sse_body.json
          retention-days: 14
